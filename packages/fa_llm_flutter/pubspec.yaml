name: fa_llm_flutter
description: >-
  Flutter-specific on-device LLM providers for fa_llm.
  Includes FlutterGemma on-device inference.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'

dependencies:
  flutter:
    sdk: flutter
  fa_llm:
    path: ../fa_llm
  flutter_gemma: ^1.5.2
  meta: ^1.18.0

dev_dependencies:
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.0
