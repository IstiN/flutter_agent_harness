name: fa_ui
description: >-
  Reusable UI for apps embedding the Fa agent: the Fa brand theme (dark +
  light, customizable via FaUiTheme), and ready-made provider/model settings
  widgets (provider presets, custom-provider registry, media model slots)
  with host-overridable strings.
version: 0.0.1
publish_to: none

environment:
  sdk: ^3.12.2
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter

  # The local flutter_agent_harness package (pure Dart core): ExecutionEnv
  # for the persisted stores, AgentConfig for the connect flow, and the
  # shared /models endpoint parser.
  flutter_agent_harness:
    path: ../../

  # ChatTheme for the flutter_chat_ui theme builders.
  flutter_chat_core: ^2.9.0

  # The chat transcript UI (chat/): markdown rendering and the chat surface.
  flutter_markdown: ^0.7.7+1
  flutter_chat_ui: ^2.11.1

  # Inline playback of sandbox-generated media (chat/media_player.dart):
  # audio plays from in-memory bytes, video from a temp file staged via
  # path_provider (video is not supported in the web build).
  audioplayers: ^6.8.1
  video_player: ^2.13.0
  path_provider: ^2.1.6

  # The /models endpoint fetch behind the model quick select.
  http: ^1.6.0

  # Opens the OpenRouter OAuth authorization page in the system browser.
  url_launcher: ^6.3.1

  # Brand SVG marks (provider tiles, see providers/provider_marks.dart).
  flutter_svg: ^2.3.0

  # Shared LLM abstractions and the Flutter on-device Gemma provider. fa_ui
  # stays UI-only for presets/config, but exposes helpers that map its
  # connection config onto the fa_llm types hosts use to build providers.
  fa_llm:
    path: ../fa_llm
  fa_llm_flutter:
    path: ../fa_llm_flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_localizations:
    sdk: flutter

dependency_overrides:
  # Same pin as flutter_app: Flutter 3.44.4 pins meta 1.18.0 while
  # dart_tui 2.0.0 (via flutter_agent_harness) declares ^1.19.0 but does
  # not appear to use 1.19-only APIs. Without this the package's own tests
  # cannot resolve.
  meta: 1.18.0
  # flutter_agent_memory (hosted, ^0.0.4) depends on the hosted fa_llm
  # ^0.1.0 while this package pins the path version — force the path one.
  fa_llm:
    path: ../fa_llm

flutter:
  uses-material-design: true
