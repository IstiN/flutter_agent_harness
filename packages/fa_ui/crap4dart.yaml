# crap4dart configuration for the fa_ui package.
# https://github.com/IstiN/crap4dart
#
# RATCHET (issue #1848): the threshold is pinned at the CURRENT worst score
# measured by the SAME pipeline the card mandates — the fa_ui flutter test
# shard lcov (scripts/faui_test_shards.json, merged by faui-coverage).
# Pushes may only make the codebase BETTER, never worse; lower the
# threshold whenever the top offenders are fixed. Only down.

sources: [lib]

exclude:
  - '**.g.dart'
  - '**.freezed.dart'
  - '**.mocks.dart'
  - 'build/**'

crap:
  enabled: true
  # Tier 2 (issue #1848, fa_ui 48->24 of the 132->48->24->12 ladder): tier 1
  # (#1887) covered the sixteen 0%-cov methods above 48; this tier covered
  # the eleven remaining 0%-cov methods (CC4-6) with real branch tests and
  # decomposed the thirty-three covered CC14-29 methods into cohesive
  # private helpers (<=CC5 pieces at >=85% cov, <=CC3 where a piece stays
  # 0%-cov). The NEW measured worst is 13.4545… — providerMarkKeyForBaseUrl
  # (provider_marks.dart, CC 11 @ 73%); the threshold is pinned there.
  # Tier 3 (24->12) owns the last two methods over 12. Only down.
  threshold: 13.454545454545453

coverage:
  # run_tests: false — the merged shard lcov (faui-coverage artifact /
  # scripts/merge_lcov.py) is the source; never re-run the suite here.
  run_tests: false
  lcov_path: coverage/lcov.info
  required: true
  branch_coverage: true
