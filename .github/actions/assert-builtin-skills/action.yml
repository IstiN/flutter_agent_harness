name: 'Assert built-in skills packaged (gh-1275 AC3)'
description: >-
  Release gate for built-in skill PACKAGED CONTENT: fail fast before any
  build minute is spent if a built-in skill would ship without a non-empty
  SKILL.md — the 1.0.512 empty-skill-dirs incident (structure packaged,
  content lost, gh-1275). The SAME checkers run on every PR via
  test/skills/builtin_skill_packaging_guard_test.dart, so the gate cannot
  rot silently between releases. Requires `dart` on PATH — run this AFTER
  the job's Flutter/Dart setup step (gh-798 "Assert TestFlight version
  floor" pattern).

runs:
  using: 'composite'
  steps:
    - name: Assert built-in skills packaged (gh-1275 AC3)
      shell: bash
      run: |
        set -euo pipefail
        dart pub get
        # gh-2074: this run executes build hooks for the WHOLE root package
        # graph (dart native-assets), and package:sqlite3's hook downloads
        # prebuilt binaries from GitHub releases with no retry — one
        # release-download brownout hashed the 504 page as a "hash
        # mismatch" and red'd the AAB leg's very first step (the play-leg
        # failure class; ci.yml caches the same bytes for itself).
        # Pre-warm the hook cache with bounded retry + status gating +
        # hash verification before the verify run needs it.
        dart run scripts/sqlite3_hook_prewarm.dart --package . --targets host
        dart run scripts/verify_builtin_skills.dart
