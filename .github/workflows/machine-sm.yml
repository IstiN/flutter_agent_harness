# Machine SM — thin DIRECT runner over the dmtools-agents pack.
#
# Migrated off the frozen awf factory hop (issue #2244): the tick runs
# `dmtools run sm_github.json` from the latest RELEASED pack, resolved at
# tick time (release-gated always-latest — fails loudly on a missing tag).
#
# Contract notes carried over from the factory era:
#  - The factory comment said "the factory owns the machine-sm group", but
#    the frozen factory-sm.yml carried no concurrency block — two cron
#    ticks ran concurrently for ~7 minutes (live 2026-11-17 12:55). The
#    group lives HERE now: ticks queue, never overlap.
#  - check-runs POST/PATCH require a GitHub-App-scoped token:
#    CHECKS_GH_TOKEN = github.token (integration 15368); a PAT there gets
#    HTTP 403 "You must authenticate via a GitHub App".
#  - The App installation token wins over SOURCE_GITHUB_TOKEN: 15k req/h
#    vs the PAT's 500/h (the PAT budget was exhausted by SM ticks —
#    dmtools-agents run 39034080472).
#  - Silent update-branch pushes ride github.token and fire no workflows
#    (machine workflows are dispatch-only).
#
# Pack-side perf work this pins: dmtools-agents#1514 (live-probe layer +
# tick counters; dry tick 242 → 94 calls, live write fat tracked in #2244).

name: 'Machine SM'

run-name: >-
  🧹 SM ${{
    github.event_name == 'workflow_dispatch' && 'manual tick' ||
    format('tick {0}', github.event.schedule || '') }}${{
    github.event.inputs.dryRun == 'true' && ' (dry)' || '' }}

on:
  schedule:
    - cron: '*/10 * * * *'   # short ticks — the engine idles when busy
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log the plan, perform no action (default: LIVE)'
        required: false
        type: boolean
        default: false

# Same ceiling the production stub carried (the factory could not raise
# rights above the caller; the org default caps the token at read-only).
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
  actions: write

concurrency:
  group: machine-sm
  cancel-in-progress: false

jobs:
  sm:
    runs-on: ubuntu-slim
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Resolve GitHub auth (App -> PAT)
        id: app
        env:
          GH_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          APP_ID: ${{ secrets.APP_ID }}
          APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
        run: |
          if [ -n "$APP_ID" ] && [ -n "$APP_PRIVATE_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "auth: app"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "auth: pat"
          fi

      - name: Mint GitHub App installation token
        id: app-token
        if: steps.app.outputs.enabled == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v2
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Resolve pack + CLI releases (release-gated always-latest)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          AGENTS_VERSION: ${{ vars.AGENTS_VERSION }}
          DMTOOLS_VERSION: ${{ vars.DMTOOLS_VERSION }}
        run: |
          resolve_tag() {
            local repo="$1" knob="$2"
            if [ "$knob" = "latest" ] || [ -z "$knob" ]; then
              gh api "repos/${repo}/releases/latest" --jq .tag_name
            else
              # existence check — a typo'd pin must fail HERE, not in the tick
              gh api "repos/${repo}/releases/tags/${knob}" --jq .tag_name
            fi
          }
          AGENTS_TAG="$(resolve_tag IstiN/dmtools-agents "$AGENTS_VERSION")"
          DMTOOLS_TAG="$(resolve_tag epam/dmtools-dart "$DMTOOLS_VERSION")"
          echo "AGENTS_TAG=${AGENTS_TAG}" >> "$GITHUB_ENV"
          echo "DMTOOLS_TAG=${DMTOOLS_TAG}" >> "$GITHUB_ENV"
          echo "pack release: ${AGENTS_TAG} (knob: ${AGENTS_VERSION:-latest})"
          echo "dmtools CLI release: ${DMTOOLS_TAG} (knob: ${DMTOOLS_VERSION:-latest})"

      - name: Checkout the pack (release tag)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: IstiN/dmtools-agents
          ref: ${{ env.AGENTS_TAG }}
          path: agents

      - name: Install dmtools CLI (release bundle)
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          DMTOOLS_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
        run: |
          if ! curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              "https://github.com/epam/dmtools-dart/releases/download/${DMTOOLS_TAG}/install.sh" \
              -o /tmp/dmtools-install.sh; then
            echo "browser_download failed; falling back to the Releases API" >&2
            ASSET_URL="$(gh api "repos/epam/dmtools-dart/releases/tags/${DMTOOLS_TAG}" \
              --jq '.assets[] | select(.name == "install.sh") | .url')"
            curl -fsSL --connect-timeout 15 --max-time 45 --retry 2 --retry-delay 2 \
              -H "Accept: application/octet-stream" \
              ${GH_TOKEN:+-H "Authorization: Bearer $GH_TOKEN"} \
              "${ASSET_URL}" -o /tmp/dmtools-install.sh
          fi
          bash /tmp/dmtools-install.sh "${DMTOOLS_TAG}"
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Reconcile the machine loop
        timeout-minutes: 18
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          SOURCE_GITHUB_TOKEN: ${{ steps.app-token.outputs.token || secrets.SOURCE_GITHUB_TOKEN }}
          SILENT_GH_TOKEN: ${{ github.token }}
          CHECKS_GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dryRun || 'false' }}
          MACHINE_AUTHOR: ${{ vars.MACHINE_AUTHOR }}
        run: |
          # Local-json runs resolve js/* against CWD (= pack root), while
          # configLoader discovers .dmtools/config.js from CWD too — so the
          # deployment config rides INTO the pack checkout.
          mkdir -p agents/.dmtools
          cp .dmtools/config.js agents/.dmtools/config.js
          cd agents
          OVERRIDE=$(jq -n \
            --arg repo "$GH_REPO" \
            --arg tok "$SILENT_GH_TOKEN" \
            --arg src "$SOURCE_GITHUB_TOKEN" \
            --arg checks "$CHECKS_GH_TOKEN" \
            --arg ma "${MACHINE_AUTHOR:-ai-teammate,github-actions[bot],dmtools-factory-bot}" \
            --arg sp '{"channel":"release","tag":"factory-data","asset":"fa-state.json"}' \
            --argjson dry "$DRY" \
            --argjson vc '["Quality gate","JS engine integration (quickjs-ng)","Binaries smoke gate"]' \
            '{params:{jobParams:{
                repo: $repo, dryRun: $dry, machineAuthor: $ma,
                ciWorkflow: "ci.yml",
                validationChecks: $vc,
                silentToken: $tok, sourceToken: $src, checksToken: $checks,
                statePublish: $sp}}}')
          dmtools run sm_github.json "$OVERRIDE"
