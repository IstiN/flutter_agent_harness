# ⚗️ EXPERIMENT BRANCH — do not merge as-is.
#
# This replaces the awf-factory hop with a DIRECT dmtools run of the
# PATCHED sm pack (IstiN/dmtools-agents @ fix/io-cache-tl) so the tick can
# be dispatched FROM THIS BRANCH against the real repo state and timed.
# dryRun defaults to TRUE (reads only, zero writes).
#
#   gh workflow run machine-sm.yml --ref experiment/sm-tick-pack-branch
#
# Production baseline (factory + released pack, live): recent ticks
# 524–764s wall; this morning's sample: 882s. The known live-side fat
# (per-rule check-run stamps 261x, per-rule state publish 84x, ensure-
# branch 38x — ~90 writes/~300s per tick) is NOT addressed by the pack
# branch yet — the dry run measures the read-side only.
#
# test/machine_kit/factory_stub_ref_test.dart FAILS on this branch by
# design (the `uses:` hop is gone here). Revert = git checkout main.

name: 'Machine SM'

run-name: '🧹 SM tick (branch experiment, dry=${{ inputs.dryRun || ''true'' }})'

on:
  schedule:
    - cron: '*/10 * * * *'   # inert on a non-default branch
  workflow_dispatch:
    inputs:
      dryRun:
        description: 'Log the plan, perform no action (default: true)'
        required: false
        type: boolean
        default: true

# Same ceiling as the production stub (the factory cannot raise rights
# above the caller; org default caps the token at read-only).
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: write
  actions: write

jobs:
  sm:
    runs-on: ubuntu-slim
    timeout-minutes: 30
    concurrency:
      group: machine-sm-branch-exp
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Checkout patched pack (fix/io-cache-ttl)
        uses: actions/checkout@v4
        with:
          repository: IstiN/dmtools-agents
          ref: fix/io-cache-ttl
          path: agents

      - name: Install dmtools CLI
        run: |
          curl -fsSL --connect-timeout 15 --max-time 45 \
            "https://github.com/epam/dmtools-dart/releases/download/v0.1.103/install.sh" \
            -o /tmp/dmtools-install.sh
          DMTOOLS_GITHUB_TOKEN=${{ github.token }} bash /tmp/dmtools-install.sh v0.1.103
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Reconcile the machine loop (patched pack)
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_GITHUB_TOKEN: ${{ github.token }}
          CHECKS_GH_TOKEN: ${{ github.token }}
          SILENT_GH_TOKEN: ${{ github.token }}
          DRY: ${{ inputs.dryRun || 'true' }}
          MACHINE_AUTHOR: ${{ vars.MACHINE_AUTHOR }}
        run: |
          # Local-json runs resolve js/* against CWD (= pack root), while
          # configLoader discovers .dmtools/config.js from CWD too — so the
          # deployment config rides INTO the pack checkout.
          mkdir -p agents/.dmtools
          cp .dmtools/config.js agents/.dmtools/config.js
          cd agents
          OVERRIDE=$(jq -n \
            --arg repo "$GH_REPO" \
            --arg tok "$SILENT_GH_TOKEN" \
            --arg checks "$CHECKS_GH_TOKEN" \
            --arg ma "${MACHINE_AUTHOR:-ai-teammate,github-actions[bot],dmtools-factory-bot}" \
            --argjson dry "$DRY" \
            '{params:{jobParams:{
                repo: $repo, dryRun: $dry, machineAuthor: $ma,
                ciWorkflow: "ci.yml",
                validationChecks: "[\"Quality gate\",\"JS engine integration (quickjs-ng)\",\"Binaries smoke gate\"]",
                silentToken: $tok, checksToken: $checks}}}')
          dmtools run sm_github.json "$OVERRIDE"
