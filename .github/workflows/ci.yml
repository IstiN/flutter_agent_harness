# Runner split (gh-1005, 2026-09-30): pure-Dart AND all PTY/terminal jobs ->
# ubuntu-24.04-arm (public repo: free, SEPARATE capacity pool from the x64
# queue). Flutter-test legs on arm64 bootstrap the SDK via git clone — Flutter
# ships NO official linux-arm64 SDK (stable manifest is x64 only;
# subosito/flutter-action fails 'version: any architecture: arm64'); x64
# Flutter jobs keep the action. The self-hosted M5 pool is ONE runner
# (fa-m5-1, user LaunchAgent) reserved for genuinely macOS-only work:
# cube-kernel-live. PR PTY legs (integration shards, coverage/duration gates,
# Terminal visual) run hosted-Linux only and never wait on fa-m5-1.
name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  # Dispatch-only CI on PR heads (2026-09 machine-loop redesign): pushes
  # fire NO CI — the SM (machine-sm.yml → factory-sm) is the only trigger.
  # It dispatches this workflow on the PR head when validation is due
  # (validate-fresh / validate-armed rules), so intermediate dev/rework
  # pushes and silent branch updates are free. Required checks still
  # match: the dispatched run registers its check runs on the head SHA.
  workflow_dispatch:
    inputs:
      releaseDryRun:
        description: 'gh-1172: run the release pipeline without the push/tag (logs the commit+tag that WOULD land)'
        required: false
        type: boolean
        default: false
      releaseDispatch:
        description: 'gh-1172: real release (bump push + tag) on manual dispatch — requires refs/heads/main; bare validation dispatches stay inert'
        required: false
        type: boolean
        default: false
  # Any release publication (API `gh release create`, web UI, or a pushed
  # annotated tag) builds + attaches the binaries matrix. Pushed tags also
  # arrive via the push filter above; the binaries job tolerates the
  # double-fire (duplicate create + --clobber upload, last wins).
  release:
    types: [published]
  schedule:
    # Coalesced auto-release catch-up: when pushes outpace the 2h coalesce
    # window, this releases the pending commits (pub.dev caps ~12 publishes/day).
    - cron: '23 */2 * * *'

# Superseded PR runs die instantly (issue #177 wave 1). Main/tag runs are
# never cancelled mid-flight — release flow must not be preempted.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# ─────────────────────────────────────────────────────────────────────────────
# Issue #177 — a pull request pays only for what it touched:
#   changes  → path classification (union semantics, shared files = full gate)
#   static   → size guard + analyze + publish dry-run        (always, ~1-2 min)
#   test-core→ dart test sharded ×4 (file-level units), per-shard coverage
#              + junit durations (core/shared)
#   coverage-gate → merge shard coverage; PR: diff-coverage, main: full ratchet
#   guards   → CRAP + jscpd + cross-module dupx              (core/shared/app)
#   flutter-analyze → flutter_app analyze on ubuntu          (app/core/shared)
#   flutter-tests → flutter_app tests sharded ×2 on ubuntu   (app/core/shared;
#                   golden suite stays in build-macos.yml — goldens are
#                   host-locked, see issue #177 E5 discussion)
#   flutter-app-exzone → JS-engine exclusion-zone tests on macOS (issue
#               #1267 N1; runs in every SM validation dispatch — path-blind
#               under dispatch-only CI, gh-1280 idiom; the nightly macos leg
#               stays the main/tag backstop)
#   test-faui → packages/fa_ui tests sharded ×3 by manifest   (app/core/shared;
#               issue #283 — same template as test-core: manifest assert,
#               per-shard coverage merged to ONE report, junit durations
#               feed shard-rebalance.yml; goldens excluded as before)
#   faui-coverage → merge the 3 fa_ui shard reports into ONE lcov
#                   (issue #283 E3: the gate never sees 3 competing uploads)
#   quality-gate → ONE aggregate required check (skip-tolerant)
#   step-timings → per-step duration telemetry (jobs API → summary+artifact)
#   watchdog   → >2x-baseline timeouts; a timed-out leg means a degraded
#                runner allocation → ONE empty-commit retrigger, never
#                `gh run rerun` (a rerun reallocates into the same pool)
# Tag-only / main-only jobs (publish, binaries, installer-smoke, release,
#   integration) are unchanged in semantics — they just need the new aggregate.
# ─────────────────────────────────────────────────────────────────────────────

# SEC-08 (#796): explicit minimal default — every job that needs more
# declares its own job-level permissions block.
permissions:
  contents: read

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      core: ${{ steps.paths.outputs.core || steps.filter.outputs.core }}
      app: ${{ steps.paths.outputs.app || steps.filter.outputs.app }}
      docs: ${{ steps.paths.outputs.docs || steps.filter.outputs.docs }}
      shared: ${{ steps.paths.outputs.shared || steps.filter.outputs.shared }}
      # PR-only (issue #303): a trajectory-touching diff flips this on so
      # the perf-gate leg below runs the #262 DoD gate per-merge.
      perf: ${{ steps.paths.outputs.perf }}
      # PR-only (gh-1241 REG-1): a trajectory/session/usage-touching diff
      # runs the usage-fold suite per-merge.
      usagefold: ${{ steps.paths.outputs.usagefold }}
      # Issue #1267 N1: the macOS exclusion-zone path set. Reserve only —
      # ci.yml has no pull_request trigger (dispatch-only CI); the
      # flutter-app-exzone leg gates on the SM validation dispatch itself
      # (gh-1280 idiom) and consults this output only if a real
      # pull_request trigger ever lands.
      exzone: ${{ steps.paths.outputs.exzone }}
      # PR-only (issue #551): test/integration/** changes run the no-key
      # mock-LLM integration legs per-PR instead of at tag time only.
      intmock: ${{ steps.paths.outputs.intmock }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # base...head diff for the classifier below
          # gh-1477: blobless — historical blobs are never read; git
          # lazy-fetches the rare blob a diff actually touches.
          filter: blob:none
      # Non-PR events (main push, tags, schedule, dispatch): everything is
      # affected — the full gate always guards main and releases.
      - id: filter
        if: github.event_name != 'pull_request'
        run: |
          echo "core=true" >> "$GITHUB_OUTPUT"
          echo "app=true" >> "$GITHUB_OUTPUT"
          echo "docs=true" >> "$GITHUB_OUTPUT"
          echo "shared=true" >> "$GITHUB_OUTPUT"
      # PR classification runs through THE SAME classifier the pre-commit
      # hook uses (issue #194, AC7 + AC5/E2): one source of truth for path
      # rules, and the unknown-path safe default (full gate) — e.g. a new
      # dart_test.yaml at the repo root — now holds in CI, not only in the
      # hook. The selected stage set maps back to the same four groups the
      # old dorny filter emitted.
      - id: paths
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.event.pull_request.head.sha }}
        run: |
          stages=$(scripts/ci_fast_gate.sh --dry-run |
            sed -n 's/^Fast gate scope: .*stages://p')
          echo "gate stages:[$stages]"
          # Empty output can only mean detection failure: full gate.
          [ -z "$(echo $stages)" ] && stages="size analyze test-core coverage crap dup dupx flutter integration-mock"
          case " $stages " in *"flutter"*) echo "app=true" >> "$GITHUB_OUTPUT" ;; esac
          case " $stages " in *"test-core"*) echo "core=true" >> "$GITHUB_OUTPUT" ;; esac
          case " $stages " in *"analyze"*) echo "docs=true" >> "$GITHUB_OUTPUT" ;; esac
          # Issue #551: test/integration changes select the mock-LLM leg.
          case " $stages " in *"integration-mock"*) echo "intmock=true" >> "$GITHUB_OUTPUT" ;; esac
          # All nine stages selected = a shared/unknown path changed:
          if [ -z "$(echo $stages)" ]; then
            # Empty output can only mean detection failure: full gate.
            stages="size analyze test-core coverage crap dup dupx flutter integration-mock"
          fi
          if [ "$(echo $stages | wc -w)" -eq 9 ]; then
            echo "shared=true" >> "$GITHUB_OUTPUT"
          fi
          # Issue #303: the #262 DoD perf gate must red-block the MERGE for
          # trajectory regressions, not only the release — before #551 the
          # only integration leg outside PRs was tag-time. The perf-gate
          # leg re-selects the same gate via --tags perf. Paths = everything
          # the #262 fix touched: ledger core, fa_ui trajectory widgets, CLI
          # trajectory parts, the fah entrypoint, its tests, and the app's
          # session load path.
          if git diff --name-only "$BASE_REF" "$HEAD_REF" |
              grep -qE '(^lib/src/trajectory/|^packages/fa_ui/lib/src/trajectory/|^lib/src/cli/trajectory_|^bin/fah\.dart$|^test/(integration/)?trajectory/|^flutter_app/lib/services/agent_service(_sessions)?\.dart$)'; then
            echo "perf=true" >> "$GITHUB_OUTPUT"
          fi
          # gh-1241 REG-1: the usage fold consumes the trajectory ledger's
          # model_request_summary records and the session chain's shape —
          # a red usage-fold suite blocks the merge even when the regular
          # legs are green.
          if git diff --name-only "$BASE_REF" "$HEAD_REF" |
              grep -qE '(^lib/src/trajectory/|^lib/src/session/|^lib/src/usage/|^test/usage/|^lib/src/cli/agent_cli_usage_ledger\.dart$)'; then
            echo "usagefold=true" >> "$GITHUB_OUTPUT"
          fi
          # Issue #1267 N1: the macOS exclusion-zone path set. NOTE the
          # trigger model: ci.yml has NO pull_request trigger (dispatch-only
          # CI, see the flutter-app-exzone job comment) — this step runs only
          # on a real pull_request event, so today it is path-narrowing
          # RESERVE, exactly like the perf/usagefold/intmock greps above
          # (documented pending in issue #303); the flutter-app-exzone leg
          # actually gates via its workflow_dispatch arm (gh-1280 idiom).
          # Context: the ubuntu flutter-tests leg runs this family but every
          # engine-dependent test SKIPS there (native_test_guard.dart finds
          # no QuickJS .so on a bare runner); they truly execute only on
          # macOS — the hole #1309 escaped through (gh-1307). The issue's
          # packages/js_widget_runtime/** is an EXTERNAL repo now, so its
          # bumps arrive via the flutter_app/pubspec.yaml pin.
          if git diff --name-only "$BASE_REF" "$HEAD_REF" |
              grep -qE '(^flutter_app/lib/apps/|^lib/src/js_ext/|^flutter_app/test/apps/|^flutter_app/test/native_test_guard\.dart$|^flutter_app/pubspec\.yaml$)'; then
            echo "exzone=true" >> "$GITHUB_OUTPUT"
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # Issue #709: live kernel-mode cube legs. The ubuntu test-core shards can
  # only prove the SBPL PROFILE TEXT (unit + guard/profile parity) — the
  # kernel's last-match-wins read/write enforcement of rw mounts under a
  # read-denied prefix needs a real `sandbox-exec` run, which exists only on
  # macOS. Both live suites skip with a NAMED reason wherever they cannot
  # run (no sandbox-exec / already-sandboxed host / HOME outside /Users) —
  # the skip lands in the job log, never silent; this leg is where they
  # actually execute. The leg is a real gate input: `quality-gate` NEEDS it
  # and fails the merge when it fails (a skip — a diff with no core paths —
  # passes, like every other optional leg).
  #
  # Skip condition note (PR #718 review): gating on `core` covers
  # `shared`-only diffs too — the classifier maps a shared/unknown path to
  # ALL nine stages, `test-core` among them, so `core=true` falls out and
  # this leg runs; only docs-only diffs (or non-PR context mismatches)
  # skip it.
  # ─────────────────────────────────────────────────────────────────────────
  cube-kernel-live:
    name: Cube kernel live (macOS)
    runs-on: [self-hosted, macos-m5]
    needs: changes
    if: needs.changes.outputs.core == 'true'
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - run: dart pub get

      # Content-addressed native-assets hook downloads (sqlite3 et al) are
      # hash-verified on reuse — cache them so a GitHub release-asset
      # brownout (504 bodies hashed as mismatches, 2026-09-21) can't
      # re-break every job that re-downloads.
      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: dart test cube backends (live kernel legs)
        run: dart test test/cube/backends

      # gh-1059 AC4: the real-keychain runner guard — `security`
      # add/find/delete against the runner's login keychain through the
      # bounded-helper machinery (outcome classification incl. stderr
      # tails, env merge, timeout kill). The group is tagged `integration`
      # (real side effects), so the Linux core shards and the pre-commit
      # gate skip it; this macOS leg is where it actually executes. Skips
      # with a named reason when no `security` binary / default keychain.
      - name: dart test secure key store (macOS Keychain live legs)
        run: dart test test/secrets/secure_key_store_test.dart --tags integration

  static:
    name: Static gates
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      # Issue #1234: the ≤2800-line file guard MOVED into crap4dart's loc
      # gate (crap4dart.yaml, wc -l parity verified by the maintainer
      # recipe in the issue) — enforced whole-tree by the
      # `crap4dart check --baseline` Quality-gates step below. The shell
      # find-exec guard (gh-1232 AC2) is gone: one enforcement point, no
      # drifted exclusions.

      # Issue #1100: the fa-web-spa.zip packaging guard (base-tag patch +
      # absolute-/app/ grep) must stay functional on every PR — a release
      # run is the wrong place to first discover a broken guard. Fixture
      # self-test: positive path + all red exits, pure bash, no web build.
      - name: Web SPA packaging guard self-test (#1100)
        run: |
          set -euo pipefail
          d=$(mktemp -d)
          trap 'rm -rf "$d"' EXIT
          mkdir -p "$d/build"
          printf '<html><head>\n<base href="/app/">\n</head></html>\n' > "$d/build/index.html"
          for f in flutter_service_worker.js flutter_bootstrap.js; do echo "// $f" > "$d/build/$f"; done
          echo '{"name":"fa"}' > "$d/build/manifest.json"
          bash scripts/package_web_spa.sh "$d/build" "$d/out.zip" > /dev/null
          unzip -p "$d/out.zip" index.html | grep -F '<base href="./">'
          # AC4 pin: packaging never mutates its input — the Pages deploy's
          # build dir must stay byte-identical.
          grep -F '<base href="/app/">' "$d/build/index.html"
          # Red exit 1: an absolute /app/ sneaking into a touchpoint.
          echo '{"x":"/app/y"}' > "$d/build/manifest.json"
          if bash scripts/package_web_spa.sh "$d/build" "$d/bad.zip" 2>/dev/null; then
            echo "::error::package_web_spa guard passed a build containing /app/ (AC3 #1100)"
            exit 1
          fi
          # Red exit 2: no base tag to patch.
          echo '{"name":"fa"}' > "$d/build/manifest.json"
          echo '<html></html>' > "$d/build/index.html"
          if bash scripts/package_web_spa.sh "$d/build" "$d/bad2.zip" 2>/dev/null; then
            echo "::error::package_web_spa guard passed an unpatchable base tag (AC1 #1100)"
            exit 1
          fi
          # Red exit 3: a missing touchpoint file.
          rm "$d/build/manifest.json"
          if bash scripts/package_web_spa.sh "$d/build" "$d/bad3.zip" 2>/dev/null; then
            echo "::error::package_web_spa guard passed an incomplete build (AC3 #1100)"
            exit 1
          fi
          # fa1.dev parity pin: both web builds must keep the identical
          # release flags AND the same pinned SDK — the bundle's only edit
          # stays the base tag.
          for wf in .github/workflows/pages.yml .github/workflows/ci.yml; do
            grep -q -- '--release' "$wf" || { echo "::error::$wf lost the --release web flag (#1100 parity)"; exit 1; }
            grep -q -- '--base-href /app/' "$wf" || { echo "::error::$wf lost --base-href /app/ (#1100 parity, pages + bundle must share it)"; exit 1; }
            grep -q "flutter-version: '3.47.x'" "$wf" || { echo "::error::$wf unpinned Flutter SDK (#1100 parity, pages + bundle must share it)"; exit 1; }
          done

      # Issue #433 AC1: README CRAP badge must equal the crap4dart.yaml
      # threshold (they drifted to 8.0-vs-12.0 once). Pure python — runs on
      # every PR, including docs-only ones (a README edit is exactly the
      # drift vector).
      - name: CRAP badge/config sync guard
        run: python3 scripts/check_crap_guards.py

      # gh-1199 AC2: the deterministic-gate boundary is self-enforcing —
      # an integration-tagged test that looks live (real provider URL, or
      # a credential-key literal with no mock/loopback in sight) without
      # the `llm` tag fails the gate. Runs on every PR: a PR adding a live
      # test (E1) is exactly the diff this must catch.
      - name: LLM tag boundary lint (gh-1199 AC2)
        run: python3 scripts/check_llm_tag_boundary.py

      # gh-1199 AC6/E3: the flake quarantine list itself must stay
      # honest — every entry documented (issue, since, >=2 proving runs)
      # and pointing at an existing integration-tagged file.
      - name: Flake quarantine list guard (gh-1199 AC6)
        run: python3 scripts/apply_quarantine.py --check

      # gh-1296 NG1/AC2: every lockfile in the repo is committed and
      # enforced — ONE inventory list (scripts/check_lockfiles.sh) fails the
      # PR when a listed lockfile is missing, untracked, or gitignored, and
      # the guard's own red exits are fixture-self-tested so the check
      # cannot rot silently (#1100 pattern).
      - name: Lockfile inventory gate (gh-1296 NG1)
        run: bash scripts/check_lockfiles.sh inventory

      - name: Lockfile gate self-test (gh-1296 AC2)
        run: bash scripts/check_lockfiles_selftest.sh

      # gh-1300 AC6: the shard duration-budget gate's own red exits are
      # fixture-self-tested (breach fails + files the body; fit passes;
      # warn band; unbudgeted shard is loud; update is down-only) so the
      # ratchet cannot rot silently (#1100 pattern).
      - name: Duration budget gate self-test (gh-1300 AC6)
        run: bash scripts/duration_budget_selftest.sh

      # Full analyze needs the example app's package config (Flutter imports);
      # a docs-only PR skips the flutter setup entirely and analyzes the pure
      # Dart scopes only — it cannot have changed resolution anyway.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          channel: stable
          cache: true

      - name: Example app setup (full analyze only)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          printf 'OPENROUTER_API_KEY=\nMODEL_ID=\nBASE_URL=\nHUGGINGFACE_TOKEN=\n' > flutter_app/.env
          cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart
          dart pub get --directory=office_addin/dart

      - uses: ./.github/actions/flutter-pub-get
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
      - name: dart analyze (full)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: dart analyze

      - name: dart analyze (docs-only scope)
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true'
        run: dart analyze lib test bin

      # Publish gate at PR time: publish-blocking problems (undeclared lib/
      # imports, stray PEM-like strings) used to surface only in the tag-time
      # publish job — the v0.1.331 era: an undeclared package:cryptography
      # import shipped red on ~26 consecutive tags. --ignore-warnings: the
      # two known layout warnings (gitignored install_local.sh, docs/
      # naming) must not redden every PR, while validation ERRORS — "does
      # not have X in the dependencies section of pubspec.yaml" — still
      # fail. setup-dart (sdk >= 3.13) registers a publish-scoped PUB_TOKEN
      # job-wide and pub.dev rejects authenticated metadata reads, so
      # resolve unauthenticated (same pattern as the publish job);
      # --dry-run never uploads.
      - name: Publish dry-run (unauthenticated)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          dart pub token remove https://pub.dev || true
          # Against the STAGED tree, not the repo root (#597 AC1): the
          # publish job publishes from the stage — the v0.1.407 class of
          # failure (staged resolution re-pinning vendor/dart_tui through
          # pubspec_overrides.yaml) must redden the PR, not the tag.
          bash scripts/stage_publish_package.sh /tmp/pr-dry-run-stage
          # The staged tree must ANALYZE clean: v0.1.411 shipped files
          # with broken imports (the staging filter pruned lib/src/memory;
          # imports of fork-only dart_tui symbols) that only a consumer's
          # `dart analyze` ever surfaced (issue #613). Errors fail the
          # gate; warnings/infos pass, matching the static analyze stage.
          (cd /tmp/pr-dry-run-stage && dart pub get && dart analyze)
          (cd /tmp/pr-dry-run-stage && dart pub publish --dry-run --ignore-warnings)

  test-core:
    # Always runs (no job-level path gate): a path-filtered matrix skip
    # posts a check-run with the LITERAL unrendered name — the required
    # contexts (shard 0..3) never report, and branch protection blocks
    # out-of-scope PRs at 27 green checks. The scope fastpass below
    # green-skips the real steps in seconds instead.
    name: Core tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04-arm
    needs: changes
    permissions:
      contents: read
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - name: Scope fastpass (out-of-scope → green in seconds)
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "no core/shared changes — shard green-skipped (required context reported)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          sdk: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: '3.x'

      - name: Pub cache
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'

      - name: Native-assets hook cache
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      # Duration-balanced shards (issue #177 AC3): scripts/test_shards.json
      # maps test FILES to shards (file-level units — test/cli alone was
      # half the suite's runtime and undivisible as a dir-unit); rebalanced
      # weekly by shard-rebalance.yml from junit durations. Bootstrap here
      # is filecount-balanced; the first weekly junit rebalance converges
      # to duration balance. Unknown test files are bin-packed in at
      # runtime by shard_files.py, so a PR adding one never silently skips
      # it. The json file-reporter (converted to junit below — dart test
      # has no built-in junit reporter) feeds the rebalancer real durations
      # (issue #194 AC3).
      - name: dart test --coverage (shard ${{ matrix.shard }})
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          targets=$(python3 scripts/shard_files.py scripts/test_shards.json ${{ matrix.shard }})
          echo "shard targets: $targets"
          mkdir -p test-results
          dart test --coverage=coverage --exclude-tags integration \
            --file-reporter="json:test-results/dart-shard-${{ matrix.shard }}.json" \
            $targets
          python3 scripts/junit_from_dart_json.py \
            test-results/dart-shard-${{ matrix.shard }}.json \
            test-results/junit-shard-${{ matrix.shard }}.xml

      # gh-1033 (review thread 7 + gate wiring): the fa jsr delegate suites
      # are integration-tagged (the PTY leg's CLI coverage ratchet measures
      # lib/src/cli hits from them), so the sharded unit run above skips
      # them. Their hits must ALSO reach the unit-side lcov consumers
      # (>= 80% ratchet, PR diff-coverage, CRAP — jsr_cli.dart at 0% reads
      # CRAP 156 > 12), so they run into shard 0's coverage dir; the gate
      # merge is a union, so one shard carrying them is enough. Keep this
      # list in sync with scripts/ci_fast_gate.sh stage_test_core and
      # nightly.yml.
      - name: dart test --tags integration (jsr delegate trio → unit lcov)
        if: matrix.shard == 0 && (needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true')
        run: >-
          dart test --tags integration --coverage=coverage
          test/cli/jsr_cli_test.dart test/cli/cli_args_jsr_test.dart
          test/cli/agent_cli_jsr_test.dart

      - name: Format coverage to lcov
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          name: coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 2

      # junit durations for the weekly shard-rebalance.yml (retention 7d so
      # a quiet week never starves it into the file-count fallback).
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          name: junit-shard-${{ matrix.shard }}
          path: test-results/junit-shard-${{ matrix.shard }}.xml
          retention-days: 7

  # Issue #551: the no-key integration legs (MockLlmServer scenarios, PTY
  # harness, no secrets, no network) run per-PR whenever test/integration/**
  # changes — the #538 rot class (legs breaking silently between releases,
  # discovered only at tag time) becomes a red PR at the commit that broke
  # them. Real-provider legs carry the `llm` tag and stay in the tag-only
  # provider-smoke job; perf has its own #303 trajectory gate; browser-ext
  # its own workflow. `pty` marks child-agent-spawn tests whose second
  # process boot is unbounded under runner load (issue #553, red twice on
  # this leg) — they stay in nightly's pty-integration job.
  integration-mock:
    name: Integration tests (mock LLM)
    runs-on: ubuntu-24.04-arm
    needs: changes
    timeout-minutes: 25
    permissions:
      contents: read
    if: needs.changes.outputs.intmock == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      # Issue #943 (vector 3): warm the build hooks before the first test
      # process boots fa (same rationale as the pty-integration leg).
      - name: Prewarm build hooks + fa boot
        run: |
          dart bin/fah.dart --help > /dev/null
          dart run bin/fah.dart --help > /dev/null

      - name: dart test test/integration (excluding llm, browser-ext, perf, pty)
        # gh-1199 AC6: explicit file list (not the bare directory) so the
        # quarantine filter can drop flake-quarantined files here too.
        run: |
          targets=$(find test/integration -name '*_test.dart' | sort | python3 scripts/apply_quarantine.py)
          echo "integration-mock targets: $targets"
          dart test --exclude-tags llm,browser-ext,perf,pty $targets

  # Issue #675: the suite must be immune to a hostile ambient env — the
  # dmtools ai-teammate runner exports FA_PROVIDER_TYPE / FA_PROVIDER_CONFIG /
  # FAH_PROVIDER, which used to decide test fate through the args resolver.
  # Run the non-integration suite under the same hostile env so any
  # ambient-env read that leaks back into resolution regresses loudly.
  # gh-1198 rework: the runner now ALSO exports FA_PROVIDERS_QUEUE (the
  # provider-queue env won over the file queue and silently flipped the
  # /providers queue editor tests to the env-wins refusal on the PR head) —
  # the var rides the same hostile block so a future ambient read of it
  # regresses here, not only on the runner.
  hostile-env:
    name: Hostile ambient env
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FA_PROVIDER_TYPE: zai
      FA_PROVIDER_CONFIG: '{"baseUrl":"https://api.z.ai/api/coding/paas/v4","model":"glm-5.3-flash","apiKeyEnvVar":"ZAI_CODE_KEY"}'
      FAH_PROVIDER: zai
      FA_PROVIDERS_QUEUE: '[{"provider_type":"zai","provider_config":{"baseUrl":"https://api.z.ai/api/coding/paas/v4","model":"glm-5.3-flash","apiKeyEnv":"ZAI_CODE_KEY"}}]'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: dart test under hostile ambient env
        run: dart test --exclude-tags integration

  # ─────────────────────────────────────────────────────────────────────────
  # Nightly parity (2026-09-23): the two legs that stayed nightly-only went
  # red on main night after night before anyone looked — the CLI-coverage
  # ratchet (12.07% < 12.17%) and the Terminal-visual PTY suite (five
  # regressions, several cascading out of fixed-port collisions). Both legs
  # are part of the COMMON PR suite: they run on every CI invocation (the
  # Machine SM dispatches ci.yml per PR head), unconditioned by path — a
  # diff that breaks them must red-block THE PR, never the 3:30 nightly.
  # Main remains backstopped by nightly.yml.
  # gh-1300 (2026-10-06): the PTY/CLI shards pay toolchain+boot ONCE per
  # run, not per test. Every integration test spawns a fresh CLI; JIT
  # `dart bin/fah.dart` cost VM start + CFE kernel compile ~30 s PER SPAWN
  # on loaded ARM runners (the dominant term: 29 files, 3 shards x
  # ~350 s). This job compiles the AOT bundle once, the shards download
  # it and point the FA_BIN seam (test/integration/pty_harness.dart,
  # faCliCommand) at it — spawn ~1 s, per-test isolation untouched (each
  # spawn is still a fresh process with its own env/cwd). The binary MUST
  # match the PR's sources: built fresh in this run, never cached across
  # runs; the shards fail loudly if it is missing or dead (`test -x` +
  # `--version` smoke), never silently fall back to JIT.
  fa-aot-build:
    name: AOT fa binary (compiled once per run, gh-1300)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      # Same hooks cache key as the shards: the build pays the native
      # assets hooks here so the shard-side restore is warm.
      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-
      - run: dart pub get
      - name: dart build cli (AOT bundle, same shape install_local.sh ships)
        run: |
          dart build cli --target=bin/fah.dart --output=fa-local
          # The installer writes version.txt into the bundle; mirror it so
          # `fa --version` from the AOT binary reports the real version
          # (the _packageVersion() fallback chain reads bundle/version.txt).
          version=$(sed -n 's/^version: //p' pubspec.yaml)
          echo "$version" > fa-local/bundle/version.txt
          ./fa-local/bundle/bin/fah --version
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fa-aot-bin
          path: fa-local/bundle/
          retention-days: 1

  # ─────────────────────────────────────────────────────────────────────────
  # ─────────────────────────────────────────────────────────────────────────
  # gh-1005 (2026-09-30): the PTY legs are hosted-Linux ONLY. The audit of
  # the whole shard manifest (scripts/test_integration_shards.json) found
  # ZERO genuinely macOS-specific tests: the PTY harness allocates terminals
  # via libc openpty FFI (package:pty2 — OS/arch independent), no suite
  # depends on zsh defaults or /bin/bash 3.2 quirks, and the one macOS-only
  # assertion (fa_cube_integration_test.dart's SBPL kernel nested-rw probe)
  # is `if (Platform.isMacOS)`-guarded inside a test that passes on Linux.
  # The genuinely macOS-only terminal behavior keeps its dedicated gates:
  # cube-kernel-live (above) runs the real sandbox-exec E2E (test/cube/
  # backends) on fa-m5-1, and the mac-only CLI lines (shift_hid CoreGraphics
  # probe, stty -f device flag) stay unit-covered on ubuntu
  # (test/cli/shift_hid_test.dart, fa_tui_controller_overlay_test.dart).
  # Consequence: the fa-m5 runner-pick probe (M5_POOL) is GONE and the mac
  # leg merged INTO the linux leg below — ONE sharded PTY/CLI integration
  # job on ubuntu-24.04-arm that now also carries the per-shard coverage +
  # dart-json/junit reporting the gate consumes. A PR validation's PTY legs
  # never wait on fa-m5-1; hosted macOS (10x minute cost) is never used.
  # ─────────────────────────────────────────────────────────────────────────
  pty-integration-linux:
    # THE PR PTY/CLI integration leg (gh-1005: the former mac leg merged in;
    # before that, issue #931 part 2 sharded ONE ~40-min job into 3
    # duration-balanced shards — scripts/test_integration_shards.json,
    # file-level units). New integration-tagged files bin-pack in at runtime
    # (shard_files.py --tags integration), so a PR adding one never
    # silently skips it. Explicit --concurrency=4 bounds in-suite
    # parallelism (part 3.3 — package:test forbids `concurrency` in
    # dart_test.yaml tag overrides, so the knob lives here; it bounds
    # concurrent live-provider tests PER JOB — the rate-limit rationale is
    # documented on the llm tag in dart_test.yaml).
    # Per-shard coverage artifacts merge in pty-coverage-gate —
    # a single shard's ratchet would see partial lib/src/cli coverage
    # and false-regress. Each shard also emits the dart json
    # file-reporter: junit feeds rebalancing/budget-tightening PRs, the
    # raw json feeds the #928 duration gate (pty-coverage-gate below).
    # gh-1300: needs the once-per-run AOT build; FA_BIN points every CLI
    # spawn (PTY harness + headless helpers) at the prebuilt binary.
    needs: [fa-aot-build]
    name: PTY/CLI integration (linux, shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-24.04-arm
    # 40 > 30: the leg now carries the coverage + file-reporter overhead the
    # old mac leg had (the coverage-free linux twin never paid it) and arm64
    # Graviton cores run somewhat slower than the M-series minis did — margin
    # without stretching the watchdog much.
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    env:
      # Secret shape (review 2026-09-23): this is the pull_request-time leg
      # that receives real provider secrets. GitHub withholds secrets from
      # forks, so external contributions never see them — but every
      # SAME-REPO branch runs this suite with the keys in its process
      # environment before human review (this repo's agent-authored-branch
      # model). The marginal escalation vs the nightly (same suites, same
      # keys, post-merge on main) is small and the watchdog already hands
      # RELEASE_PAT to same-repo PRs; documented here so the assumption is
      # explicit, not implicit.
      #
      # The live-provider legs (unlocked by these keys) load extra
      # lib/src/cli surface into the coverage measurement, so a no-key run
      # measures a DIFFERENT — lower-numbered — value; missing keys (forks)
      # self-skip those legs gracefully and the gate stays honest either
      # way.
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      # gh-1300: the AOT binary built once per run by fa-aot-build. The
      # guard FAILS the shard loudly if the artifact is missing or dead —
      # a silent JIT fallback would hide the optimization from AC1's
      # before/after numbers.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: fa-aot-bin
          path: fa-local/bundle
      # Artifact zips do NOT preserve the exec bit (download-artifact
      # README: "post-download the file is no longer guaranteed to be set
      # as an executable"). Run 37446280743: `test -x` below failed
      # silently ~20 ms in on EVERY shard — the gate went red before a
      # single test ran. Restore the mode the build job shipped; the
      # smoke below still verifies the restored binary is executable and
      # boots (never a silent JIT fallback). Content integrity is not
      # affected: download-artifact digest-validates (digest-mismatch:
      # error default), so this chmod only ever touches the verified
      # bundle the fa-aot-build job produced.
      - name: Restore exec bit (artifact zips drop permissions)
        run: chmod +x fa-local/bundle/bin/fah
      - name: Smoke the AOT binary (fail loud, never JIT-fallback)
        run: |
          test -x fa-local/bundle/bin/fah
          ./fa-local/bundle/bin/fah --version
      - name: dart test --tags integration (linux, shard ${{ matrix.shard }}/3)
        env:
          # gh-1300 FA_BIN seam: every CLI spawn (pty_harness + the
          # headless helpers via faCliCommand) runs the AOT binary —
          # ~1 s per spawn instead of the JIT VM+CFE compile (~30 s on
          # loaded ARM runners). Per-test isolation is unchanged.
          FA_BIN: ${{ github.workspace }}/fa-local/bundle/bin/fah
        run: |
          # gh-1199 AC1: --exclude-tag llm keeps every live-provider file
          # out of the merge-blocking selection (manifest unit AND runtime
          # bin-pack); --exclude-tags browser-ext,llm is the dart-test
          # backstop. AC6: the quarantine filter drops flake-quarantined
          # files (scripts/test_quarantine.json) pending their fix PRs.
          targets=$(python3 scripts/shard_files.py scripts/test_integration_shards.json ${{ matrix.shard }} --tags integration --exclude browser_ext --exclude-tag llm | python3 scripts/apply_quarantine.py)
          echo "shard targets: $targets"
          if [ -z "$targets" ]; then
            echo "shard fully quarantined — nothing to run"
            exit 0
          fi
          mkdir -p test-results
          dart test --tags integration --exclude-tags browser-ext,llm \
            --concurrency=4 \
            --coverage=coverage \
            --file-reporter="json:test-results/integration-shard-${{ matrix.shard }}.json" \
            $targets
      # The file-reporter writes the json even on a RED leg — convert +
      # upload must not be chained into the failing step (#928 review):
      # timing evidence is exactly what red runs need to keep.
      - name: junit durations (shard ${{ matrix.shard }})
        if: always()
        run: >-
          python3 scripts/junit_from_dart_json.py
          test-results/integration-shard-${{ matrix.shard }}.json
          test-results/junit-integration-shard-${{ matrix.shard }}.xml
      # Raw dart json for the #928 duration gate (per-test spans incl. suite
      # paths); junit is the human/rebalancer-facing form of the same data.
      # Upload MUST stay on the current upload-artifact line (gh-995): the
      # gate's download-artifact v8 digest-validates every download, so an
      # old-line upload digest-mismatches and the shard merge loses its
      # report (test/release_hygiene_test.dart pins the pin).
      #
      # gh-1412: each evidence upload carries a one-shot retry (the step
      # right after it, same pinned action). The gh-1412 validation run
      # 37807820733 red'd a shard whose 68 tests ALL passed on a single
      # transient `Failed to FinalizeArtifact: ECONNRESET` from GitHub's
      # blob storage — the aggregate gate followed and the merge aborted.
      # The retry re-runs the SAME action with overwrite:true (a failed
      # attempt leaves the artifact half-registered — without overwrite the
      # retry dies on "already exists"); a genuinely dead endpoint still
      # fails the shard loudly, and the retries stay if: always()-reachable
      # so red legs keep their evidence. Guarded by
      # test/ci_pty_artifact_upload_retry_guard_test.dart.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_integration_json
        if: always()
        with:
          name: integration-json-shard-${{ matrix.shard }}
          path: test-results/integration-shard-${{ matrix.shard }}.json
          retention-days: 2
      - name: Retry integration-json upload (transient blob-storage reset, gh-1412)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.upload_integration_json.outcome == 'failure'
        with:
          name: integration-json-shard-${{ matrix.shard }}
          path: test-results/integration-shard-${{ matrix.shard }}.json
          retention-days: 2
          overwrite: true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_integration_junit
        if: always()
        with:
          name: junit-integration-shard-${{ matrix.shard }}
          path: test-results/junit-integration-shard-${{ matrix.shard }}.xml
          retention-days: 7
      - name: Retry junit upload (transient blob-storage reset, gh-1412)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.upload_integration_junit.outcome == 'failure'
        with:
          name: junit-integration-shard-${{ matrix.shard }}
          path: test-results/junit-integration-shard-${{ matrix.shard }}.xml
          retention-days: 7
          overwrite: true
      # coverage/ is written incrementally — a red leg still formats and
      # uploads so the gate below merges what ran.
      - name: Format coverage to lcov (shard ${{ matrix.shard }})
        if: always()
        run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload_pty_coverage
        if: always()
        with:
          name: pty-coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 2
      - name: Retry coverage upload (transient blob-storage reset, gh-1412)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.upload_pty_coverage.outcome == 'failure'
        with:
          name: pty-coverage-shard-${{ matrix.shard }}
          path: coverage/lcov.info
          retention-days: 2
          overwrite: true

  # Coverage home for the SHARDED pty-integration-linux leg (mirrors
  # faui-coverage): the 3 shard lcovs merge into ONE report (union DA hits
  # per file, NOT cat — a single shard's ratchet would see partial
  # lib/src/cli coverage and false-regress), then the CLI coverage ratchet
  # runs on the merged report, and the duration-budget gate (issue #928
  # Part 1) consumes the leg's three dart-json shard reports:
  # per-suite totals vs scripts/test_duration_baseline.json (down-only
  # ratchet, >10% suite regression or a per-test budget breach fails the
  # merge) and the top-10 slowest tests land in the job summary on every
  # run. The gate NEVER rewrites the baseline — budgets move only through
  # reviewed PRs running check_test_durations.py --update-baseline locally
  # against an integration-json artifact. gh-1005: the measurement
  # environment moved mac -> ubuntu-24.04-arm together with the leg (the
  # coverage-gardener already measured on ubuntu); a baseline re-seat, if
  # the first linux runs sit below the floor, takes the same reviewed-PR
  # path.
  pty-coverage-gate:
    name: PTY gates (coverage ratchet + duration budget, merged shards)
    runs-on: ubuntu-24.04-arm
    needs: [pty-integration-linux]
    timeout-minutes: 5
    permissions:
      contents: read
      # gh-1300: issues: write — the duration-budget auto-filer files/
      # comments/closes the [ENH] optimization issue. A job-level
      # permissions block drops every unlisted scope to none, so both
      # scopes are listed explicitly (the filing leg reads nothing else).
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: pty-coverage-shard-*
          path: pty-coverage-shards
      # Same discipline as the core/faui shards' assert_shard_manifest: the 3
      # selections must cover exactly the integration-tagged suite
      # (browser-ext excluded, it owns browser-ext.yml), pairwise disjoint,
      # every unit on disk. Fails loudly BEFORE the ratchet reads shard data.
      - name: Assert integration shard manifest (union/disjoint/exists)
        run: python3 scripts/assert_shard_manifest.py scripts/test_integration_shards.json --shards 3 --tags integration --exclude browser_ext --exclude-tag llm
      # The leg's dart json reports for the #928 duration gate below.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: integration-json-shard-*
          path: integration-json-shards
      - name: Merge shard coverage (union DA hits per file, NOT cat)
        run: |
          count=$(ls pty-coverage-shards/*/lcov.info | wc -l | tr -d ' ')
          if [ "$count" != "3" ]; then
            echo "::error::expected 3 pty shard coverage reports, got $count"
            exit 1
          fi
          # gh-995: a report that downloads but carries no SF: records
          # (empty/truncated upload) still satisfies the count check and
          # merges into a silently partial report — the 2026-09-27 wedge
          # also showed the ratchet reading 7.95% vs the 11.00% baseline
          # off exactly such a merge. Fail loudly naming the hollow shard
          # instead of letting the ratchet chase a phantom regression.
          for f in pty-coverage-shards/*/lcov.info; do
            grep -q '^SF:' "$f" || { echo "::error::$f carries no SF: records — hollow shard coverage upload"; exit 1; }
          done
          mkdir -p coverage
          python3 scripts/merge_lcov.py \
            -o coverage/lcov.merged.info \
            pty-coverage-shards/*/lcov.info
      - name: CLI coverage ratchet (lib/src/cli/**, baseline only up)
        run: python3 scripts/check_cli_coverage.py --lcov coverage/lcov.merged.info
      - name: Test duration budget gate (issue #928, ratchet only down)
        run: |
          ls integration-json-shards/*
          python3 scripts/check_test_durations.py \
            --baseline scripts/test_duration_baseline.json \
            integration-json-shards/*/integration-shard-*.json
      # gh-1300: per-SHARD budget (expected runner span + headroom, one
      # place: scripts/test_shard_budgets.json). Breach fails the job
      # LOUDLY and writes the [ENH] issue body the filer step below posts
      # — crossing the line always produces work, never a silent bump.
      - name: Shard duration budget gate (gh-1300, down-only ratchet)
        id: shard_budget
        run: |
          python3 scripts/check_shard_durations.py \
            --budgets scripts/test_shard_budgets.json \
            --issue-body duration-budget-issue.md \
            --run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            integration-json-shards/*/integration-shard-*.json
      # Best-effort on forks (their GITHUB_TOKEN cannot write issues);
      # the gate failure above is the loud part. Deduped: an open
      # duration-budget issue is commented with the fresh numbers, not
      # duplicated (the nightly-red / flake-quarantine pattern).
      - name: File the duration-budget optimization issue (gh-1300)
        if: always() && steps.shard_budget.outcome == 'failure'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          gh label create duration-budget --force \
            --description "PTY/CLI shard over its duration budget (gh-1300)" \
            --color D93F0B --repo "$repo"
          title="[ENH] PTY/CLI shard duration budget breach (auto-filed)"
          existing=$(gh issue list --state open --label duration-budget \
            --json number --jq '.[0].number' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file duration-budget-issue.md \
              --repo "$repo"
          else
            gh issue create --title "$title" --label duration-budget \
              --body-file duration-budget-issue.md \
              --assignee ai-teammate --repo "$repo"
          fi
      # The auto-filed issue closes only when the run fits under the
      # budget again — the green path of THIS step is that proof.
      - name: Close the duration-budget issue on a fitting run
        if: always() && steps.shard_budget.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="$GITHUB_REPOSITORY"
          existing=$(gh issue list --state open --label duration-budget \
            --json number --jq '.[0].number' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$repo" \
              --body "Fits under budget again: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID} — closing."
            gh issue close "$existing" --repo "$repo"
          fi

  # gh-1005: Terminal visual is platform-independent and pinned to hosted
  # linux arm64. Evidence: every assertion reads the xterm terminal BUFFER /
  # screen text (never pixels — each PNG even ships a .txt twin "for
  # pixel-independent verification"), rendering goes through the BUNDLED
  # JetBrainsMono font (no host system fonts), and pty2 allocates the PTY
  # via libc openpty FFI. Nothing needs macOS — the old fa-m5 / macos-latest
  # routing (10x hosted-macOS minute cost, single-runner queue risk) is
  # gone; the nightly keeps an eyeball-only screenshot leg.
  pty-visual:
    name: Terminal visual (PTY screenshots, PR)
    runs-on: ubuntu-24.04-arm
    needs: changes
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # arm64: no official linux-arm64 release tarball (x64-only manifest) —
      # subosito/flutter-action cannot fetch stable here. Git bootstrap
      # (same as the flutter-tests leg): flutter_tools pulls the official
      # arm64 Dart SDK itself.
      - name: Flutter SDK (arm64 git bootstrap)
        shell: bash
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter precache
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pubcache-flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pubcache-flutter-${{ runner.os }}-
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: touch .env
      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart
      - uses: ./.github/actions/flutter-pub-get
      # The harness spawns `dart bin/fah.dart` FROM THE REPO ROOT; without
      # a root package config it resolves the package to the pub-cache copy
      # (an old published build) and the CLI dies before the first frame.
      - run: dart pub get
      # Issue #943 (vector 3): warm the build hooks — the cli_visual harness
      # spawns `dart bin/fah.dart` from the repo root and its boot budget
      # must not pay the cold-hook cost (tui_prototype_snapshot ×5).
      - name: Prewarm build hooks + fa boot
        run: |
          dart bin/fah.dart --help > /dev/null
          dart run bin/fah.dart --help > /dev/null
      - name: flutter test test/cli_visual --tags integration
        run: cd flutter_app && flutter test test/cli_visual --tags integration
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-visual-screenshots-pr
          path: test/integration/screenshots/
          retention-days: 7

  coverage-gate:
    name: Coverage ratchet
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-core]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Scope fastpass (out-of-scope → green in seconds)
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "no core/shared changes — coverage ratchet green-skipped (required context reported)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          # gh-1477: blobless full history — the ratchet reads coverage
          # metadata + base...head commit ranges, never historical blobs.
          fetch-depth: 0
          filter: blob:none

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          sdk: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge shard coverage (union DA hits per file, NOT cat)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          mkdir -p coverage
          python3 scripts/merge_lcov.py -o coverage/lcov.info coverage-shards/*/lcov.info

      # PRs pay the ratchet on CHANGED lines only (issue #177 wave 2): the
      # 80% bar applies to the diff; main/tags keep the full-suite ratchet.
      - name: Diff coverage ratchet (PR, changed lines >= 80%)
        if: (needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true') && github.event_name == 'pull_request'
        run: >-
          python3 scripts/diff_coverage.py
          --lcov coverage/lcov.info
          --base ${{ github.event.pull_request.base.sha }}
          --head ${{ github.event.pull_request.head.sha }}
          --min 80

      - name: Full coverage ratchet (main/tags, lib/ >= 80%)
        if: (needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true') && github.event_name != 'pull_request'
        run: python3 scripts/check_coverage.py 80

  guards:
    name: CRAP + duplication
    runs-on: ubuntu-24.04-arm
    needs: [changes, test-core]
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Scope fastpass (out-of-scope → green in seconds)
        if: needs.changes.outputs.core != 'true' && needs.changes.outputs.shared != 'true' && needs.changes.outputs.app != 'true'
        run: echo "no core/shared/app changes — guards green-skipped (required context reported)"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.app == 'true'

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          sdk: stable

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: '3.x'

      - name: Pub cache
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      # Same scope gate as every other step here: on a skipped (app-only)
      # PR no dart SDK is set up, so an unconditional pub get dies with 127.
      - run: dart pub get
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'

      - name: Native-assets hook cache
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        with:
          pattern: coverage-shard-*
          path: coverage-shards

      - name: Merge shard coverage (union DA hits per file, NOT cat)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          mkdir -p coverage
          python3 scripts/merge_lcov.py -o coverage/lcov.info coverage-shards/*/lcov.info

      - name: CRAP ratchet (threshold pinned in crap4dart.yaml)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          # Issue #447: 0.9.5+ carries the gate framework (broken_goldens
          # et al.); 0.2.1 knew only the CRAP ratchet. Both configs set
          # coverage.run_tests: false — the merged shard lcov above is the
          # coverage source; gates must not re-run the suite.
          # gh-1061: >=0.10.0 — analyzer 7.3→14.4 refresh + the
          # duplication.sources key (native cross-module scan).
          # gh-1106: >=0.11.0 — Type-2 renamed-clone detection
          # (duplication.ignore_locals) + gate baselines; the
          # duplication gate config throws on older parsers (unknown
          # keys are a ConfigException).
          # Bounded (rework review): a floating >= would auto-adopt
          # 0.12.0+ with no repo change — bump the ceiling deliberately.
          dart pub global activate crap4dart ">=0.11.0 <0.12.0"
          dart pub global run crap4dart analyze

      - name: Quality gates (broken goldens + Type-2 duplication, issue 1106)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: dart pub global run crap4dart check --baseline

      # Issue #1234 rework: 0.11.0 has no per-gate sources override (a
      # gates.loc.sources key is a ConfigException — caught here on
      # 019ede65), and the package config's sources drive the CRAP census
      # too, so test/ + example/ get the SAME loc gate from the companion
      # config (crap4dart.loc-scope.yaml) — the scope the retired shell
      # guards (gh-1232) scanned there. No baseline: nothing exceeds 2800
      # today, and the ceiling itself is the point.
      - name: Loc scope gate (test/ + example/, gh-1232 whole-tree ceiling)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: dart pub global run crap4dart check --config crap4dart.loc-scope.yaml --only loc

      - name: Duplication guard (lib/ < 1%)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          npx --yes jscpd@5 --min-tokens 50 --min-lines 5 --reporters json \
            --output /tmp/jscpd-ci lib/ || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open('/tmp/jscpd-ci/jscpd-report.json') as f:
                  pct = json.load(f)['statistics']['total']['percentage']
          except Exception:
              pct = 0.0
          print(f'Duplication: {pct}% (threshold < 1.0%)')
          sys.exit(0 if float(pct) < 1.0 else 1)
          EOF

      # Issue #487: cross-module duplication gate (issue body measured 20
      # files shipped as app↔core/fa_ui/browser_ext clones). Runs the SAME
      # stage the pre-commit hook runs — one marker, parity diffable. The
      # app leg matters: most cross-module clones are born on the app side
      # and the CRAP/dup steps above stay core/shared-scoped.
      - name: Cross-module duplication ratchet (issue #487)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true' || needs.changes.outputs.app == 'true'
        run: scripts/ci_fast_gate.sh --stages dupx

      # Issue #135 AC1 evidence: a realistic ~300 MB / 100k-record
      # session (3 branches, image blocks, compaction checkpoints)
      # opens through the windowed storage in bounded time and memory.
      # The timing numbers land in the job log; the bounds assertions
      # make regressions (an accidental full read at open) fail here.
      - name: Windowed-open scale evidence (issue #135 AC1)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          dart run scripts/gen_session_fixture.dart \
            --records 100000 --out /tmp/big-session.jsonl \
            --branches 3 --images --compactions --measure | tee /tmp/ac1.log
          python3 - <<'EOF'
          import re, sys
          log = open('/tmp/ac1.log').read()
          total = int(re.search(r'countRecords: (\d+)', log).group(1))
          resident = int(re.search(r'open\+tail: (\d+)', log).group(1))
          assert total >= 100000, f'unexpected record count {total}'
          # The resident window after open is the tail chunk (200) —
          # a full read at open would report ~100k here.
          assert resident <= 1000, f'open read too much: {resident}'
          print(f'AC1 bounds OK: {total} records, {resident} resident at open')
          EOF

      # Issue #199 evidence: a FULL open of the same fixture through the
      # isolate parse executor matches the inline default (parity asserted
      # in-process), and listing 500 small sessions through the repo's
      # bounded-parallel list stays fast. Bounds are generous CI guards;
      # the real numbers land in the job log for trend tracking.
      - name: Isolate parse + parallel listing evidence (issue #199)
        if: needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          dart run scripts/gen_session_fixture.dart \
            --records 100000 --out /tmp/big-session.jsonl \
            --branches 3 --images --compactions --measure | tee /tmp/ac199.log
          dart run scripts/gen_session_fixture.dart \
            --list-sessions 500 --out /tmp/sessions-199 | tee /tmp/ac199-list.log
          python3 - <<'EOF'
          import re, sys
          log = open('/tmp/ac199.log').read()
          isolate = int(re.search(r'full-open isolate: (\d+)', log).group(1))
          assert isolate < 120000, f'isolate full-open too slow: {isolate} ms'
          assert 'isolate parity: OK' in log, 'isolate/inline parity mismatch'
          llog = open('/tmp/ac199-list.log').read()
          listed = int(re.search(r'list 500 sessions: (\d+)', llog).group(1))
          assert listed < 5000, f'list of 500 sessions too slow: {listed} ms'
          print(f'AC199 OK: isolate full-open {isolate} ms, '
                f'list 500 sessions {listed} ms')
          EOF

  # Flutter app analyze split out of the test job (was serial pub get →
  # analyze → test in one 6-min job): analyze runs in parallel with the
  # sharded test legs, each leg no longer waits for it.
  flutter-analyze:
    name: Flutter app analyze (ubuntu)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pubcache-flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pubcache-flutter-${{ runner.os }}-

      # .env is gitignored but declared as a Flutter asset (flutter_dotenv);
      # newer flutter validates assets at pub-get/test-build time, so the
      # placeholders must exist BEFORE flutter pub get. Content mirrors the
      # proven build-macos.yml incantation (bare `touch` produced "No file or
      # variants found for asset: .env" on ubuntu/flutter 3.47.4).
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      # firebase_options.dart is gitignored; the tracked placeholder makes it
      # compile (Firebase init is skipped for YOUR_* values at runtime).
      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - uses: ./.github/actions/flutter-pub-get

      # gh-1296 NG1: the Podfile.lock half of the lockfile gate. pub get just
      # generated .flutter-plugins-dependencies; the gate fails the PR when a
      # native iOS/macOS plugin resolved by the committed pubspec.lock has no
      # pod in the platform's Podfile.lock, or its pod is pinned at a stale
      # version vs the resolved podspec (the gh-1274 class, plus the
      # flutter_gemma 1.8.0-vs-1.11.3 skew this PR fixed). Self-tested in
      # Static gates (AC2).
      - name: Lockfile pod-sync gate (gh-1296 NG1)
        run: bash scripts/check_lockfiles.sh pod-sync

      # Issue #1234: the flutter_app ≤2800-line guard moved into the app
      # crap4dart.yaml loc gate — enforced whole-tree by the app-crap-gate
      # job's `crap4dart check --baseline` (app_localizations.dart is
      # gen-l10n output, excluded in the gate config). The shell find-exec
      # guard (gh-1232 AC2) is gone.

      - name: flutter analyze
        run: cd flutter_app && flutter analyze --no-fatal-infos --no-fatal-warnings

  # flutter_app tests sharded ×2 by a deterministic modulo split of the
  # sorted suite (same file list as before — golden + cli_visual stay out,
  # host-locked): each leg is ~half the test phase; pub-cache shared with
  # flutter-analyze so a warm leg pair reuses downloads.
  flutter-tests:
    name: Flutter app tests (shard ${{ matrix.shard }}/2)
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    # End-of-run drain can stall minutes under shared-runner load while
    # every test already passed (0 failures, killed mid-drain on #330):
    # fa_ui shards get 12m and flutter_app is the heaviest package.
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64: no official linux-arm64 release tarball (x64-only manifest) —
      # subosito/flutter-action cannot fetch stable here. Bootstrap via git
      # clone instead: flutter_tools pulls the official arm64 Dart SDK itself.
      - name: Flutter SDK (arm64 git bootstrap)
        shell: bash
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter precache
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pubcache-flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pubcache-flutter-${{ runner.os }}-

      # See flutter-analyze: placeholder must exist before pub get.
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - uses: ./.github/actions/flutter-pub-get

      # Golden suite is intentionally NOT here: goldens are host-locked
      # (same macOS host renders them differently across minor SDKs — see the
      # dynamic_messages saga) and would all redden on ubuntu. Widget/unit
      # tests run here on a cheap runner; goldens stay guarded by
      # build-macos.yml and the nightly full matrix (issue #177 E5/OQ3:
      # pinned-font golden migration is a follow-up, not this card).
      - name: flutter test (shard ${{ matrix.shard }}/2)
        # Goldens stay out (host-locked, see the golden comment above).
        # Native-dependent tests (quickjs_c_bridge .so, mic channel) are NOT
        # excluded — issue #184 made them host-portable via the skip guard in
        # flutter_app/test/native_test_guard.dart + the injected-ASR fix.
        # Deterministic modulo split of the sorted file list: shard i takes
        # lines where NR % 2 == i — union == the old single job's list.
        run: |
          cd flutter_app
          find test -name '*_test.dart' ! -path '*/golden/*' ! -path '*/cli_visual/*' \
            | sort | awk -v i=${{ matrix.shard }} 'NR % 2 == i' > shard-files.txt
          echo "shard files: $(wc -l < shard-files.txt)"
          # --coverage (issue #433): each shard emits lcov for the
          # app-crap-gate job; the covered surface matches the CRAP
          # sources [lib] exactly.
          flutter test --exclude-tags integration --coverage $(cat shard-files.txt)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: app-coverage-shard-${{ matrix.shard }}
          path: flutter_app/coverage/lcov.info
          retention-days: 2

      # Issue #239 AC3: the App Store submission pre-flight matrix is plain
      # ruby over flutter_app/fastlane/appstore_preflight.rb — no gems,
      # runs in under a second on the runner's stock ruby.
      # Issue #289 adds the fastlane guard/preflight suites (android id
      # guard + Play upload pre-flight) — same plain-ruby contract, so the
      # step loops over every fastlane test file. Shard 0 only: once is
      # enough (fa PR #333).
      - name: Fastlane pre-flight suites (ruby)
        if: matrix.shard == 0
        run: |
          for t in flutter_app/fastlane/test/*_test.rb; do
            echo "::group::ruby $t"
            ruby "$t"
            echo "::endgroup::"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # Issue #1267 N1 — the macOS exclusion-zone leg. By #177 design the ubuntu
  # PR leg never EXERCISES the JS-engine suites: flutter_app/test/apps/**
  # skip their engine-dependent tests on ubuntu (native_test_guard.dart
  # finds no QuickJS .so on a bare runner), so that surface ran only in the
  # nightly macOS leg — the hole #1309 escaped through (gh-1307: an
  # apps/engine regression merged green and went red the same night).
  #
  # Trigger model (dispatch-only CI, gh-1280 binaries-pr idiom): ci.yml has
  # NO pull_request trigger — PR validation arrives as an SM
  # workflow_dispatch on the head SHA (machine-sm.yml), where the paths
  # classifier cannot run (no pull_request event diff). The leg is
  # therefore path-BLIND on dispatches: it runs in EVERY SM validation
  # (one hosted-macOS leg beside the build-macos/build-ios legs already
  # paid there), and the exzone path set only narrows a future real
  # pull_request trigger. Main/tag/schedule/release runs skip it — the
  # nightly flutter-app-macos leg stays the full-suite backstop there.
  # ─────────────────────────────────────────────────────────────────────────
  flutter-app-exzone:
    name: Exclusion zone (macOS JS-engine tests)
    runs-on: macos-latest
    needs: changes
    if: >-
      (github.event_name == 'pull_request' && needs.changes.outputs.exzone == 'true') ||
      github.event_name == 'workflow_dispatch'
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same SDK incantation as the nightly flutter-app-macos leg.
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF
      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart
      - uses: ./.github/actions/flutter-pub-get
      # The guard resolves true on macOS (JavaScriptCore), so the
      # engine-dependent tests RUN here instead of skipping as on ubuntu.
      - name: flutter test test/apps (JS engine live)
        working-directory: flutter_app
        run: flutter test --exclude-tags integration test/apps

  # Issue #433: flutter_app CRAP ratchet — the app's beasts were never
  # gated (the root crap4dart.yaml covers core lib/bin only). The 2
  # flutter-tests shards above now emit --coverage; this job merges them
  # into ONE lcov (union DA hits, never cat — same as the core guards)
  # and runs the pinned crap4dart against flutter_app/crap4dart.yaml.
  # It is also the only home of the config guards: badge sync (AC1),
  # generated-exclude parity (E1) and the only-down git-history threshold
  # guard (AC3) — a raised threshold cannot merge, a new one (bootstrap)
  # can.
  app-crap-gate:
    name: Flutter app CRAP ratchet
    runs-on: ubuntu-latest
    needs: [changes, flutter-tests]
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - name: Scope fastpass (out-of-scope → green in seconds)
        if: needs.changes.outputs.app != 'true' && needs.changes.outputs.shared != 'true'
        run: echo "no app/shared changes — flutter_app CRAP green-skipped (required context reported)"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        with:
          fetch-depth: 0 # only-down guard diffs thresholds against the base
          # gh-1477: blobless — historical blobs are never read.
          filter: blob:none
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        with:
          python-version: '3.x'
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        with:
          sdk: stable
      - name: Pub cache (crap4dart)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-crap4dart-${{ runner.os }}
          restore-keys: pub-crap4dart-${{ runner.os }}-
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        with:
          pattern: app-coverage-shard-*
          path: app-coverage-shards
      - name: Merge shard coverage (union DA hits per file, NOT cat)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          count=$(ls app-coverage-shards/*/lcov.info 2>/dev/null | wc -l | tr -d ' ')
          if [ "$count" != "2" ]; then
            echo "::error::expected 2 app shard coverage reports, got $count"
            exit 1
          fi
          mkdir -p flutter_app/coverage
          python3 scripts/merge_lcov.py -o flutter_app/coverage/lcov.info \
            app-coverage-shards/*/lcov.info
      - name: Config guards — badge sync, exclude parity, only-down (AC1/E1/AC3)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          [ -n "$BASE_SHA" ] || BASE_SHA=HEAD~1
          python3 scripts/check_crap_guards.py --only-down "$BASE_SHA"
      - name: CRAP ratchet (threshold pinned in flutter_app/crap4dart.yaml)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: |
          # Issue #447: pin bumped 0.2.1 → >=0.9.5 for the gate framework.
          # gh-1061: >=0.10.0 (analyzer 14.4 refresh).
          # gh-1106: >=0.11.0 <0.12.0 — same bounded pin as the core job;
          # 0.11.0 carries the Type-2 duplication gate the repo pins to.
          # coverage.run_tests: false in both configs — the merged shard
          # lcov above is the source; never re-run the suite here.
          dart pub global activate crap4dart ">=0.11.0 <0.12.0"
          cd flutter_app && dart pub global run crap4dart analyze --format json > crap_report.json

      # Issue #490 AC2: publish the ranked CRAP JSON even when the ratchet
      # is red (analyze writes the report to stdout before its non-zero
      # exit) — descents rank from this artifact, never from a local
      # ad-hoc run.
      - name: Upload crap_report.json artifact (issue 490 AC2)
        if: always() && (needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crap_report
          path: flutter_app/crap_report.json
          retention-days: 30

      - name: Pixel and flutter gates over test/golden/goldens (issue 447)
        if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
        run: cd flutter_app && dart pub global run crap4dart check

  # Issue #283: fa_ui tests sharded ×3 by the test-core template — a
  # duration-balanced manifest (scripts/faui_test_shards.json, rebalanced
  # weekly by shard-rebalance.yml), one file executed by exactly ONE shard,
  # goldens excluded exactly as before (host-locked). Shards fan out INSIDE
  # the job graph; only the aggregate Quality gate is a required check, so
  # a red shard = red gate and path-skipped = neutral (AC4 semantics). A
  # single failed matrix leg can be rerun alone via "Re-run failed jobs"
  # (E1) — the gate then re-aggregates the same results.
  test-faui:
    name: fa_ui tests (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 12
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # Shard-manifest assert (AC1/E4): union of the 3 selections == the
      # full non-golden suite, pairwise disjoint, ZERO golden leakage —
      # fails loudly on manifest drift or a golden-pattern rename before
      # any test runs. Pure python, no flutter needed.
      - name: Assert shard manifest (union/disjoint/no-goldens)
        working-directory: packages/fa_ui
        run: >-
          python3 ../../scripts/assert_shard_manifest.py
          ../../scripts/faui_test_shards.json --shards 3 --exclude golden

      - run: cd packages/fa_ui && flutter pub get

      # E2: a NEW test file added by a PR needs no manifest edit —
      # shard_files.py bin-packs uncovered files into shards at runtime;
      # the weekly rebalance then absorbs them into the manifest.
      - name: flutter test --coverage (shard ${{ matrix.shard }}/3)
        working-directory: packages/fa_ui
        run: |
          targets=$(python3 ../../scripts/shard_files.py \
            ../../scripts/faui_test_shards.json ${{ matrix.shard }} --exclude golden)
          echo "shard targets: $targets"
          mkdir -p test-results
          flutter test --exclude-tags integration --coverage \
            --file-reporter="json:test-results/flutter-shard-${{ matrix.shard }}.json" \
            $targets
          python3 ../../scripts/junit_from_dart_json.py \
            test-results/flutter-shard-${{ matrix.shard }}.json \
            test-results/junit-faui-shard-${{ matrix.shard }}.xml

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faui-coverage-shard-${{ matrix.shard }}
          path: packages/fa_ui/coverage/lcov.info
          retention-days: 2

      # junit durations for the weekly shard-rebalance.yml (AC3), same
      # contract as the core shards.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: junit-faui-shard-${{ matrix.shard }}
          path: packages/fa_ui/test-results/junit-faui-shard-${{ matrix.shard }}.xml
          retention-days: 7

  # E3/AC6: the 3 shard reports merge into ONE lcov (union DA hits, never
  # cat — no triple-counting). fa_ui coverage is NOT fed into the 80%
  # ratchet: the coverage gate's semantics stay exactly as before; this
  # merged report is telemetry/evidence only.
  faui-coverage:
    name: fa_ui coverage merge (one report)
    runs-on: ubuntu-latest
    needs: [changes, test-faui]
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: faui-coverage-shard-*
          path: faui-coverage-shards

      - name: Merge shard coverage (union DA hits per file, NOT cat)
        run: |
          count=$(ls faui-coverage-shards/*/lcov.info | wc -l | tr -d ' ')
          if [ "$count" != "3" ]; then
            echo "::error::expected 3 fa_ui shard coverage reports, got $count"
            exit 1
          fi
          mkdir -p packages/fa_ui/coverage
          python3 scripts/merge_lcov.py \
            -o packages/fa_ui/coverage/lcov.merged.info \
            faui-coverage-shards/*/lcov.info

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: faui-coverage
          path: packages/fa_ui/coverage/lcov.merged.info
          retention-days: 14

  # Aggregate required check: branch protection requires ONE stable context.
  # Skipped legs (path-filtered out) count as pass — a docs PR must go green
  # on static alone.
  # gh-1005: pinned to hosted linux arm64 alongside pty-visual — same
  # platform-independence evidence (buffer/screen-text assertions, bundled
  # JetBrainsMono, openpty PTYs); PTY screenshots need no macOS, hosted or
  # self-hosted.
  cli-visual-settings:
    name: Settings screenshots (PTY)
    runs-on: ubuntu-24.04-arm
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 git bootstrap (no official linux-arm64 Flutter tarball) — same
      # as the flutter-tests and pty-visual legs.
      - name: Flutter SDK (arm64 git bootstrap)
        shell: bash
        run: |
          git clone --depth 1 -b stable https://github.com/flutter/flutter.git "$HOME/flutter"
          echo "$HOME/flutter/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/flutter/bin:$PATH"
          flutter --version
          flutter precache
      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pubcache-flutter-${{ runner.os }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: pubcache-flutter-${{ runner.os }}-

      # Same placeholder assets the nightly cli-visual job and the ubuntu
      # flutter-tests leg create (see those jobs for the why).
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: touch .env

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - uses: ./.github/actions/flutter-pub-get

      # The harness spawns `dart bin/fah.dart` FROM THE REPO ROOT; without
      # a root package config that resolves package:flutter_agent_harness
      # to the pub-cache copy (an old published build) and the CLI dies on
      # compile errors before the first frame. flutter_app's pub get only
      # writes flutter_app/.dart_tool — the root needs its own.
      - run: dart pub get

      - name: flutter test cli_visual (settings hub flows only)
        run: >-
          cd flutter_app && flutter test test/cli_visual/fa_cli_visual_test.dart
          --tags integration --name "settings hub → (compaction|memory)"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: cli-visual-settings-screenshots
          path: test/integration/screenshots/
          retention-days: 7

  # Aggregate required check: branch protection requires ONE stable context.
  # Skipped legs (path-filtered out) count as pass — a docs PR must go green
  # on static alone.

  # ─────────────────────────────────────────────────────────────────────────
  # Issue #280: PR-level BUILD verification. The gates above analyze and
  # test but never COMPILE a platform target — a PR could go green while
  # breaking the iOS/macOS/Android/web build (pod/entitlement drift,
  # web-only compile errors, asset manifest breakage), discovered later by
  # build-mobile.yml/build-macos.yml at release time. Four parallel debug
  # legs below close that gap, gated on app/shared changes only (docs/core
  # PRs never pay). Debug mode on PRs: compile-truth is the goal; release-
  # only concerns (tree-shaking, R8, codesign) live in the nightly release
  # matrix (nightly.yml). Budgets (#177): ≤8 min warm / ≤15 min cold per
  # leg, ≤10 min wall added to an app-touching PR (legs run in parallel).
  # E4: both macOS legs use GitHub-hosted macos-latest — every job gets its
  # own ephemeral VM, so ios+macos are never serialized on one runner (and
  # PR code never lands on the self-hosted release pool).
  # ─────────────────────────────────────────────────────────────────────────

  build-web:
    name: Build web (debug)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to the same SDK as the release path (#281): 3.47.x. The
      # action's cache key embeds the resolved SDK version, so an SDK bump
      # in a PR never restores a poisoned cache (E1).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - uses: ./.github/actions/flutter-pub-get

      - name: flutter build web
        # E3: warnings (including the Wasm dry-run diagnostics) are allowed;
        # compile errors fail via the exit code — same fatal semantics as
        # the flutter-tests leg's analyze step.
        run: cd flutter_app && flutter build web

  build-android:
    name: Build Android APK (debug)
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      # The google-services Gradle plugin (applied unconditionally in
      # android/app/build.gradle.kts) refuses to run without this file.
      # #622 commits a placeholder carrying BOTH flavor clients
      # (dev.fa1.app + dev.fa1.app.god); keep it whenever present — the
      # debug-APK smoke pins the store flavor (`--flavor store`, only the
      # dev.fa1.app client is needed); god compile truth is covered by the
      # flavor matrix release job. Only when the file is missing
      # (old forks/history) seed the structurally-valid dev.fa1.app
      # placeholder — debug APKs never talk to Firebase with it; the goal
      # here is compile truth (#280).
      - name: Create placeholder google-services.json
        working-directory: flutter_app
        run: |
          set -euo pipefail
          if [ -f android/app/google-services.json ]; then
            echo "committed google-services.json present (dev.fa1.app + dev.fa1.app.god) — keeping it"
          else
            cat > android/app/google-services.json << 'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "fa1-placeholder",
              "storage_bucket": "fa1-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "dev.fa1.app"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyA-PLACEHOLDER-KEY-FOR-DEBUG-BUILDS-000000"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          EOF
          fi

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - uses: ./.github/actions/flutter-pub-get

      - name: flutter build apk (debug)
        run: cd flutter_app && flutter build apk --debug --flavor store

  build-ios:
    name: Build iOS (debug, unsigned)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      # bf81411e added GoogleService-Info.plist to the Runner target
      # resources (a hard build input). The real plist is gitignored; the
      # release path writes it from GOOGLE_SERVICE_INFO_PLIST_BASE64
      # (build-mobile.yml), but PR legs have no such secret — seed a
      # placeholder, same trick as the android leg's placeholder
      # google-services.json. Xcode only copies the file; Firebase reads
      # it at app runtime, never at build time.
      - name: Write placeholder GoogleService-Info.plist (iOS)
        run: |
          set -euo pipefail
          cat > flutter_app/ios/Runner/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:000000000000:ios:0000000000000000000000</string>
          	<key>API_KEY</key>
          	<string>AIzaSyA-PLACEHOLDER-KEY-FOR-DEBUG-BUILDS-000000</string>
          	<key>PROJECT_ID</key>
          	<string>fa1-placeholder</string>
          	<key>PROJECT_NUMBER</key>
          	<string>000000000000</string>
          	<key>BUNDLE_ID</key>
          	<string>dev.fa1.app</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_CRASHLYTICS_ENABLED</key>
          	<false/>
          </dict>
          </plist>
          EOF
          plutil -lint flutter_app/ios/Runner/GoogleService-Info.plist

      # E2: pods cache keyed on Podfile.lock AND a weekly-rolled epoch, so
      # CocoaPods spec drift is re-verified at least weekly even when the
      # lockfile is unchanged. restore-keys falls back to last week's
      # same-lock cache (never a cross-lock cache).
      - name: Compute weekly pods-cache epoch
        id: week
        run: echo "epoch=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods (iOS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flutter_app/ios/Pods
          key: ios-pods-ci-v1-${{ hashFiles('flutter_app/ios/Podfile.lock') }}-${{ steps.week.outputs.epoch }}
          restore-keys: |
            ios-pods-ci-v1-${{ hashFiles('flutter_app/ios/Podfile.lock') }}-

      - name: Restore vendored WasmRun iOS framework
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # The prebuilt XCFramework is excluded from git (the release path
          # prefers the self-hosted runner's local copy; GitHub-hosted PR
          # legs always take the pinned upstream fallback).
          DEST="vendor/wasm_run_flutter/ios/Frameworks"
          rm -rf "$DEST/WasmRun.xcframework"
          mkdir -p "$DEST"
          # --retry alone skips transient mid-transfer resets (curl 56).
          curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o /tmp/WasmRun.xcframework.zip \
            https://github.com/juancastillo0/wasm_run/releases/download/wasm_run-v0.1.0/WasmRun.xcframework.zip
          unzip -q /tmp/WasmRun.xcframework.zip -d "$DEST"
          ls -la "$DEST/WasmRun.xcframework"

      - uses: ./.github/actions/flutter-pub-get

      - name: flutter build ios (debug, unsigned)
        # E2, corrected by gh-1296: classify the failure by EVIDENCE in the
        # log, not by a blanket keyword. The old grep matched 'cocoapods' or
        # 'pod install' in EVERY flutter iOS build log ("Running pod
        # install… 4.4s" prints even on green builds), so every failure was
        # mislabeled "CocoaPods layer — likely spec drift" — that
        # mislabeling sent gh-1296 at a Podfile.lock fix while the real
        # killer was a package build hook (sqlite3's native-assets download
        # hash check). Most-specific layer first; unmatched failures stay
        # unlabeled rather than guessed.
        run: |
          set -o pipefail
          cd flutter_app
          if ! flutter build ios --debug --no-codesign 2>&1 | tee /tmp/build-ios.log; then
            if grep -qE 'Building native assets failed|build_hooks failed|Hash of downloaded file|build\.dart returned with exit code' /tmp/build-ios.log; then
              if grep -q 'Hash of downloaded file' /tmp/build-ios.log; then
                echo "::error::iOS build failed in the NATIVE-ASSETS layer: a package build hook downloaded a prebuilt artifact whose SHA-256 no longer matches the hash pinned in the package (upstream re-uploaded a release asset, gh-1296). NOT a CocoaPods/Podfile problem. It self-heals when upstream restores the asset — or bump the package version. The hook's 'To reproduce run:' line above names the package; check its GitHub releases. Raw log above."
              else
                echo "::error::iOS build failed in the NATIVE-ASSETS layer: a package build hook (hook/build.dart) failed. The log names the package and its 'To reproduce run:' line — reproduce locally. NOT a CocoaPods/Podfile problem. Raw log above."
              fi
            elif grep -qE "CocoaPods could not find compatible versions|The sandbox is not in sync with the Podfile\.lock|No podspec found|Error running pod install|Unable to satisfy the following requirements" /tmp/build-ios.log; then
              echo "::error::iOS build failed in the CocoaPods layer — spec/sandbox drift. Fix: cd flutter_app/ios && pod install --repo-update, commit the regenerated Podfile.lock (the pods cache re-rolls weekly, see the cache step; scripts/check_lockfiles.sh pod-sync catches this class pre-merge). Raw log above."
            else
              echo "::error::iOS build failed (Xcode/app layer — no CocoaPods or native-assets signature in the log; read the first error above)."
            fi
            exit 1
          fi

  build-macos:
    name: Build macOS (debug)
    runs-on: macos-latest
    needs: changes
    if: needs.changes.outputs.app == 'true' || needs.changes.outputs.shared == 'true'
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      # Same reason as the iOS leg: bf81411e made Runner/GoogleService-Info.plist
      # a build input; gitignored + release-secret-only, so PR legs seed a
      # placeholder. Also satisfies the 'Crashlytics: upload dSYMs' phase's
      # inputPaths (the phase itself skips in debug — no dSYM).
      - name: Write placeholder GoogleService-Info.plist (macOS)
        run: |
          set -euo pipefail
          cat > flutter_app/macos/Runner/GoogleService-Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>GOOGLE_APP_ID</key>
          	<string>1:000000000000:macos:0000000000000000000000</string>
          	<key>API_KEY</key>
          	<string>AIzaSyA-PLACEHOLDER-KEY-FOR-DEBUG-BUILDS-000000</string>
          	<key>PROJECT_ID</key>
          	<string>fa1-placeholder</string>
          	<key>PROJECT_NUMBER</key>
          	<string>000000000000</string>
          	<key>BUNDLE_ID</key>
          	<string>dev.fa1.app</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_CRASHLYTICS_ENABLED</key>
          	<false/>
          </dict>
          </plist>
          EOF
          plutil -lint flutter_app/macos/Runner/GoogleService-Info.plist

      - name: Compute weekly pods-cache epoch
        id: week
        run: echo "epoch=$(date -u +%Y-W%V)" >> "$GITHUB_OUTPUT"

      - name: Cache CocoaPods (macOS)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: flutter_app/macos/Pods
          key: macos-pods-ci-v1-${{ hashFiles('flutter_app/macos/Podfile.lock') }}-${{ steps.week.outputs.epoch }}
          restore-keys: |
            macos-pods-ci-v1-${{ hashFiles('flutter_app/macos/Podfile.lock') }}-

      - name: Restore vendored WasmRun macOS framework
        timeout-minutes: 15
        run: |
          set -euo pipefail
          # Same upstream-release fallback as the iOS leg (framework is
          # excluded from git).
          DEST="vendor/wasm_run_flutter/macos/Frameworks"
          rm -rf "$DEST/WasmRun.xcframework"
          mkdir -p "$DEST"
          curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o /tmp/WasmRun.xcframework.zip \
            https://github.com/juancastillo0/wasm_run/releases/download/wasm_run-v0.1.0/WasmRun.xcframework.zip
          unzip -q /tmp/WasmRun.xcframework.zip -d "$DEST"
          ls -la "$DEST/WasmRun.xcframework"

      - uses: ./.github/actions/flutter-pub-get

      # The macOS Podfile bundles the LiteRT-LM companion dylibs via a
      # Runner script phase that fails on a fresh runner ("Could not find
      # macOS companion dylibs") — seed from the pinned upstream native
      # release, sha256-verified (same incantation as build-macos.yml).
      - name: Ensure flutter_gemma macOS companion dylibs
        run: |
          set -euo pipefail
          GEMMA_CACHE="$HOME/Library/Caches/flutter_gemma/native/macos_arm64"
          if [ -f "$GEMMA_CACHE/libGemmaModelConstraintProvider.dylib" ]; then
            echo "companion dylibs already cached"
          else
            echo "seeding companion dylibs from flutter_gemma native-v0.16.0"
            mkdir -p "$GEMMA_CACHE"
            curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
              -o /tmp/litertlm-macos_arm64.tar.gz \
              https://github.com/DenisovAV/flutter_gemma/releases/download/native-v0.16.0/litertlm-macos_arm64.tar.gz
            echo "c597554a7a5cdf099658227099a54ef4916c5802b9182757e656e1788f9426b6  /tmp/litertlm-macos_arm64.tar.gz" | shasum -a 256 -c -
            tar xzf /tmp/litertlm-macos_arm64.tar.gz -C "$GEMMA_CACHE"
          fi
          ls -la "$GEMMA_CACHE"

      - name: flutter build macos (debug)
        run: |
          set -o pipefail
          cd flutter_app
          if ! flutter build macos --debug 2>&1 | tee /tmp/build-macos.log; then
            if grep -qiE 'cocoapods|pod install|pod repo|No podspec' /tmp/build-macos.log; then
              echo "::error::macOS build failed in the CocoaPods layer — likely spec drift. Fix: cd flutter_app/macos && pod install --repo-update, commit the regenerated Podfile.lock (the pods cache re-rolls weekly, see the cache step). Raw log above."
            fi
            exit 1
          fi

  # ─────────────────────────────────────────────────────────────────────────
  # SEC-08 (#796): CI supply-chain gate. Runs on EVERY PR — no path gating,
  # a security gate you can dodge with a cunning diff is not a gate.
  supply-chain:
    name: Supply-chain gate
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Known limit: pull_request/dispatched runs execute THIS file and the
      # checker from the PR's own head — a PR can edit the gate in the same
      # diff. Backstops: reviewers see workflow edits, Dependabot PRs
      # re-verify on main, and the gate is re-enforced by any post-merge
      # scheduled run. A hard guarantee needs a separate workflow_call gate
      # pinned by SHA, invoked from a caller that never comes from the PR
      # (follow-up issue, not this PR).

      # AC1: zero mutable third-party action refs (script + CI job).
      - name: AC1 — all third-party actions SHA-pinned
        run: bash scripts/check_action_pins.sh

      # AC2: every workflow declares an explicit top-level permissions block.
      - name: AC2 — every workflow declares top-level permissions
        run: |
          status=0
          shopt -s nullglob
          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -f "$f" ] || continue
            if ! grep -q '^permissions:' "$f"; then
              echo "::error file=$f::missing top-level permissions: block"
              status=1
            fi
          done
          exit $status

      # AC4 (REG): the checker must reject a @v4 fixture, a 40-char NON-hex
      # ref (mutable branch with a SHA-shaped name), and a nested composite
      # action manifest — and accept clean equivalents. A gate that cannot
      # fail is decoration.
      - name: AC4 — pin-checker fixture regression
        run: |
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/bad" "$tmp/bad-hex" "$tmp/bad-composite/.github/actions/probe/deep" "$tmp/bad-awf-ref" "$tmp/bad-other-main" "$tmp/good" "$tmp/good-awf-main" "$tmp/good-composite/.github/actions/probe/deep" "$tmp/string-safe"
          printf 'jobs:\n  probe:\n    steps:\n      - uses: actions/checkout@v4\n' > "$tmp/bad/bad.yml"
          printf 'jobs:\n  probe:\n    steps:\n      - uses: actions/checkout@gggggggggggggggggggggggggggggggggggggggg\n' > "$tmp/bad-hex/bad.yml"
          printf 'jobs:\n  probe:\n    steps:\n      - uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@master\n' > "$tmp/bad-awf-ref/wf.yml"
          printf 'jobs:\n  probe:\n    steps:\n      - uses: actions/checkout@main\n' > "$tmp/bad-other-main/wf.yml"
          printf 'name: probe\nruns:\n  using: composite\n  steps:\n    - uses: actions/checkout@v4\n' > "$tmp/bad-composite/.github/actions/probe/deep/action.yaml"
          printf 'jobs:\n  probe:\n    steps:\n      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4\n' > "$tmp/good/good.yml"
          # owner directive 2026-10-04: awf@main is the ONE accepted mutable
          # ref (always-latest, review-gated; per-stub-enforced by
          # test/machine_kit/factory_stub_ref_test.dart). Every other
          # mutable ref — awf at a non-main ref, another repo at main —
          # stays a violation (fixtures above).
          printf 'jobs:\n  probe:\n    uses: IstiN/dmtools-agentic-workflows/.github/workflows/factory-sm.yml@main\n' > "$tmp/good-awf-main/wf.yml"
          printf 'name: probe\nruns:\n  using: composite\n  steps:\n    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4\n' > "$tmp/good-composite/.github/actions/probe/deep/action.yaml"
          # String-safety: a uses-shaped string INSIDE a run: scalar is not a
          # step ref — the checker is line-anchored (^[[:space:]]*(- )?uses:)
          # and must not flag it. (Regression: a reviewer suspected the
          # fixture printf lines in this very workflow would trip AC1.)
          printf "jobs:\n  probe:\n    steps:\n      - name: write fixture\n        run: |\n          printf 'jobs:\\\\n  probe:\\\\n    steps:\\\\n      - uses: actions/checkout@v4\\\\n' > out.yml\n          bash scripts/check_action_pins.sh --path . >/dev/null 2>&1 || true\n" > "$tmp/string-safe/wf.yml"
          for bad in bad bad-hex bad-composite bad-awf-ref bad-other-main; do
            if bash scripts/check_action_pins.sh --path "$tmp/$bad" >/dev/null 2>&1; then
              echo "::error::pin checker FAILED to flag the $bad fixture"
              exit 1
            fi
          done
          bash scripts/check_action_pins.sh --path "$tmp/good" >/dev/null
          bash scripts/check_action_pins.sh --path "$tmp/good-awf-main" >/dev/null
          bash scripts/check_action_pins.sh --path "$tmp/good-composite" >/dev/null
          bash scripts/check_action_pins.sh --path "$tmp/string-safe" >/dev/null
          echo "fixture regression OK: @v4 / 40-char non-hex / unpinned nested composite / awf@master / other-repo@main rejected; SHA-pinned + awf@main accepted; uses-shaped run-scalar strings ignored"

  # SEC-08 (#796): audit BOTH dependency graphs. pubspec_overrides.yaml
  # redirects dart_tui to the vendored fork (vendor/dart_tui) for local/CI/
  # release builds while pubspec.yaml pins hosted dart_tui for the published
  # package — two different graphs; an audit of one says nothing about the
  # other. Each graph gets its own matrix leg and the split is documented in
  # the audit output.
  dep-audit:
    name: Dependency audit (${{ matrix.graph }})
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        graph: [hosted, vendored]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      # Hosted leg = exactly what pub.dev consumers resolve; the overrides
      # file never ships, so it must not bend this graph.
      - name: Park vendored overrides (hosted leg)
        if: matrix.graph == 'hosted'
        run: |
          [ -f pubspec_overrides.yaml ] || {
            echo "::error::pubspec_overrides.yaml missing — hosted-leg precondition broke, parking nothing would bend the graph silently"
            exit 1
          }
          mv pubspec_overrides.yaml pubspec_overrides.yaml.vendored
      - run: dart pub get
      - name: Audit the ${{ matrix.graph }} dependency graph
        env:
          GRAPH: ${{ matrix.graph }}
        run: |
          {
            echo "### Dependency audit — \`${GRAPH}\` graph"
            echo ""
            echo "This repo resolves TWO dependency graphs (SEC-08):"
            echo "- **hosted** — \`pubspec.yaml\` alone: what \`pub publish\` ships and pub.dev consumers resolve (dart_tui hosted)."
            echo "- **vendored** — \`pubspec.yaml\` + \`pubspec_overrides.yaml\`: local dev, CI and the release binaries (dart_tui rides \`vendor/dart_tui\`)."
            echo ""
            echo "An audit of one says nothing about the other, so both are audited on every run. Resolved graph:"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          dart pub deps --style=compact | tee /tmp/graph.txt >> "$GITHUB_STEP_SUMMARY" || true
          {
            echo ""
            echo "Outdated direct dependencies (informational):"
            echo '```'
            dart pub outdated
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
          # The split must be REAL: each leg resolves dart_tui from its own
          # source, read from the resolved pubspec.lock. The block runs from
          # the `dart_tui:` entry header to the next top-level entry header
          # (two-space indent) — no fixed line window to rot.
          lock_block=$(awk 'f && /^  [A-Za-z0-9_.-]+:$/ { exit } /^  dart_tui:$/ { f = 1 } f { print }' pubspec.lock)
          # Vacuous-assertion guard: if dart_tui ever leaves the lock (or
          # the entry is renamed) the block is empty and the per-graph
          # greps below would fail bare (exit 1, no annotation) or — worse
          # for future shape changes — pass on nothing. Fail loudly here.
          [ -n "$lock_block" ] || {
            echo "::error::no dart_tui entry found in pubspec.lock — the audit assertion is vacuous, aborting"
            exit 1
          }
          echo "$lock_block"
          case "$GRAPH" in
            hosted)
              if echo "$lock_block" | grep -q 'source: path'; then
                echo "::error::hosted graph resolved the vendored dart_tui fork"
                exit 1
              fi
              echo "$lock_block" | grep -q 'source: hosted'
              ;;
            vendored)
              echo "$lock_block" | grep -q 'source: path' || {
                echo "::error::vendored graph did not resolve dart_tui from vendor/dart_tui"
                exit 1
              }
              ;;
          esac
          echo "$GRAPH graph audit OK"

      # gh-1248 (review): the vendored fork has its own test suite, but no
      # root-level `dart test` ever discovers it — the fork's tests can rot
      # invisibly (that is exactly how the gh-1248 regression suite shipped
      # with a compile error). Run analyze + tests on the vendored leg,
      # where pubspec_overrides.yaml resolves the fork in-place.
      - name: Vendor fork tests (dart_tui)
        if: matrix.graph == 'vendored'
        run: |
          cd vendor/dart_tui
          dart pub get
          # Vendored third-party code: analyze keeps ERRORS fatal (the
          # gh-1248 compile rot this step exists to catch was error-level)
          # but pre-existing vendor warnings must not red unrelated PRs.
          # Plain `dart analyze` has no --no-fatal-infos (that flag is the
          # flutter tool's; infos are already non-fatal by default) — only
          # warnings need negating here. The test run below is the fatal gate.
          dart analyze --no-fatal-warnings
          dart test

  # SEC-07 (#795) AC4: run the installer against fixture releases
  # (good / tampered / unsigned) on EVERY PR — no path gating needed at
  # ~15s/job, and a security IT you can dodge with a cunning diff is not
  # an IT. macOS leg exercises the real quarantine-strip ordering (AC3).
  installer-verify:
    name: Installer verify IT (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: changes
    timeout-minutes: 10
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installer verification fixtures (AC1-AC4)
        run: bash scripts/installer_verify_selftest.sh

  # SEC-07 follow-up (#1015 incident): the release install.sh pins by default
  # must itself carry signed provenance — otherwise a fresh curl|sh refuses
  # the installer's own default with E_PIN_PROVENANCE_MISSING. Runs the pin
  # gate live (network to github.com releases, read-only) on EVERY PR — no
  # path gating, same reasoning as installer-verify. Fixture coverage of the
  # gate's failure modes lives in installer-verify (contract 5).
  install-pin-gate:
    name: Install pin provenance gate
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Pinned release must carry signed provenance
        run: bash scripts/check_install_pin.sh

  quality-gate:
    name: Quality gate
    runs-on: ubuntu-latest
    needs: [changes, static, flutter-analyze, test-core, coverage-gate, guards, flutter-tests, app-crap-gate, test-faui, perf-gate, usage-fold, cli-visual-settings, cube-kernel-live, build-web, build-android, build-ios, build-macos, integration-mock, hostile-env, fa-aot-build, pty-integration-linux, pty-coverage-gate, pty-visual, supply-chain, dep-audit, installer-verify, install-pin-gate, flutter-app-exzone]
    if: always()
    timeout-minutes: 5
    permissions:
      contents: read
    # #1368: the publish job consumes dart_ok — the pure-Dart package verdict
    # — instead of this aggregate's result. The aggregate itself stays the
    # single required check: any red leg (platform included) still fails it.
    outputs:
      dart_ok: ${{ steps.gate.outputs.dart_ok }}
    steps:
      - name: Report leg results
        run: |
          echo "static        = ${{ needs.static.result }}"
          echo "hostile-env   = ${{ needs.hostile-env.result }}"
          echo "test-core     = ${{ needs.test-core.result }}"
          echo "coverage-gate = ${{ needs.coverage-gate.result }}"
          echo "guards        = ${{ needs.guards.result }}"
          echo "flutter-analyze = ${{ needs.flutter-analyze.result }}"
          echo "flutter-tests = ${{ needs.flutter-tests.result }}"
          echo "test-faui     = ${{ needs.test-faui.result }}"
          echo "app-crap-gate = ${{ needs.app-crap-gate.result }}"
          echo "perf-gate     = ${{ needs.perf-gate.result }}"
          echo "usage-fold    = ${{ needs.usage-fold.result }}"
          echo "cube-live     = ${{ needs.cube-kernel-live.result }}"
          echo "cli-visual    = ${{ needs.cli-visual-settings.result }}"
          echo "build-web     = ${{ needs.build-web.result }}"
          echo "build-android = ${{ needs.build-android.result }}"
          echo "build-ios     = ${{ needs.build-ios.result }}"
          echo "build-macos   = ${{ needs.build-macos.result }}"
          echo "integ-mock    = ${{ needs.integration-mock.result }}"
          echo "hostile-env   = ${{ needs.hostile-env.result }}"
          echo "pty-integ-linux = ${{ needs.pty-integration-linux.result }}"
          echo "fa-aot-build  = ${{ needs.fa-aot-build.result }}"
          echo "pty-gates     = ${{ needs.pty-coverage-gate.result }}"
          echo "pty-visual    = ${{ needs.pty-visual.result }}"
          echo "supply-chain  = ${{ needs.supply-chain.result }}"
          echo "dep-audit     = ${{ needs.dep-audit.result }}"
          echo "installer-it = ${{ needs.installer-verify.result }}"
          echo "pin-gate    = ${{ needs.install-pin-gate.result }}"
          echo "exzone      = ${{ needs.flutter-app-exzone.result }}"
      - name: Fail on any real failure (skipped security = dodge = FAIL)
        id: gate
        env:
          R_CHANGES: ${{ needs.changes.result }}
          R_SUPPLY_CHAIN: ${{ needs.supply-chain.result }}
          R_DEP_AUDIT: ${{ needs.dep-audit.result }}
          R_STATIC: ${{ needs.static.result }}
          R_FLUTTER_ANALYZE: ${{ needs.flutter-analyze.result }}
          R_TEST_CORE: ${{ needs.test-core.result }}
          R_COVERAGE: ${{ needs.coverage-gate.result }}
          R_GUARDS: ${{ needs.guards.result }}
          R_FLUTTER: ${{ needs.flutter-tests.result }}
          R_CRAP: ${{ needs.app-crap-gate.result }}
          R_FAUI: ${{ needs.test-faui.result }}
          R_PERF: ${{ needs.perf-gate.result }}
          R_USAGE_FOLD: ${{ needs.usage-fold.result }}
          R_CUBE: ${{ needs.cube-kernel-live.result }}
          R_CLI_VISUAL: ${{ needs.cli-visual-settings.result }}
          R_BUILD_WEB: ${{ needs.build-web.result }}
          R_BUILD_ANDROID: ${{ needs.build-android.result }}
          R_BUILD_IOS: ${{ needs.build-ios.result }}
          R_BUILD_MACOS: ${{ needs.build-macos.result }}
          R_INTEG: ${{ needs.integration-mock.result }}
          R_HOSTILE: ${{ needs.hostile-env.result }}
          R_PTY_LINUX: ${{ needs.pty-integration-linux.result }}
          R_FA_AOT: ${{ needs.fa-aot-build.result }}
          R_PTY_GATES: ${{ needs.pty-coverage-gate.result }}
          R_PTY_VISUAL: ${{ needs.pty-visual.result }}
          R_INSTALLER_VERIFY: ${{ needs.installer-verify.result }}
          R_INSTALL_PIN_GATE: ${{ needs.install-pin-gate.result }}
          R_EXZONE: ${{ needs.flutter-app-exzone.result }}
        run: |
          fail() { echo "Quality gate FAILED: $1"; exit 1; }
          # Verdict pass collects blockers WITHOUT exiting, so dart_ok is
          # always exported explicitly ('true' or 'false', never '') —
          # publish and the Provider smoke read this output and an empty
          # value must never read as either (review thread on #1370).
          dart_blocker=""
          # The classifier itself must have run: a failed or skipped
          # classifier skips EVERY downstream leg and would wave a PR
          # through with zero gates executed.
          [ "$R_CHANGES" = "success" ] || dart_blocker="changes classifier = $R_CHANGES"
          # Security legs must EXECUTE and pass. For these, skipped is a
          # dodge (e.g. a cunning diff that makes the classifier misfire),
          # not a pass — review follow-up, #796/#801.
          if [ -z "$dart_blocker" ]; then
            [ "$R_SUPPLY_CHAIN" = "success" ] || dart_blocker="supply-chain = $R_SUPPLY_CHAIN (skipped security is a dodge)"
          fi
          if [ -z "$dart_blocker" ]; then
            [ "$R_DEP_AUDIT" = "success" ] || dart_blocker="dep-audit = $R_DEP_AUDIT (skipped security is a dodge)"
          fi
          # #1368 — two independent verdicts over the needs legs:
          #   PACKAGE legs (everything NOT platform) → dart_blocker: they
          #     gate dart_ok AND the aggregate — analyze/test/coverage must
          #     gate the publish (review thread: the case bodies were
          #     swapped in the first cut, re-enshrining the starvation);
          #   PLATFORM/NATIVE/PTY legs (build-web/android/ios/macos,
          #     fa-aot-build, installer-verify, install-pin-gate,
          #     cube-kernel-live, cli-visual-settings, pty-*) → platform_red
          #     only: they redden the required aggregate but NEVER dart_ok —
          #     a red Windows build must not hold the pure-Dart publish
          #     hostage (the v1.0.519-521 starvation).
          platform_red=false
          for kv in "static:$R_STATIC" "flutter-analyze:$R_FLUTTER_ANALYZE" "test-core:$R_TEST_CORE" "coverage-gate:$R_COVERAGE" \
                    "guards:$R_GUARDS" "flutter-tests:$R_FLUTTER" "app-crap-gate:$R_CRAP" \
                    "test-faui:$R_FAUI" "perf-gate:$R_PERF" "usage-fold:$R_USAGE_FOLD" "cube-kernel-live:$R_CUBE" \
                    "cli-visual-settings:$R_CLI_VISUAL" "build-web:$R_BUILD_WEB" \
                    "build-android:$R_BUILD_ANDROID" "build-ios:$R_BUILD_IOS" "build-macos:$R_BUILD_MACOS" \
                    "integration-mock:$R_INTEG" "hostile-env:$R_HOSTILE" \
                    "fa-aot-build:$R_FA_AOT" \
                    "pty-integration-linux:$R_PTY_LINUX" "pty-coverage-gate:$R_PTY_GATES" "pty-visual:$R_PTY_VISUAL" \
                    "installer-verify:$R_INSTALLER_VERIFY" "install-pin-gate:$R_INSTALL_PIN_GATE" \
                    "flutter-app-exzone:$R_EXZONE"; do
            name="${kv%%:*}"; r="${kv#*:}"
            case "$name" in
              build-web|build-android|build-ios|build-macos|fa-aot-build|installer-verify|install-pin-gate|cube-kernel-live|cli-visual-settings|pty-integration-linux|pty-coverage-gate|pty-visual)
                if [ "$r" != "success" ] && [ "$r" != "skipped" ]; then
                  platform_red=true
                fi
                ;;
              *)
                if [ "$r" != "success" ] && [ "$r" != "skipped" ] && [ -z "$dart_blocker" ]; then
                  dart_blocker="a leg is $r ($name)"
                fi
                ;;
            esac
          done
          if [ -n "$dart_blocker" ]; then dart_ok=false; else dart_ok=true; fi
          echo "dart_ok=$dart_ok" >> "$GITHUB_OUTPUT"
          # Aggregate verdicts AFTER the export — branch protection is
          # unchanged: ANY red leg (package or platform) still fails this
          # required check; only the PUBLISH gate ignores platform reds.
          [ -z "$dart_blocker" ] || fail "$dart_blocker"
          [ "$platform_red" = "false" ] || fail "a platform/native leg is red — the aggregate is red; dart_ok stays true (publish is not gated on platform legs, #1368), see the leg results above"
          echo "Quality gate OK"

  # Issue #303 (the #262 DoD): the perf-tagged e2e gate must red-block the
  # MERGE, not only the release — before #551 the only integration leg
  # outside PRs was tag-time, and perf stays excluded from integration-mock.
  # This leg runs the same
  # perf-tagged tests for trajectory-touching PRs and aggregates into
  # Quality gate below. `--tags perf` is precise: the only perf-tagged test
  # is the #262 gate (test/integration/trajectory/perf_open_gate_test.dart,
  # lands with #300), so the 97 MB fixture never runs for other PRs.
  perf-gate:
    name: Perf gate (trajectory)
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 20
    permissions:
      contents: read
    if: github.event_name == 'pull_request' && needs.changes.outputs.perf == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: dart test --tags perf
        run: dart test --tags perf

  # gh-1241 REG-1: the usage fold consumes the trajectory ledger's
  # `model_request_summary` records and the session chain's record shape —
  # a shape change there breaks the fold even when every regular leg is
  # green, so this suite is a merge gate for trajectory/session/usage
  # diffs. Gate model (2026-09 dispatch-only CI): this workflow has NO
  # pull_request trigger — the SM dispatches it on the PR head, so
  # `github.event_name` is never 'pull_request' and a PR-only `if` would
  # leave this leg permanently skipped (REG-1 gating nothing). On real PR
  # events the path classifier narrows it to usage-relevant diffs; on every
  # other event (main/tags/schedule/release + SM validation dispatches)
  # the full gate runs, so the suite runs there too. Same latent bug still
  # pending for perf-gate (issue #303) — flagged in the gh-1243 rework.
  usage-fold:
    name: Usage fold (ledger chain)
    runs-on: ubuntu-latest
    needs: changes
    timeout-minutes: 10
    permissions:
      contents: read
    if: >-
      github.event_name != 'pull_request' ||
      needs.changes.outputs.usagefold == 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Usage-fold suite
        # The path classifier also gates on ^lib/src/cli/agent_cli_usage_ledger\.dart$
        # — the CLI wiring test that exercises that file must run here too,
        # otherwise a wiring regression merges behind a green test/usage.
        run: dart test test/usage test/cli/agent_cli_usage_ledger_test.dart

  # Issue #194 (point 4): per-step duration telemetry. The jobs API already
  # records started/completed per step — dump it as a summary table plus a
  # raw artifact instead of instrumenting every step by hand.
  step-timings:
    name: Per-step timing telemetry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [changes, static, test-core, coverage-gate, guards, flutter-tests, app-crap-gate, test-faui, build-web, build-android, build-ios, build-macos]
    if: always()
    permissions:
      actions: read
    steps:
      - name: Collect per-step durations
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # The jobs endpoint intermittently answers 502 (live on the
          # gh-1086 rework head 81ed7186: a single 502 failed the whole
          # telemetry leg). Same 3-attempt pattern as build-mobile's
          # "Install Flutter dependencies" — transient API errors retry,
          # a real failure still reds the step loudly.
          for attempt in 1 2 3; do
            if gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" > /tmp/jobs.json; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::gh api jobs fetch failed after 3 attempts — GitHub API is erroring (502-class)"
              exit 1
            fi
            echo "::warning::gh api jobs fetch failed (attempt $attempt/3) — retrying in 10s"
            sleep 10
          done
          python3 - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import datetime, json
          jobs = json.load(open('/tmp/jobs.json'))['jobs']
          print('## Per-step durations\n')
          print('| job | step | duration | conclusion |')
          print('|---|---|---|---|')
          for j in jobs:
              for s in j.get('steps', []):
                  if not (s.get('started_at') and s.get('completed_at')):
                      continue
                  t0 = datetime.datetime.fromisoformat(s['started_at'].replace('Z', '+00:00'))
                  t1 = datetime.datetime.fromisoformat(s['completed_at'].replace('Z', '+00:00'))
                  print(f"| {j['name']} | {s['name']} | {int((t1 - t0).total_seconds())}s | {s['conclusion']} |")
          EOF
          cp /tmp/jobs.json step-timings.json

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: step-timings
          path: step-timings.json
          retention-days: 14

  # Issue #194 (point 4): >2x-baseline watchdog. The timeout-minutes above
  # are ≈2x the healthy job durations observed on main (shards 3-5 min,
  # flutter-tests ~6 min + fa_ui shards ~5 min since issue #283). A timeout means this run landed on a degraded
  # runner allocation; the remedy is a fresh EMPTY-COMMIT push — a new run
  # gets a fresh allocation and the push cancels this stale run via the PR
  # concurrency group. NEVER `gh run rerun`: it reallocates into the same
  # degraded pool. One retrigger max per head commit (loop guard below).
  watchdog:
    name: Watchdog (degraded-runner retrigger)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # pty-integration-linux/pty-visual ride along (review 2026-09-23, #963;
    # gh-1005 retired the mac shards): the longest legs. They must be in
    # `needs` or the watchdog fires before they settle — a degraded-runner
    # timeout there would land after the scan and never get its one-shot
    # empty-commit retrigger. Cost: the watchdog waits for them.
    needs: [changes, static, test-core, coverage-gate, guards, flutter-tests, test-faui, pty-integration-linux, pty-visual]
    # Same-repo PRs only: the empty-commit retrigger pushes to the PR branch,
    # which this token cannot do for a fork's ref.
    if: always() && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: read
      contents: write
    steps:
      - name: Detect a timeout-type failure
        id: trip
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          trip=false
          for id in $(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
              --jq '.jobs[] | select(.conclusion=="failure") | .id'); do
            # A job-level timeout cancels the running step: the job is
            # 'failure' but its LAST step is 'cancelled'. A real test
            # failure ends with a failed step.
            last=$(gh api "repos/$REPO/actions/jobs/$id" --jq '.steps[-1].conclusion // ""')
            echo "job $id last step: $last"
            if [ "$last" = "cancelled" ]; then trip=true; fi
          done
          echo "trip=$trip" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.trip.outputs.trip == 'true'
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          # GITHUB_TOKEN pushes never trigger workflows — the retrigger must
          # re-fire CI, so it rides RELEASE_PAT (same as release/gardener).
          token: ${{ secrets.RELEASE_PAT }}

      - name: Retrigger with an empty commit (fresh runner allocation)
        if: steps.trip.outputs.trip == 'true'
        env:
          HAS_PAT: ${{ secrets.RELEASE_PAT != '' }}
        run: |
          if [ "$HAS_PAT" != "true" ]; then
            echo "::notice::RELEASE_PAT not configured — cannot retrigger"
            exit 0
          fi
          msg="ci: watchdog retrigger (degraded runner pool)"
          if [ "$(git log -1 --format=%s)" = "$msg" ]; then
            echo "head commit is already a watchdog retrigger — not looping"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "$msg"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"
  integration:
    name: Provider smoke (LLM, tag-only)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 20
    permissions:
      contents: read
    # Same !cancelled() pattern as the release/binaries jobs (fa#456).
    # #1368: the gate check reads the dart_ok OUTPUT, not the aggregate
    # result — a platform-only red (Windows build, PTY leg) used to skip this
    # smoke transitively and with it the publish job (the v1.0.519-521
    # starvation). dart_ok=false (a red package leg) still skips it: the
    # publish it gates cannot run anyway.
    if: >-
      !cancelled() && needs.quality-gate.outputs.dart_ok != 'false' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      # Issue #551: the ONLY tag-only LLM job — a small provider smoke.
      # `--tags "integration && llm"` selects the real-provider files
      # (anthropic / google / openrouter / ollama round-trips; copilot,
      # chatgpt-codex and subagent-real-model self-skip without their
      # creds). The 50-file integration suite itself runs per-PR now
      # (integration-mock + nightly pty-integration): tag CI no longer
      # gates releases on it, publish waits on this smoke instead.
      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-
      - name: dart test --tags "integration && llm"
        run: dart test --tags "integration && llm"

  js-ext-integration:
    name: JS engine integration (quickjs-ng)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: Install quickjs-ng
        run: |
          curl -fsSL -o "$RUNNER_TEMP/qjs" \
            https://github.com/quickjs-ng/quickjs/releases/download/v0.16.2/qjs-linux-x86_64
          chmod +x "$RUNNER_TEMP/qjs"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: dart test --tags integration (qjs engine suites)
        run: dart test --tags integration test/cli/ext_engine_process_test.dart test/js_ext/integration/

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: [quality-gate, integration]
    # 20m ceiling: publish flow (~2-4m) + the post-upload verify window
    # (11m, #611) must both fit — 10m would kill a healthy poll mid-window.
    timeout-minutes: 20
    # !cancelled() + explicit gate check — the fa#456 class: GitHub propagates
    # "skipped" TRANSITIVELY through the always()-quality-gate's needs graph.
    #
    # #1368, two changes:
    # 1. PUSH-EVENT TAGS ONLY. pub.dev trusted publishing accepts OIDC tokens
    #    from push and workflow_dispatch events ONLY — there is no
    #    release-event option (owner verified the pub.dev console). The old
    #    release arm made the release-event twin of every tag ATTEMPT the
    #    publish whenever the push twin had not uploaded — pub.dev rejected
    #    the token's event claim and the leg died "Authentication failed!"
    #    (exit 65) on every release since the gate graph grew legs that can
    #    redden the push twin. The v0.1.370-402 era this arm once covered
    #    (API-created lightweight tags with no push event) is gone: every tag
    #    is PAT-pushed annotated (release-tag/auto_release), so the push twin
    #    always exists. A release-only tag would now skip publish and the
    #    daily verifyPubDev leg alarms «only release-event run(s)» loudly.
    # 2. The gate is dart_ok — the pure-Dart package verdict quality-gate
    #    exports — NOT the aggregate result. A red native binary/PTY leg must
    #    never hold a Dart package hostage (v1.0.520's push twin: publish
    #    skipped off a red pty-integration shard). The Provider smoke stays a
    #    hard gate (#551): needs.integration.result == 'success'.
    if: >-
      !cancelled() && needs.quality-gate.outputs.dart_ok == 'true' &&
      needs.integration.result == 'success' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    concurrency:
      # push + release events both fire for PAT-pushed tags; serialize the
      # double-fire so the loser no-ops on the already-published guard below
      # instead of racing dart pub publish (version already exists → red).
      # #1368: only the push twin can publish now — the group stays as a
      # belt-and-suspenders guard for re-pushed tags.
      group: publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      id-token: write # OIDC — pub.dev verifies the GitHub identity, no secrets
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # A tag is a release announcement: if pubspec says publish_to: none,
      # failing LOUDLY is correct (#554) — a green skip is how pub.dev went
      # 35 versions stale unnoticed. Removing the flag from pubspec re-enables.
      - id: gate
        name: Publish gate
        run: |
          if grep -Eq '^publish_to:[[:space:]]*none' pubspec.yaml; then
            echo "::error::pubspec.yaml sets publish_to: none — a tagged release cannot reach pub.dev. Remove the flag from pubspec.yaml, or stop tagging v* releases (see #554)."
            exit 1
          fi
          echo "publishable=true" >> "$GITHUB_OUTPUT"

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        if: steps.gate.outputs.publishable == 'true'
        with:
          sdk: stable

      - name: Verify tag matches pubspec version
        if: steps.gate.outputs.publishable == 'true'
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pubspec version $version"
            exit 1
          fi

      # setup-dart (sdk >= 3.13) provisions a publish-scoped credential for
      # the whole job: it exports PUB_TOKEN and registers
      # `dart pub token add https://pub.dev --env-var PUB_TOKEN`, so EVERY
      # pub.dev request — including `dart pub get` metadata reads — carries
      # the publish token. pub.dev rejects it on metadata reads
      # ("depends on ... which doesn't exist (authorization failed)",
      # exit 69; tag v0.1.340, run 34503923233). Resolution must run
      # unauthenticated: strip the credential, resolve, restore it only
      # for the publish step.
      - name: Strip publish credential for dependency resolution
        if: steps.gate.outputs.publishable == 'true'
        run: dart pub token remove https://pub.dev || true

      - run: dart pub get
        if: steps.gate.outputs.publishable == 'true'

      # The repo root hosts sub-projects that are NOT part of the pub
      # package (flutter_app with its 57 MB wasm toolchain, yoclip media,
      # browser_ext, office_addin, vendored forks, docs) — `dart publish`
      # packs everything under the root that isn't gitignored, which blew
      # the archive past pub.dev's hard 100 MB cap (v0.1.406: 100.4 MB,
      # "Content-length exceeds upper bound"). Publish from a staged copy
      # that carries only the package surface; the size guard makes any
      # future bloat a LOCI error instead of a pub.dev rejection.
      - name: Stage publishable package (sub-projects stay out)
        if: steps.gate.outputs.publishable == 'true'
        run: |
          bash scripts/stage_publish_package.sh /tmp/publish-stage
          (cd /tmp/publish-stage && dart pub get)

      - name: Publish (automated publishing via OIDC)
        if: steps.gate.outputs.publishable == 'true'
        run: |
          pkg=$(grep '^name:' pubspec.yaml | awk '{print $2}')
          ver="${GITHUB_REF_NAME#v}"
          served() { curl -fsSL "https://pub.dev/api/packages/$pkg" 2>/dev/null | jq -r '.latest.version' || true; }
          # The push-run and release-run twins of the same tag both land here
          # (serialized by the job concurrency group): the loser must see the
          # version already served and exit green, not fail on a re-upload.
          if [ "$(served)" = "$ver" ]; then
            echo "::notice::pub.dev already serves $pkg $ver — nothing to publish"
            exit 0
          fi
          dart pub token add https://pub.dev --env-var PUB_TOKEN || true
          (cd /tmp/publish-stage && dart pub publish --force)
          # Verify the upload actually landed (#554, #611): pub.dev CDN
          # propagation takes minutes (v0.1.411: upload accepted 05:00:39Z,
          # latest flipped 05:04Z — the old 5x3s poll sampled at ~16s, saw
          # the stale version, and hard-errored a healthy release). Poll
          # immediately (fast path when propagation is instant), then every
          # 30s for up to 11 min (server-quoted 10 min + margin) before
          # declaring a mismatch; a REAL failure after the full window
          # still fails loudly (#554's guard).
          ok=""
          deadline=$((SECONDS + 660))
          while :; do
            polled=$(served)
            echo "poll: pub.dev serves '$polled' (want $ver, t=${SECONDS}s)"
            if [ "$polled" = "$ver" ]; then ok=1; break; fi
            if [ "$SECONDS" -ge "$deadline" ]; then break; fi
            sleep 30
          done
          if [ -z "$ok" ]; then
            echo "::error::tag $GITHUB_REF_NAME processed but pub.dev still serves '$(served)' after 11 min of polling — publish did not upload. Manual publish needed (see #554)."
            exit 1
          fi
          echo "pub.dev verified: $pkg $ver"

  binaries:
    name: Build native binaries
    runs-on: ${{ matrix.runner }}
    needs: quality-gate
    timeout-minutes: 45
    # Tag pushes (annotated, via PAT) and `release: published` events both
    # build the matrix. Since v0.1.370 the daily-publish plan creates
    # releases through the API — a lightweight tag with NO push event —
    # which silently starved linux/windows CLI assets (they existed only
    # while tags were still PAT-pushed, up to v0.1.369). The release event
    # fires for every creation path, so the matrix can never be starved
    # again.
    # Same !cancelled() pattern as the release job: the transitive skip
    # through always()-quality-gate starved this matrix on tag pushes and
    # release events alike (fa#456) — no linux/windows CLI assets since
    # v0.1.370. The explicit gate check keeps failed-gate runs from
    # building publishable binaries.
    if: >-
      !cancelled() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'release')
    permissions:
      contents: write # attach assets to the GitHub Release
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
            archive: zip
          - runner: macos-latest
            os: macos
            arch: arm64
            archive: tar
          # Intel Mac runner (macos-13 is retired; AOT cannot cross-compile
          # macos_x64 from arm64 — only linux_* targets cross).
          - runner: macos-15-intel
            os: macos
            arch: x64
            archive: tar
          - runner: ubuntu-latest
            os: linux
            arch: x64
            archive: tar
          # Native ARM64 runner — dart build cli does not cross-compile.
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
            archive: tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Verify tag matches pubspec version
        # Explicit bash: the default shell on Windows runners is pwsh and
        # the POSIX test below dies there with a ParserError.
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          echo "tag=$tag pubspec=$version"
          if [ "$tag" != "$version" ]; then
            echo "Tag v$tag does not match pubspec version $version"
            exit 1
          fi

      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: Build CLI bundle
        shell: bash
        run: |
          version=$(grep '^version:' pubspec.yaml | awk '{print $2}')
          # dart build cli produces: <output>/bundle/{bin/fah, lib/*.dylib}
          # We rename the executable to `fa`, write version.txt, then archive
          # the whole bundle so the installer can extract bin/ + lib/ together.
          if [ "${{ matrix.os }}" = "windows" ]; then
            dart build cli --target=bin/fah.dart --output=build/out
            mv build/out/bundle/bin/fah.exe build/out/bundle/bin/fa.exe
          else
            dart build cli --target=bin/fah.dart --output=build/out
            mv build/out/bundle/bin/fah build/out/bundle/bin/fa
            chmod +x build/out/bundle/bin/fa
          fi
          echo "$version" > build/out/bundle/version.txt

      - name: Ad-hoc sign CLI binary (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: codesign --force --sign - build/out/bundle/bin/fa

      # gh-1280 NG2: «compiles» is not «works» — every release arch boots its
      # binary before the asset is archived/uploaded (same smoke as
      # binaries-pr). The usage marker (cli_help.dart "USAGE") discriminates
      # the real CLI help from a binary that merely prints something.
      - name: Smoke — the binary runs (fa --help)
        shell: bash
        run: |
          bin="build/out/bundle/bin/fa"
          [ "${{ matrix.os }}" = "windows" ] && bin="build/out/bundle/bin/fa.exe"
          out=$("$bin" --help)
          echo "$out"
          grep -qi "usage" <<<"$out" || { echo "fa --help did not print usage"; exit 1; }

      - name: Archive bundle
        shell: bash
        run: |
          archive_name="fa-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            asset="${archive_name}.zip"
            cd build/out && 7z a -tzip "../../$asset" bundle && cd -
          else
            asset="${archive_name}.tar.gz"
            tar -czf "$asset" -C build/out bundle
          fi
          ls -lh "$asset"

      - name: Upload archive to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          archive_name="fa-${{ matrix.os }}-${{ matrix.arch }}"
          if [ "${{ matrix.archive }}" = "zip" ]; then
            asset="${archive_name}.zip"
          else
            asset="${archive_name}.tar.gz"
          fi
          # gh release upload needs the release to exist; create it lazily
          # (matrix jobs race here, so a duplicate create is tolerated).
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes \
              --repo "${GITHUB_REPOSITORY}" || true
          fi
          gh release upload "${GITHUB_REF_NAME}" "$asset" --clobber --repo "${GITHUB_REPOSITORY}"

  # Rehostable web SPA bundle (issue #1100): every release ships
  # fa-web-spa.zip — the release web build with <base href> rewritten to
  # ./, so it rehosts on any static host (incl. path-prefixed) or sandboxed
  # iframe with zero edits (docs/web-rehosting.md). Same build command AND
  # base-href as the Pages deploy; scripts/package_web_spa.sh patches the
  # tag on a COPY and enforces the absolute-path guard (AC3) before zipping.
  # Lives here, not in pages.yml: release commits (pubspec/CHANGELOG bumps)
  # fall outside pages.yml's path filters, so a Pages-produced bundle could
  # never attach to the actual release commit.
  web-spa:
    name: Build web SPA bundle
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 30
    # Additive asset: a web-build failure (guard trip, SDK flake) must NOT
    # hold the release hostage — CLI provenance (SHA256SUMS) and the vpinned
    # bump still ship. Job-level continue-on-error reports the job (and its
    # check) as SUCCESS — the failed steps stay visible on the run page for
    # the manual check. Downstream needs see success; the provenance fa-*
    # sweep then deterministically finds no zip (success -> signed,
    # failure -> absent — never a half-updated manifest).
    continue-on-error: true
    if: >-
      !cancelled() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'release')
    permissions:
      contents: write # attach fa-web-spa.zip to the GitHub Release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned SDK as build-web / the release path (#281).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Example app pub get
        # gh-1265 AC2: resolve against the committed lockfile; a
        # pubspec/lockfile skew must fail the PR, not float.
        uses: ./.github/actions/flutter-pub-get

      # Same placeholders as the Pages job (both files are gitignored).
      - name: Placeholder .env for the example app
        run: touch flutter_app/.env

      - name: Placeholder firebase_options.dart for the example app
        run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      - name: Build web (release, Pages base)
        working-directory: flutter_app
        run: flutter build web --release --base-href /app/

      # Same AC3 cut as the Pages deploy (#1096): the vendored WASI
      # interpreter assets are mobile-only (loaded exclusively through
      # WasiSandboxShell under Android/iOS guards; the web sandbox boots
      # env_factory_stub -> MemoryShell -> CDN pyodide/quickjs), so zipping
      # them into fa-web-spa.zip would ship ~47 MB of dead weight.
      - name: Prune mobile-only wasm interpreter assets (#1096 AC3)
        run: rm -rf flutter_app/build/web/assets/assets/wasm

      - name: Package fa-web-spa.zip (relative base + AC3 guard)
        run: bash scripts/package_web_spa.sh flutter_app/build/web fa-web-spa.zip

      # AC1 (#1096): size manifest + +5% budget gate on the shipped SPA
      # zip. First run self-seeds web-spa.tsv (--init-if-missing) — the
      # step below uploads it for fetch+commit; committed floor afterwards.
      - name: Size manifest + budget gate (fa-web-spa.zip)
        run: |
          python3 scripts/size_manifest.py check fa-web-spa.zip \
            --baseline scripts/size_budget/web-spa.tsv --init-if-missing

      - name: Upload seeded size baselines (#1096 ratchet)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: size-baselines-web-spa
          path: scripts/size_budget/*.tsv
          if-no-files-found: ignore

      - name: Upload bundle to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # gh release upload needs the release to exist; create it lazily
          # (matrix jobs race here, so a duplicate create is tolerated).
          if ! gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${GITHUB_REF_NAME}" \
              --title "${GITHUB_REF_NAME}" --generate-notes \
              --repo "${GITHUB_REPOSITORY}" || true
          fi
          gh release upload "${GITHUB_REF_NAME}" fa-web-spa.zip --clobber --repo "${GITHUB_REPOSITORY}"

      # continue-on-error keeps the job/check green even on failure — a
      # release can then only be gated on a MISSING asset. Surface the miss
      # in the run's step summary too (covers upload flakes, not just guard
      # trips); the failed steps remain visible in the job view.
      - name: Flag missing bundle in step summary
        if: failure()
        run: |
          {
            echo '## fa-web-spa.zip NOT shipped this release'
            echo ''
            echo 'The web SPA bundle job failed (continue-on-error: the release ships without it). See the failed steps above.'
          } >> "$GITHUB_STEP_SUMMARY"

  # SEC-07 (#795): the installer's default trust path is SIGNED checksums.
  # This job aggregates every fa-* asset of the release into SHA256SUMS and
  # signs it with the FA_RELEASE_SIGNING_KEY repo secret (openssl RSA —
  # already available on runners, no new dependency). The signing key is a
  # channel separate from the release assets, so a checksum file served from
  # the same compromised source as the binary cannot vouch for itself.
  # Fail-closed: without the secret the release publishes NO provenance and
  # this job goes red — install.sh aborts with E_PROVENANCE_MISSING on it.
  # Needs web-spa (#1100, continue-on-error) for ordering only: the web
  # bundle cannot hold CLI provenance hostage. The ordering makes the fa-*
  # sweep deterministic — web-spa success -> zip signed, web-spa failure ->
  # zip absent — never a half-updated manifest.
  release-provenance:
    name: Sign release checksums
    runs-on: ubuntu-latest
    needs: [binaries, web-spa]
    timeout-minutes: 10
    if: >-
      !cancelled() && needs.binaries.result == 'success' &&
      ((github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'release')
    permissions:
      contents: write # upload SHA256SUMS(.sig) to the GitHub Release
    steps:
      # gh-814 r2: the trust-anchor drift gate below diffs the secret's public
      # key against the PEM embedded in site/install.sh — that file must be
      # present, so the signing job checks out the site/ tree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p provenance
          gh release download "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
            --dir provenance --pattern 'fa-*'
          ls -l provenance

      - name: Build and sign SHA256SUMS
        env:
          FA_RELEASE_SIGNING_KEY: ${{ secrets.FA_RELEASE_SIGNING_KEY }}
        run: |
          cd provenance
          sha256sum fa-* > SHA256SUMS
          if [ -z "$FA_RELEASE_SIGNING_KEY" ]; then
            echo "::error::FA_RELEASE_SIGNING_KEY is not set — refusing to publish a release without signed checksums (SEC-07 #795, fail-closed). Set the repo secret with the release-signing private key."
            exit 1
          fi
          printf '%s' "$FA_RELEASE_SIGNING_KEY" > "$RUNNER_TEMP/fa-release-signing.key"
          chmod 600 "$RUNNER_TEMP/fa-release-signing.key"
          # The key never outlives the step — trap covers mid-step failure.
          trap 'rm -f "$RUNNER_TEMP/fa-release-signing.key"' EXIT
          openssl dgst -sha256 -sign "$RUNNER_TEMP/fa-release-signing.key" -out SHA256SUMS.sig SHA256SUMS
          # Self-check: the signature must verify against OUR OWN public key
          # before anything is uploaded.
          openssl rsa -in "$RUNNER_TEMP/fa-release-signing.key" -pubout -out pub.pem 2>/dev/null
          openssl dgst -sha256 -verify pub.pem -signature SHA256SUMS.sig SHA256SUMS
          rm -f "$RUNNER_TEMP/fa-release-signing.key"
          # gh-814 r2 trust-anchor drift gate (fail-closed): the public key
          # derived from the secret must equal the PEM embedded in
          # site/install.sh — otherwise every pinned installer would ship an
          # anchor that rejects this release's signed checksums.
          sed -n '/BEGIN PUBLIC KEY/,/END PUBLIC KEY/p' "$GITHUB_WORKSPACE/site/install.sh" |
            sed "1s/^.*BEGIN/-----BEGIN/; \$s/END.*\$/END PUBLIC KEY-----/" > embedded-anchor.pem
          openssl pkey -pubin -in embedded-anchor.pem -noout ||
            { echo "::error::site/install.sh trust anchor does not parse as a public key — regenerate installers (dart run scripts/gen_installers.dart)"; exit 1; }
          cmp embedded-anchor.pem pub.pem ||
            { echo "::error::FA_RELEASE_SIGNING_KEY drifted from the trust anchor embedded in site/install.sh — rotate the keypair: update install.signing_public_key in site/install-config.yaml, regenerate installers, and update the repo secret TOGETHER. Refusing to sign (fail-closed)."; exit 1; }
          rm -f pub.pem embedded-anchor.pem

      - name: Upload provenance assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${GITHUB_REF_NAME}" \
            provenance/SHA256SUMS provenance/SHA256SUMS.sig \
            --clobber --repo "${GITHUB_REPOSITORY}"

  # Advance the vpinned release marker to the freshly signed tag. PURE
  # RELEASE-ARTIFACT MANIPULATION — no commits, no pushes: pin_release.sh
  # re-verifies the target's signature itself (fail-closed), then uploads
  # the PINNED_VERSION asset to the standing `vpinned` release. Runs after
  # release-provenance so the signed SHA256SUMS it checks are already
  # published. The marker is only a pointer — installers verify the pointed
  # release's signature against the committed trust anchor, so a tampered
  # marker degrades to a DoS, never a bad binary.
  install-pin-bump:
    name: Advance vpinned marker
    runs-on: ubuntu-latest
    needs: release-provenance
    timeout-minutes: 10
    # always(): when release-provenance FAILS (e.g. the binaries/signature
    # upload race), plain needs-gating leaves this job SKIPPED — and a
    # `rerun --failed` never resurrects skipped jobs, so the marker stays
    # stale forever (v1.0.483: publish+provenance flaked, the recovery rerun
    # went green, the marker never advanced). With always() the job RUNS
    # even after a failed provenance: pin_release.sh's own pre-move
    # provenance gate (check_install_pin.sh with FA_PIN_TARGET) fails the
    # job loudly instead of moving the marker — and a FAILED job IS part of
    # rerun --failed, so the recovery cascade reaches it.
    if: >-
      always() && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Point the vpinned marker at ${{ github.ref_name }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/pin_release.sh "${{ github.ref_name }}"

  installer-smoke:
    name: Installer smoke
    runs-on: ${{ matrix.os }}
    needs: [binaries, release-provenance]
    timeout-minutes: 15
    # Depends on binaries — no !cancelled() needed here: the skip chain is
    # already broken upstream by the binaries job's own guard (fa#456).
    if: >-
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) ||
      github.event_name == 'release'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            kind: ps1
          - os: ubuntu-latest
            kind: sh
          - os: macos-latest
            kind: sh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run the one-line installer (PowerShell)
        if: matrix.kind == 'ps1'
        shell: pwsh
        run: ./site/install.ps1

      - name: Run the one-line installer (sh)
        if: matrix.kind == 'sh'
        shell: bash
        env:
          FA_INSTALL_DIR: ${{ runner.temp }}/fa-bin
        run: sh ./site/install.sh

      - name: Smoke the installed binary (Windows)
        if: matrix.kind == 'ps1'
        shell: pwsh
        run: '& "$env:LOCALAPPDATA\Fa\bin\fa.exe" --version'

      - name: Smoke the installed binary (Unix)
        if: matrix.kind == 'sh'
        shell: bash
        run: |
          if [ -x "${{ runner.temp }}/fa-bin/fa" ]; then
            fa_path="${{ runner.temp }}/fa-bin/fa"
          else
            fa_path="$HOME/.local/bin/fa"
          fi
          # macOS downloads are quarantined by Gatekeeper; the installer strips
          # the attribute, but harden the smoke test in case it ever regresses.
          if [ "$(uname -s)" = "Darwin" ]; then
            xattr -dr com.apple.quarantine "$fa_path" 2>/dev/null || true
          fi
          "$fa_path" --version

  release:
    name: Auto-release (bump push)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 15
    # Every push to main gets a release with an auto-incremented patch version
    # (0.1.x -> 0.1.y), coalesced to <=1 per 2h — pub.dev rate-limits publishes
    # (~12/day; hit on 2026-07-18). Release commits are skipped (loop guard).
    # gh-1172: the bump pushes DIRECTLY to protected main authenticated as the
    # fa-release-bot GitHub App — the only bypass actor on the main ruleset
    # (the PR stopgap from 2026-09-29 is retired: it burned a full CI queue
    # cycle + machine review round on every chore bump). The App token is
    # minted job-locally; nothing else in the repo can read RELEASE_APP_*.
    # release-tag below cuts the tag from the pushed commit. Scheduled runs
    # catch up commits that outpaced the coalesce window.
    # !cancelled() + explicit gate check: GitHub propagates "skipped"
    # TRANSITIVELY through an always()-job's needs graph. quality-gate uses
    # if: always() and its needs include path-gated legs (perf-gate etc.)
    # that skip on ordinary pushes — without !cancelled() this job was
    # force-skipped on EVERY run since the perf gate landed (fa#456),
    # silently killing auto-release for a week. The explicit result check
    # keeps the gate red-line: no release on a failed quality gate.
    # workflow_dispatch reaches this job ONLY through an explicit input gate
    # (gh-1172 round-2 BLOCK): this is the repo's dispatch-only CI — the SM
    # runs `gh workflow run ci.yml --ref <pr-branch>` with no inputs, so a
    # bare dispatch arm would execute the dispatched (PR-head) ref's
    # auto_release.sh with the bypass App's push credentials. releaseDryRun
    # exercises the rollout switch (AC1 — any ref, never pushes);
    # releaseDispatch on refs/heads/main is the manual catch-up release.
    if: >-
      !cancelled() && needs.quality-gate.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main' && !startsWith(github.event.head_commit.message, 'chore(release):'))
      || github.event_name == 'schedule'
      || (github.event_name == 'workflow_dispatch' && inputs.releaseDryRun == true)
      || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.releaseDispatch == true))
    concurrency:
      group: release-main
      cancel-in-progress: false
    # Defense in depth (gh-1172 round-3 BLOCK): the push rides the checkout
    # App token EXCLUSIVELY, so this job's GITHUB_TOKEN never needs write —
    # on a dry-run dispatch of a PR head (AC1, any ref) that keeps the job's
    # own token read-only, leaving no write-capable credential in the run.
    permissions:
      contents: read
    steps:
      # Job-scoped App token (gh-1172 fix-contract item 1): minted per run,
      # expires with the job, never shared with other workflows.
      # NEVER minted on a dry-run dispatch: that arm fires on ANY ref, so the
      # bypass credential must not exist in a run that executes the (possibly
      # untrusted) dispatched ref's auto_release.sh — "dry-run never pushes"
      # may not depend on the script under test honoring the flag. The real
      # arms (push, schedule, releaseDispatch) see a non-true releaseDryRun
      # and mint as before.
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        if: inputs.releaseDryRun != true
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege (gh-1172 round-2 review): the App is the ruleset
          # bypass actor, so scope the token to what the push needs instead
          # of every permission the installation carries.
          permissions: contents:write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # gh-1477: blobless — the bump touches a handful of files; every
          # historical blob is dead transfer weight.
          filter: blob:none
          # App token (not GITHUB_TOKEN) so the pushed commit triggers the
          # follow-up ci.yml run whose release-tag job cuts the tag —
          # GITHUB_TOKEN pushes never trigger downstream workflow runs.
          # Dry-run dispatch: the mint above is skipped, its outputs are
          # empty (falsy) and checkout falls back to the plain GITHUB_TOKEN
          # (read-only per the job permissions block).
          token: ${{ steps.app-token.outputs.token || github.token }}

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'

      # gh-1299 NG1: the bump regenerates flutter_app/pubspec.lock in-commit
      # (the lockfile pins the parent path package version, so every bump
      # invalidates it) and refuses to ship while any inventory lockfile is
      # dirty — both need flutter on PATH. This job AUTHORS the lockfile for
      # every future release, so its SDK is pinned to the same 3.47.x the
      # consuming (--enforce-lockfile) build legs pin (PR #1304 rework
      # thread 8 — closes the author/consumer SDK drift class).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - name: Bump version, changelog, push to main
        env:
          RELEASE_DRY_RUN: ${{ github.event.inputs.releaseDryRun == 'true' && '1' || '0' }}
        run: bash scripts/auto_release.sh

  # Cuts the annotated tag + GitHub Release from the pushed 'chore(release):'
  # bump commit (see scripts/tag_release.sh). The bump lands via direct push
  # to protected main as the fa-release-bot App (gh-1172), so the tag phase
  # keys on that push. Tag push rides the App token (checkout token) —
  # GITHUB_TOKEN pushes never trigger the tag-scoped binaries/publish jobs.
  # Serialized with the bump push job via the release-main group: tag first,
  # next bump after.
  release-tag:
    name: Auto-release (tag on push)
    runs-on: ubuntu-latest
    needs: quality-gate
    timeout-minutes: 10
    if: >-
      !cancelled() && needs.quality-gate.result == 'success' &&
      github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      startsWith(github.event.head_commit.message, 'chore(release):')
    concurrency:
      group: release-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      # Same fa-release-bot App as the bump job (gh-1172): the tag push and
      # `gh release create` ride the App installation token — without an
      # explicit GH_TOKEN the create || true in tag_release.sh was a
      # guaranteed silent no-op and the curated CHANGELOG notes never reached
      # the release object (BLOCK finding on PR #1093, live review 2026-09-30).
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Least privilege (gh-1172 round-2 review): contents:write only —
          # the tag push + `gh release create` need nothing else.
          permissions: contents:write

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # gh-1477: blobless — tag math reads commit metadata only.
          filter: blob:none
          # App token so the pushed tag triggers the publish job —
          # GITHUB_TOKEN pushes never trigger downstream workflow runs.
          token: ${{ steps.app-token.outputs.token }}

      # gh-1299 NG2/AC3: the tag step smokes `flutter pub get --enforce-lockfile`
      # on the bump commit BEFORE tagging/publishing (a release commit that
      # cannot resolve its own lockfile is never tagged, never published) —
      # the gate needs flutter on PATH, pinned to the same 3.47.x the
      # consuming build legs use (PR #1304 rework thread 8).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      # gh-1310 rework (review thread 1): warm the pub cache with the shared
      # bounded-retry action so tag_release.sh's own enforce-lockfile smoke
      # rides it — the smoke stays in the script (release_hygiene NG2/AC3
      # pins it) but is no longer the job's first resolution, so one
      # transient git-dep clone reset cannot abort the pre-tag gate on a
      # cold cache (the v1.0.516 build-macos exit-69 class, on the release
      # path).
      - uses: ./.github/actions/flutter-pub-get

      - name: Cut annotated tag + GitHub Release
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          # gh-1192 AC3: pin the tag to the bump commit the push event
          # carried. head_commit.id is frozen at event time; a default
          # checkout can land on a main that moved in the seconds between the
          # bump push and this job starting (v1.0.498 captured the #1178
          # interloper that way). tag_release.sh validates the sha (exact
          # bump subject + matching pubspec version) before tagging and
          # refuses to tag a moving HEAD when nothing qualifies.
          BUMP_SHA: ${{ github.event.head_commit.id || github.sha }}
        run: bash scripts/tag_release.sh

  # PR-gate twin of the release `binaries` job: the CLI bundle must compile
  # on every supported platform and actually run (`fa --help`) BEFORE a PR
  # can merge — but only when the CLI surface could have changed (issue
  # #177: a docs/app PR must not pay for five platform builds).
  #
  # gh-1280: merge-blocking validations ride `workflow_dispatch` (Machine SM
  # dispatches this workflow on the PR head; the dispatched run registers its
  # check runs on the head SHA), while this gate fired only on `pull_request`
  # events. Every real validation run therefore skipped the matrix and the
  # required "Binaries smoke gate" context went green-by-skip — a broken arch
  # build (the v1.0.512 linux/arm64 class) could never block a merge. On a
  # dispatched run the classifier treats everything as affected (non-PR
  # filter arm), so the full matrix runs exactly when validation is due;
  # docs-only pull_request runs keep the #177 path skip.

  binaries-pr:
    name: Binaries (PR)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    needs: changes
    if: >-
      (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch') &&
      (needs.changes.outputs.core == 'true' || needs.changes.outputs.shared == 'true')
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            os: windows
            arch: x64
          - runner: macos-latest
            os: macos
            arch: arm64
          - runner: macos-15-intel
            os: macos
            arch: x64
          - runner: ubuntu-latest
            os: linux
            arch: x64
          - runner: ubuntu-24.04-arm
            os: linux
            arch: arm64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable

      - name: Pub cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: pub-${{ runner.os }}-

      - run: dart pub get

      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-

      - name: Build CLI bundle
        shell: bash
        run: |
          # Same bundle layout as the release job: bundle/bin/fa (+ lib/).
          dart build cli --target=bin/fah.dart --output=build/out
          if [ "${{ matrix.os }}" = "windows" ]; then
            mv build/out/bundle/bin/fah.exe build/out/bundle/bin/fa.exe
          else
            mv build/out/bundle/bin/fah build/out/bundle/bin/fa
            chmod +x build/out/bundle/bin/fa
          fi
          echo "$(grep '^version:' pubspec.yaml | awk '{print $2}')" > build/out/bundle/version.txt

      - name: Ad-hoc sign CLI binary (macOS)
        if: matrix.os == 'macos'
        shell: bash
        run: codesign --force --sign - build/out/bundle/bin/fa

      - name: Smoke — the binary runs (fa --help)
        shell: bash
        run: |
          bin="build/out/bundle/bin/fa"
          [ "${{ matrix.os }}" = "windows" ] && bin="build/out/bundle/bin/fa.exe"
          out=$("$bin" --help)
          echo "$out"
          [ -n "$out" ] || { echo "fa --help produced no output"; exit 1; }

  # Aggregation job so branch protection can require ONE stable context
  # ("Binaries smoke gate") instead of five matrix-leg names.
  binaries-smoke-gate:
    name: Binaries smoke gate
    needs: binaries-pr
    # gh-1280: same event fix as binaries-pr — on the SM validation
    # dispatches this aggregate must RUN (and carry a real conclusion),
    # never satisfy the required context by skipping.
    if: always() && (github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: All platforms built and smoked
        if: needs.binaries-pr.result == 'success' || needs.binaries-pr.result == 'skipped'
        run: echo "binaries-pr = ${{ needs.binaries-pr.result }}"
      - name: Fail the gate
        if: needs.binaries-pr.result != 'success' && needs.binaries-pr.result != 'skipped'
        run: |
          echo "binaries-pr result: ${{ needs.binaries-pr.result }}"
          exit 1

  # Every failing push/tag run must reach a human-facing tracker item the
  # moment it goes red (user ask 2026-09-17): PR failures are visible on
  # the PR itself, but main/tag reds used to live only in the Actions
  # tab. Files/updates one issue per red run, always assigned to
  # ai-teammate. quality-gate aggregates every leg (always()), so its
  # failure verdict covers the whole matrix — the fa#456 lesson on
  # transitive skips: this job keys on the aggregator's result directly.
  ci-red-report:
    name: CI red → issue (ai-teammate)
    needs: [quality-gate]
    if: ${{ always() && github.event_name == 'push' && needs.quality-gate.result == 'failure' }}
    permissions:
      issues: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - name: File or update the red-run issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          REF: ${{ github.ref_name }}
        run: |
          failed=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          title="[ci-red] $REF failed"
          url="https://github.com/$REPO/actions/runs/$RUN_ID"
          body="**Failed jobs:** ${failed:-unknown}
          **Run:** $url

          Auto-filed by the ci-red-report leg; assignee ai-teammate. Closes manually when the ref goes green."
          existing=$(gh issue list --repo "$REPO" --state open --label ci-red \
            --json number --jq ".[0].number // empty")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
            echo "commented on #$existing"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body" \
              --label bug --label ci-red --assignee ai-teammate
          fi
