name: Site mobile

# gh-756 — fa1.dev mobile-first gate. Red blocks merge (repo rule; add the
# `site-mobile` check to branch protection). Path-gated to the static site,
# its E2E script, and this workflow — PRs that don't touch them don't pay.
#
# Asserts in real headless Chromium (Playwright, pinned 1.49.1 — the same
# pin the Pages boot smoke uses):
#   AC1/AC4  documentElement.scrollWidth <= innerWidth on every inventory
#            page (index, privacy, app-store, widgets, 3x oauth) at
#            360x640 / 390x844 / 768x1024 / 641x800 / 1024x768 / 1280x800
#   AC2      header disclosure menu: tap/Esc/backdrop, aria-expanded,
#            all 10 links reachable, sticky bar height constant
#   AC3      every header anchor jump lands with the heading visible
#   AC5/REG  desktop 1280px full-page screenshots byte-compare against the
#            committed goldens (test/site/goldens/site-mobile/) — a red REG
#            blocks merge (REG-D1); re-bake intended changes with
#            `node scripts/site_mobile_check.mjs --update-goldens`
#   E2-E6    landscape fit, rotate auto-close, reduced-motion, no-JS degrade
# Serves site/ with a plain `python3 -m http.server` — the no-server static
# case. Viewport screenshots upload as an artifact for review/diffing.
#
# Golden rule: the REG goldens are only byte-valid for THIS pinned Playwright
# Chromium — never re-bake them via CHROMIUM_PATH/<system browser> (the
# script refuses that; system Chromium rasterizes the font stacks
# differently).
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site_mobile_check.mjs'
      - '.github/workflows/site-mobile.yml'
  pull_request:
    branches: [main]
    paths:
      - 'site/**'
      - 'scripts/site_mobile_check.mjs'
      - '.github/workflows/site-mobile.yml'
  workflow_dispatch:
    inputs:
      rebake-goldens:
        description: 'Re-bake REG goldens on this pinned Chromium and push to the dispatching branch (run the E2E after to verify)'
        type: boolean
        default: false

# Least privilege: this job only reads the checkout (CodeQL alert #38 —
# without this block GITHUB_TOKEN inherits the repo default, which here is
# read-write, while the job runs `npm i playwright` supply-chain code).
# The re-bake lane is the only writer and only when explicitly dispatched.
permissions:
  contents: read

jobs:
  site-mobile:
    name: Site mobile E2E
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Same install recipe as the Pages workflow's boot smoke (pinned).
      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright@1.49.1 >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      # ONE-SHOT (PR #2158): re-bake the REG goldens with this same pinned
      # Chromium before checking, so the bake and the check share one render
      # environment. The baked goldens upload as an artifact; the follow-up
      # commit lands them and removes this step.
      - name: Re-bake goldens (one-shot for #2158)
        run: node scripts/site_mobile_check.mjs --update-goldens

      - name: Upload re-baked goldens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-goldens-rebaked
          path: test/site/goldens/site-mobile/
          retention-days: 7
          if-no-files-found: ignore

      - name: Site mobile check
        env:
          SHOTS_DIR: site-mobile-shots
        run: node scripts/site_mobile_check.mjs

      - name: Upload viewport screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-mobile-screenshots
          path: site-mobile-shots/
          retention-days: 14
          if-no-files-found: ignore

  # Intended site changes re-bake the REG goldens with the SAME pinned
  # Playwright Chromium CI verifies against — byte-stable. A local bake on
  # any other OS produces rasterization-different goldens that can never
  # pass this check, so the re-bake runs here and pushes to the branch.
  re-bake-goldens:
    name: Re-bake REG goldens (pinned Chromium)
    if: inputs.rebake-goldens == true
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Playwright
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright@1.49.1 >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      - name: Re-bake goldens
        run: node scripts/site_mobile_check.mjs --update-goldens

      - name: Commit and push re-baked goldens
        run: |
          git add test/site/goldens/site-mobile
          if git diff --cached --quiet; then
            echo "Goldens unchanged — nothing to push."
            exit 0
          fi
          git -c user.name='Fa Agent' -c user.email='fa@fa1.dev' commit \
            -m "re-bake site mobile REG goldens (CI pinned Chromium)"
          git push
