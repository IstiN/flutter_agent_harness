name: Site goldens re-bake (one-shot)

# Throwaway helper for PR #2158: the REG desktop goldens are byte-valid only
# for the pinned Playwright Chromium (site-mobile.yml golden rule), so the
# re-bake must run on a runner, never locally. This dispatch bakes against
# the branch head, commits the goldens, and uploads the full golden set as
# an artifact. Delete after use.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebake:
    name: Re-bake site goldens
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      - name: Install Playwright (same pin as site-mobile.yml)
        run: |
          npm init -y >/dev/null
          npm i --no-fund --no-audit playwright@1.49.1 >/dev/null
          npx playwright install chromium --with-deps >/dev/null

      - name: Re-bake goldens
        run: node scripts/site_mobile_check.mjs --update-goldens

      - name: Commit goldens
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add test/site/goldens
          if git diff --cached --quiet; then
            echo "No golden changes — nothing to commit."
            exit 0
          fi
          git commit -m "chore(site): re-bake REG goldens for the windows download landing (one-shot)"
          git push

      - name: Upload baked goldens
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-goldens-rebaked
          path: test/site/goldens/site-mobile/
          retention-days: 14
          if-no-files-found: ignore
