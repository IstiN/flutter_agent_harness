# Nightly builds + integration-only (gh-1538): the SM pre-merge validation
# (ci.yml dispatched per PR head, #1537) is the single test gate — unit
# shards, analyze, coverage, CRAP/jscpd all run there on every change. This
# workflow keeps only what belongs to nightly by nature:
#   build-release — the release-mode build matrix (all store/desktop
#                   targets; PR legs build --debug only),
#   pty-integration — the integration-tagged suites deliberately excluded
#                   from the pre-commit/PR gates (slow, networked, flakier):
#                   PTY/CLI integration incl. the live `llm` provider suite
#                   with secrets, un-quarantined per gh-1199 (it caught the
#                   #1510 TUI wrap regression unit tests could not see).
# When a scheduled run goes red, the auto-issue job files (or updates) a
# single deduped `nightly-red` issue.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      # Issue #1267 AC3: the synthetic-red drill — dispatch the nightly
      # with a forced-failing leg and fileTracker=true; the filer must
      # file or comment the nightly-red tracker WITHIN that same run.
      # Manual dispatches without the flag stay tracker-silent (ad-hoc
      # red runs never spam the tracker; scheduled nights always file).
      fileTracker:
        description: 'File/comment the nightly-red tracker when this run is red (#1267 AC3 drill flag)'
        required: false
        type: boolean
        default: false

# SEC-08 (#796): minimal default — the nightly-red filing job grants
# issues: write (+ actions: read) in its own job-level block.
permissions:
  contents: read

jobs:

  # PTY/CLI integration (issue #177 follow-up, gh-1538): the ONLY remaining
  # test leg in nightly — integration-tagged suites are deliberately
  # excluded from the pre-commit/PR gates (slow, networked, flakier).
  # mock-endpoint tests need NO secrets and always run; live-provider tests
  # self-skip gracefully without keys (their own `skip:` guards), so the
  # blanket "no keys → skip everything" from the old CI job is gone.
  # ─────────────────────────────────────────────────────────────────────────
  # gh-1005 (2026-09-30): the fa-m5 runner-pick probe is GONE — the on-prem
  # M5 pool is ONE runner (fa-m5-1) reserved for genuinely macOS-only work
  # (cube-kernel-live, release macOS/iOS legs). The PTY/CLI integration leg
  # runs on hosted ubuntu-24.04-arm, mirroring the PR legs in ci.yml.
  # gh-1538: the coverage/duration RATCHETS live in the pre-merge gate now
  # (ci.yml pty-coverage-gate, stricter: ratchet-down + shard budgets +
  # auto-filing) — this leg runs the suites and keeps the json/junit
  # evidence artifacts, it does not re-enforce the thresholds nightly.
  pty-integration:
    name: PTY/CLI integration (nightly-only suites)
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dart-lang/setup-dart@6afc89df92d6eb3834022f73cd65adc8cdfcb92d # v1
        with:
          sdk: stable
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: dart pub get
      # gh-1300: compile the AOT bundle ONCE for the whole nightly leg and
      # point the FA_BIN seam at it — same shape as ci.yml's fa-aot-build
      # job (the nightly runs one unsharded job, so the build is in-job).
      - name: Native-assets hook cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .dart_tool/hooks_runner/shared
          key: hooks-shared-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: hooks-shared-${{ runner.os }}-${{ runner.arch }}-
      - name: dart build cli (AOT bundle, gh-1300)
        run: |
          dart build cli --target=bin/fah.dart --output=fa-local
          # gh-1522: the committed pubspec is the 0.0.0-dev placeholder —
          # stamp the bundle version from git describe (exact tag when
          # HEAD is tagged, distance+sha otherwise).
          version=$(git describe --tags --always --dirty 2>/dev/null || echo 0.0.0-dev)
          version="${version#v}"
          echo "$version" > fa-local/bundle/version.txt
          test -x fa-local/bundle/bin/fah
          ./fa-local/bundle/bin/fah --version
      - name: dart test --tags integration (excluding browser-ext — it owns browser-ext.yml)
        # gh-1199 AC5/AC6: this unsharded leg (with secrets) is the
        # SUPERVISED home of the live (`llm`) suite — and it deliberately
        # does NOT apply the flake quarantine: a quarantined file keeps
        # running here nightly, producing the repeat-run proof its fix PR
        # needs for un-quarantine.
        env:
          # gh-1300 FA_BIN seam: every CLI spawn runs the AOT binary
          # (~1 s) instead of the JIT VM+CFE compile (~30 s on ARM).
          FA_BIN: ${{ github.workspace }}/fa-local/bundle/bin/fah
        run: |
          mkdir -p test-results
          # Issue #1696: capture the raw exit code so the classification
          # step below can tell the runner-process SIGABRT class (134)
          # apart from ordinary test failures.
          set +e
          dart test --tags integration --exclude-tags browser-ext \
            --file-reporter="json:test-results/integration.json"
          code=$?
          set -e
          echo "$code" > test-results/exit-code
          exit "$code"
      # Issue #1696: the runner process itself can abort natively (glibc
      # heap detector, exit 134) with a fully green report — the leg goes
      # red without any test failure. Annotate that class in the step
      # summary so a recurrence self-identifies; the leg stays red and the
      # file-bot behavior is unchanged.
      - name: classify native abort (issue #1696)
        if: failure()
        run: >-
          python3 scripts/classify_native_abort.py
          test-results/exit-code
          test-results/integration.json >> "$GITHUB_STEP_SUMMARY"
      # Issue #928 review: the file-reporter writes the json even on a RED
      # leg — convert + upload must not be chained into the failing step.
      # The RAW dart json is the machine-parseable form the gate itself
      # consumes (one format, both sides): a budget-tightening PR downloads
      # `integration-json` and runs check_test_durations.py --update-baseline
      # on it; junit stays for the human/rebalancer view.
      - name: junit durations (budget-tightening evidence)
        if: always()
        run: >-
          python3 scripts/junit_from_dart_json.py
          test-results/integration.json
          test-results/junit-integration.xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-json
          path: test-results/integration.json
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: junit-integration
          path: test-results/junit-integration.xml
          retention-days: 14

  # Issue #280 AC3: nightly RELEASE-mode build matrix. The PR legs in
  # ci.yml build --debug (compile-truth); release-only concerns —
  # tree-shaking, R8/minify, dart2js optimisation, icon stripping — are
  # verified here, plus linux/windows bonus targets (the app does not ship
  # there officially yet, so they stay nightly-only per the card's
  # non-goals). A red leg feeds the deduped nightly-red issue via the
  # auto-issue job below.
  build-release:
    name: Build ${{ matrix.target }} (release)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-latest
            cmd: flutter build macos --release
          - target: ios
            runner: macos-latest
            cmd: flutter build ios --release --no-codesign
          - target: android
            runner: ubuntu-latest
            cmd: flutter build apk --flavor store --release
          - target: web
            runner: ubuntu-latest
            cmd: flutter build web --release
          - target: linux
            runner: ubuntu-latest
            cmd: flutter build linux --release
          - target: windows
            runner: windows-latest
            cmd: flutter build windows --release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same pinned SDK as the PR build legs and the release path (#281).
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        if: matrix.target == 'android'
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # gh-1468: pre-seed the flutter_gemma LiteRT-LM Android cache on the
      # android matrix row (no-op elsewhere) — same release-asset CDN
      # roulette as the PR leg, same fix.
      - uses: ./.github/actions/flutter-gemma-android-seed
        if: matrix.target == 'android'

      # gh-1655: same NDK pre-install as ci.yml build-android, on the
      # android matrix row only (no-op elsewhere) — Gradle configuration
      # auto-installs the Flutter-pinned NDK mid-build with no retry;
      # one truncated download reds the scheduled leg.
      - uses: ./.github/actions/android-ndk-preinstall
        if: matrix.target == 'android'

      # Linux desktop toolchain + plugin native deps (gtk3 for the runner,
      # gstreamer for audioplayers_linux).
      - name: Install Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Create placeholder .env asset
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - name: Create placeholder firebase_options.dart
        shell: bash
        run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      # bf81411e made Runner/GoogleService-Info.plist a hard build input
      # (Runner resources + Crashlytics dSYM-phase inputPaths); the real
      # file is gitignored and written from a release secret these legs
      # don't have — seed the same placeholder as the ci.yml PR legs.
      - name: Write placeholder GoogleService-Info.plist (Apple targets)
        if: matrix.target == 'ios' || matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="dev.fa1.${{ matrix.target }}"
          GOOGLE_APP_ID="1:000000000000:${{ matrix.target }}:0000000000000000000000"
          cat > "flutter_app/${{ matrix.target }}/Runner/GoogleService-Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>GOOGLE_APP_ID</key>
          	<string>$GOOGLE_APP_ID</string>
          	<key>API_KEY</key>
          	<string>AIzaSyA-PLACEHOLDER-KEY-FOR-DEBUG-BUILDS-000000</string>
          	<key>PROJECT_ID</key>
          	<string>fa1-placeholder</string>
          	<key>PROJECT_NUMBER</key>
          	<string>000000000000</string>
          	<key>BUNDLE_ID</key>
          	<string>$BUNDLE_ID</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_CRASHLYTICS_ENABLED</key>
          	<false/>
          </dict>
          </plist>
          EOF
          plutil -lint "flutter_app/${{ matrix.target }}/Runner/GoogleService-Info.plist"

      # The prebuilt WasmRun XCFramework is excluded from git; Apple builds
      # fail in the Podfile FFI-symbol check without it. Pinned upstream
      # release, same fallback as the ci.yml build legs.
      - name: Restore vendored WasmRun framework (Apple targets)
        if: matrix.target == 'ios' || matrix.target == 'macos'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEST="vendor/wasm_run_flutter/${{ matrix.target }}/Frameworks"
          rm -rf "$DEST/WasmRun.xcframework"
          mkdir -p "$DEST"
          curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o /tmp/WasmRun.xcframework.zip \
            https://github.com/juancastillo0/wasm_run/releases/download/wasm_run-v0.1.0/WasmRun.xcframework.zip
          unzip -q /tmp/WasmRun.xcframework.zip -d "$DEST"
          ls -la "$DEST/WasmRun.xcframework"

      # The macOS Podfile bundles the LiteRT-LM companion dylibs via a
      # Runner script phase that fails on a fresh runner ("Could not find
      # macOS companion dylibs") — seed from the pinned upstream native
      # release, sha256-verified (same incantation as build-macos.yml).
      - name: Ensure flutter_gemma macOS companion dylibs
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          GEMMA_CACHE="$HOME/Library/Caches/flutter_gemma/native/macos_arm64"
          if [ -f "$GEMMA_CACHE/libGemmaModelConstraintProvider.dylib" ]; then
            echo "companion dylibs already cached"
          else
            echo "seeding companion dylibs from flutter_gemma native-v0.16.0"
            mkdir -p "$GEMMA_CACHE"
            curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
              -o /tmp/litertlm-macos_arm64.tar.gz \
              https://github.com/DenisovAV/flutter_gemma/releases/download/native-v0.16.0/litertlm-macos_arm64.tar.gz
            echo "c597554a7a5cdf099658227099a54ef4916c5802b9182757e656e1788f9426b6  /tmp/litertlm-macos_arm64.tar.gz" | shasum -a 256 -c -
            tar xzf /tmp/litertlm-macos_arm64.tar.gz -C "$GEMMA_CACHE"
          fi
          ls -la "$GEMMA_CACHE"

      - name: Install Flutter dependencies
        uses: ./.github/actions/flutter-pub-get

      # gh-1296 NG1/NG3: the scheduled legs are the drift detector — the
      # pod-sync half of the lockfile gate runs nightly (upstream spec drift
      # or a native plugin landing without / behind its pod lock reds the
      # scheduled build and the auto-issue leg files nightly-red) instead of
      # being first discovered by a random PR. The inventory half
      # (missing/untracked/gitignored lockfiles) is enforced in ci.yml
      # Static gates, not here.
      - name: Lockfile gate (gh-1296 NG1/NG3)
        working-directory: flutter_app
        shell: bash
        run: bash "$GITHUB_WORKSPACE/scripts/check_lockfiles.sh" pod-sync

      # Issue #1851 AC4: wasm_sandbox_toolchain_test had NO gate at any
      # commit — it is integration-tagged inside flutter_app/test (so the
      # flutter-tests PR shards exclude it) and needs the native
      # libwasm_run_dart.dylib, which cannot be downloaded from inside a
      # running test (flutter_tester mocks sockets after binding init).
      # The nightly macOS row owns it: seed the dylib from the pinned
      # upstream wasm_run-v0.1.0 release, then run the suite. A red here
      # feeds the deduped nightly-red issue — silent absence is over.
      - name: Seed libwasm_run_dart.dylib (issue #1851 AC4)
        if: matrix.target == 'macos'
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .dart_tool/wasm_run temp
          curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o temp/macos.tar.gz \
            https://github.com/juancastillo0/wasm_run/releases/download/wasm_run-v0.1.0/macos.tar.gz
          tar xzf temp/macos.tar.gz -C temp
          cp temp/macos-arm64/libwasm_run_dart.dylib .dart_tool/wasm_run/

      - name: flutter test wasm_sandbox_toolchain (issue #1851 AC4)
        if: matrix.target == 'macos'
        working-directory: flutter_app
        shell: bash
        env:
          WASM_RUN_DART_DYNAMIC_LIBRARY: ${{ github.workspace }}/flutter_app/.dart_tool/wasm_run/libwasm_run_dart.dylib
        run: flutter test test/wasm_sandbox_toolchain_test.dart --tags integration

      - name: ${{ matrix.cmd }}
        working-directory: flutter_app
        shell: bash
        run: ${{ matrix.cmd }}

  # Files ONE deduped issue when the scheduled nightly run goes red: the
  # open `nightly-red` issue is searched first and only commented on, so a
  # persistent failure never spams duplicates. A GREEN scheduled run closes
  # the open issue (the nightly-red tracker is only as good as its sunset).
  #
  # Resurrection (issue #1267 N3): five consecutive red nights
  # (2026-10-01 → 10-05) filed NOTHING. Two defects, both fixed here —
  #  1. the dedup lookup read jq's literal "null" (an empty result of
  #     `.[0].number`) as a truthy issue number, so the no-open-tracker
  #     path died commenting issue "null" and never filed — every lookup
  #     now reads `.[0].number // empty` (both steps);
  #  2. the job was schedule-only, so the AC3 synthetic-red drill could
  #     not reach it — dispatch + fileTracker=true arms it too.
  # The decision (filed / commented / closed / why-not) lands in the job
  # output AND the step summary; two consecutive red scheduled nights add
  # the nightly-red-escalated label (streak counted from the completed
  # schedule-event runs preceding this one — dispatch runs never count).
  auto-issue:
    name: File nightly-red issue
    needs: [pty-integration, build-release]
    if: >-
      always() && !cancelled() &&
      (github.event_name == 'schedule' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.fileTracker == 'true'))
    runs-on: ubuntu-latest
    permissions:
      # issues: write — file/comment/close/label the deduped nightly-red
      # issue. actions: read — the filing leg lists this run's jobs via
      # `gh api repos/.../actions/runs/$RUN_ID/jobs` and the escalation
      # streak via `gh run list`; a job-level permissions block drops
      # every unlisted scope to none, so without this the calls 403
      # ("Resource not accessible by integration") and no issue is filed.
      issues: write
      actions: read
    steps:
      # AC3 decision-log visibility: the arm/disarm reason is in the job
      # output on EVERY run, red or green, filing or not.
      - name: Filer decision (why-not visibility, #1267 AC3)
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "filer armed: scheduled run — files/comments/closes the tracker"
          elif [ "${{ github.event.inputs.fileTracker }}" = "true" ]; then
            echo "filer armed: dispatch with fileTracker=true (AC3 synthetic-red drill)"
          else
            echo "filer decision: why-not — manual dispatch without fileTracker=true; pass it to exercise the tracker (AC3 drill)"
          fi

      - name: Close the nightly-red issue on a green run
        # Schedule-only: a manual (drill) dispatch is not a night — its
        # green must never close the live nightly tracker.
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          # `// empty` (issue #1267 N3): an empty result must read EMPTY —
          # jq's bare `.[0].number` prints the literal string "null",
          # which `[ -n ]` treats as a live issue number, so the close
          # died commenting issue "null" (the silent-death bug).
          existing=$(gh issue list --state open --label nightly-red \
            --json number --jq '.[0].number // empty' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$repo" \
              --body "Green again: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID} — closing."
            gh issue close "$existing" --repo "$repo"
            echo "decision: closed #$existing — nightly green again"
            echo "decision: closed #$existing — nightly green again" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "decision: why-not close — no open nightly-red tracker"
            echo "decision: why-not close — no open nightly-red tracker" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create or update the nightly-red issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date=$(date -u +%F)
          title="Nightly builds+integration red: ${date}"
          repo="${GITHUB_REPOSITORY}"
          gh label create nightly-red --force \
            --description "Nightly builds+integration run is failing" \
            --color B60205 --repo "$repo"
          gh label create nightly-red-escalated --force \
            --description "Nightly red 2+ consecutive scheduled nights (issue #1267 N3)" \
            --color D93F0B --repo "$repo"
          # Failing job names of this run, plus the run URL.
          failing=$(gh api \
            "repos/$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          [ -z "$failing" ] && failing="(unknown)"
          # N3 escalation: consecutive red SCHEDULED nights completed
          # BEFORE this run (this run's own red is the +1). The streak
          # stops at the first non-failure. Dispatch runs never count —
          # the label tracks real nights.
          streak=$(gh run list --repo "$repo" --workflow nightly.yml \
            --event schedule --status completed --limit 10 \
            --json conclusion,databaseId \
            --jq 'reduce .[] as $r ({s: 0, done: false};
                  if ($r.databaseId | tostring) == "'"$GITHUB_RUN_ID"'" or .done then .
                  elif $r.conclusion == "failure" then {s: (.s + 1), done: false}
                  else {s: .s, done: true} end) | .s')
          nights=$((streak + 1))
          echo "decision: red night ${nights} in a row (streak input: ${streak} completed failures)"
          body=$(printf 'Nightly builds+integration run is red.\n\nFailing jobs: %s\nRun: %s\nConsecutive red scheduled nights (incl. this one): %s\n' \
            "$failing" "${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}" "$nights")
          # Dedup: comment on the existing open nightly-red issue instead of
          # opening a duplicate. --repo everywhere: this job has no checkout,
          # bare `gh` invokes git for repo detection and dies with
          # "not a git repository" (the 2026-09-18 filing-leg failure).
          # `// empty` on the lookup — the literal-"null" bug above.
          existing=$(gh issue list --state open --label nightly-red \
            --json number --jq '.[0].number // empty' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" --repo "$repo"
            echo "decision: commented the open tracker #$existing (no duplicate filed)"
            echo "decision: commented the open tracker #$existing (no duplicate filed)" >> "$GITHUB_STEP_SUMMARY"
            target="$existing"
          else
            target=$(gh issue create --title "$title" --label nightly-red \
              --body "$body" --assignee ai-teammate --repo "$repo")
            echo "decision: filed $target"
            echo "decision: filed $target" >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ "$streak" -ge 1 ]; then
            gh issue edit "$target" --add-label nightly-red-escalated --repo "$repo"
            echo "decision: escalated $target — $nights consecutive red scheduled nights"
            echo "decision: escalated $target — $nights consecutive red scheduled nights" >> "$GITHUB_STEP_SUMMARY"
          fi
