# Nightly full-matrix quality run (issue #177, Wave 3 / AC6): the PR-level
# ci.yml was slimmed down for speed, so this workflow preserves the original
# monolith semantics — every gate, full thresholds — on a nightly schedule.
# When a scheduled run goes red, the auto-issue job files (or updates) a
# single deduped `nightly-red` issue.
name: Nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

jobs:
  full-quality:
    name: Full quality gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - uses: subosito/flutter-action@v2
        with:
          channel: stable

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - run: dart pub get

      # Publish gate at PR time: publish-blocking problems (undeclared lib/
      # imports, stray PEM-like strings) used to surface only in the tag-time
      # publish job — the v0.1.331 era: an undeclared package:cryptography
      # import shipped red on ~26 consecutive tags. --ignore-warnings: the
      # two known layout warnings (gitignored install_local.sh, docs/
      # naming) must not redden every PR, while validation ERRORS — "does
      # not have X in the dependencies section of pubspec.yaml" — still
      # fail. setup-dart (sdk >= 3.13) registers a publish-scoped PUB_TOKEN
      # job-wide and pub.dev rejects authenticated metadata reads, so
      # resolve unauthenticated (same pattern as the publish job);
      # --dry-run never uploads.
      - name: Publish dry-run (unauthenticated)
        run: |
          dart pub token remove https://pub.dev || true
          dart pub publish --dry-run --ignore-warnings

      # The example Flutter app lives in this repo; without its package
      # config the repo-wide `dart analyze` cannot resolve Flutter imports.
      - name: Example app pub get (for repo-wide analyze)
        run: cd flutter_app && flutter pub get

      # The repo-wide `dart analyze` also walks office_addin/dart; without
      # its package config the analyzer cannot resolve
      # `package:fa_office_agent/...` imports (nightly full-quality was red
      # on email_quarantine_test.dart since the add-in landed). ci.yml's
      # analyze job already does this — nightly must match.
      - name: Office add-in pub get (for repo-wide analyze)
        run: dart pub get --directory=office_addin/dart

      # .env is gitignored but declared as a Flutter asset (flutter_dotenv);
      # without it the analyzer fails with asset_does_not_exist (a fresh
      # clone hits the same warning locally).
      - name: Create placeholder .env for the example app
        run: touch flutter_app/.env

      # firebase_options.dart is gitignored (real keys stay local); the
      # repo-wide analyze fails on the unresolved import without it. The
      # tracked placeholder makes it compile (Firebase init is skipped for
      # YOUR_* values at runtime).
      - name: Create placeholder firebase_options.dart for the example app
        run: >-
          cp flutter_app/firebase_options.template.dart
          flutter_app/lib/firebase_options.dart

      - name: File size guard (no dart file over 2800 lines)
        run: |
          violations=$(find lib test example -name '*.dart' \
            ! -name '*.g.dart' ! -name '*.freezed.dart' ! -name '*.mocks.dart' \
            -exec sh -c 'lines=$(wc -l < "$1"); if [ "$lines" -gt 2800 ]; then echo "$1: $lines lines"; fi' _ {} \;)
          if [ -n "$violations" ]; then echo "$violations"; exit 1; fi

      - name: dart analyze
        run: dart analyze

      - name: dart test --coverage (excluding integration)
        run: dart test --coverage=coverage --exclude-tags integration

      - name: Format coverage to lcov
        run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info

      - name: Coverage ratchet (lib/ >= 80%)
        run: python3 scripts/check_coverage.py 80

      - name: CRAP ratchet (threshold pinned in crap4dart.yaml)
        run: |
          dart pub global activate crap4dart 0.2.1
          dart pub global run crap4dart analyze

      - name: Duplication guard (lib/ < 1%)
        run: |
          npx --yes jscpd@5 --min-tokens 50 --min-lines 5 --reporters json \
            --output /tmp/jscpd-ci lib/ || true
          python3 - <<'EOF'
          import json, sys
          try:
              with open('/tmp/jscpd-ci/jscpd-report.json') as f:
                  pct = json.load(f)['statistics']['total']['percentage']
          except Exception:
              pct = 0.0
          print(f'Duplication: {pct}% (threshold < 1.0%)')
          sys.exit(0 if float(pct) < 1.0 else 1)
          EOF

  # PTY/terminal integration suites (issue #177 follow-up): mock-endpoint
  # tests need NO secrets and always run; live-provider tests self-skip
  # gracefully without keys (their own `skip:` guards), so the blanket
  # "no keys → skip everything" from the old CI job is gone. Coverage over
  # lib/src/cli/** feeds the only-up ratchet (coverage-gardener.yml bumps
  # the baseline weekly) — terminal-test coverage can never silently drop.
  pty-integration:
    name: PTY/CLI integration + cli coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      OLLAMA_API_KEY: ${{ secrets.OLLAMA_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: dart pub get
      - name: dart test --tags integration (excluding browser-ext — it owns browser-ext.yml)
        run: >-
          dart test --tags integration --exclude-tags browser-ext
          --coverage=coverage
      - name: Format coverage to lcov
        run: dart run coverage:format_coverage --lcov -i coverage -o coverage/lcov.info
      - name: CLI coverage ratchet (lib/src/cli/**, baseline only up)
        run: python3 scripts/check_cli_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: cli-coverage-lcov
          path: coverage/lcov.info
          retention-days: 14

  # Terminal-visual suite: the real CLI in a PTY screenshotted through the
  # Flutter TerminalView. Never ran in CI before issue #177 (manual only) —
  # it needs no LLM (local test-provider configs) but does need a real
  # display stack, so it gets the macOS runner. Screenshots land as an
  # artifact for eyeballing.
  cli-visual:
    name: Terminal visual (PTY screenshots)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      # cli-visual runs `flutter test` inside flutter_app — the asset is
      # declared in flutter_app/pubspec.yaml, so the placeholder must land
      # at flutter_app/.env, not the repo root. (This line previously
      # carried a corrupted literal redaction marker as the path: the
      # touch created junk files and the asset bundle failed with
      # "No file or variants found for asset: .env".)
      - run: touch flutter_app/.env
      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart
      - run: cd flutter_app && flutter pub get
      - name: flutter test test/cli_visual --tags integration
        run: cd flutter_app && flutter test test/cli_visual --tags integration
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cli-visual-screenshots
          path: test/integration/screenshots/
          retention-days: 7


  # Full flutter_app suite on macOS (issue #177): the ubuntu PR leg excludes
  # native-dependent tests (scripts/flutter_test_ubuntu_exclude.txt —
  # quickjs_c_bridge .so, mic channel) and goldens (host-locked). This leg
  # runs EVERYTHING non-golden on macOS, where the native stack builds —
  # closing the signal gap the ubuntu exclusions create.
  flutter-app-macos:
    name: flutter_app suite (macOS, non-golden)
    runs-on: macos-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Create placeholder .env asset
        working-directory: flutter_app
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF
      - run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart
      - run: cd flutter_app && flutter pub get
      - name: flutter test (all except integration + goldens)
        run: |
          cd flutter_app
          files=$(find test -name '*_test.dart' ! -path '*/golden/*' ! -path '*/cli_visual/*')
          flutter test --exclude-tags integration $files

  # Issue #280 AC3: nightly RELEASE-mode build matrix. The PR legs in
  # ci.yml build --debug (compile-truth); release-only concerns —
  # tree-shaking, R8/minify, dart2js optimisation, icon stripping — are
  # verified here, plus linux/windows bonus targets (the app does not ship
  # there officially yet, so they stay nightly-only per the card's
  # non-goals). A red leg feeds the deduped nightly-red issue via the
  # auto-issue job below.
  build-release:
    name: Build ${{ matrix.target }} (release)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            runner: macos-latest
            cmd: flutter build macos --release
          - target: ios
            runner: macos-latest
            cmd: flutter build ios --release --no-codesign
          - target: android
            runner: ubuntu-latest
            cmd: flutter build apk --flavor store --release
          - target: web
            runner: ubuntu-latest
            cmd: flutter build web --release
          - target: linux
            runner: ubuntu-latest
            cmd: flutter build linux --release
          - target: windows
            runner: windows-latest
            cmd: flutter build windows --release
    steps:
      - uses: actions/checkout@v4

      # Same pinned SDK as the PR build legs and the release path (#281).
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.x'
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        if: matrix.target == 'android'
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      # Linux desktop toolchain + plugin native deps (gtk3 for the runner,
      # gstreamer for audioplayers_linux).
      - name: Install Linux desktop toolchain
        if: matrix.target == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Create placeholder .env asset
        working-directory: flutter_app
        shell: bash
        run: |
          set -euo pipefail
          cat > .env << 'EOF'
          OPENROUTER_API_KEY=
          MODEL_ID=
          BASE_URL=
          HUGGINGFACE_TOKEN=
          EOF

      - name: Create placeholder firebase_options.dart
        shell: bash
        run: cp flutter_app/firebase_options.template.dart flutter_app/lib/firebase_options.dart

      # bf81411e made Runner/GoogleService-Info.plist a hard build input
      # (Runner resources + Crashlytics dSYM-phase inputPaths); the real
      # file is gitignored and written from a release secret these legs
      # don't have — seed the same placeholder as the ci.yml PR legs.
      - name: Write placeholder GoogleService-Info.plist (Apple targets)
        if: matrix.target == 'ios' || matrix.target == 'macos'
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ID="dev.fa1.${{ matrix.target }}"
          GOOGLE_APP_ID="1:000000000000:${{ matrix.target }}:0000000000000000000000"
          cat > "flutter_app/${{ matrix.target }}/Runner/GoogleService-Info.plist" << EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>GOOGLE_APP_ID</key>
          	<string>$GOOGLE_APP_ID</string>
          	<key>API_KEY</key>
          	<string>AIzaSyA-PLACEHOLDER-KEY-FOR-DEBUG-BUILDS-000000</string>
          	<key>PROJECT_ID</key>
          	<string>fa1-placeholder</string>
          	<key>PROJECT_NUMBER</key>
          	<string>000000000000</string>
          	<key>BUNDLE_ID</key>
          	<string>$BUNDLE_ID</string>
          	<key>GCM_SENDER_ID</key>
          	<string>000000000000</string>
          	<key>IS_ANALYTICS_ENABLED</key>
          	<false/>
          	<key>IS_CRASHLYTICS_ENABLED</key>
          	<false/>
          </dict>
          </plist>
          EOF
          plutil -lint "flutter_app/${{ matrix.target }}/Runner/GoogleService-Info.plist"

      # The prebuilt WasmRun XCFramework is excluded from git; Apple builds
      # fail in the Podfile FFI-symbol check without it. Pinned upstream
      # release, same fallback as the ci.yml build legs.
      - name: Restore vendored WasmRun framework (Apple targets)
        if: matrix.target == 'ios' || matrix.target == 'macos'
        timeout-minutes: 15
        run: |
          set -euo pipefail
          DEST="vendor/wasm_run_flutter/${{ matrix.target }}/Frameworks"
          rm -rf "$DEST/WasmRun.xcframework"
          mkdir -p "$DEST"
          curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
            -o /tmp/WasmRun.xcframework.zip \
            https://github.com/juancastillo0/wasm_run/releases/download/wasm_run-v0.1.0/WasmRun.xcframework.zip
          unzip -q /tmp/WasmRun.xcframework.zip -d "$DEST"
          ls -la "$DEST/WasmRun.xcframework"

      # The macOS Podfile bundles the LiteRT-LM companion dylibs via a
      # Runner script phase that fails on a fresh runner ("Could not find
      # macOS companion dylibs") — seed from the pinned upstream native
      # release, sha256-verified (same incantation as build-macos.yml).
      - name: Ensure flutter_gemma macOS companion dylibs
        if: matrix.target == 'macos'
        run: |
          set -euo pipefail
          GEMMA_CACHE="$HOME/Library/Caches/flutter_gemma/native/macos_arm64"
          if [ -f "$GEMMA_CACHE/libGemmaModelConstraintProvider.dylib" ]; then
            echo "companion dylibs already cached"
          else
            echo "seeding companion dylibs from flutter_gemma native-v0.16.0"
            mkdir -p "$GEMMA_CACHE"
            curl -L --retry 3 --retry-all-errors --retry-delay 10 --max-time 600 \
              -o /tmp/litertlm-macos_arm64.tar.gz \
              https://github.com/DenisovAV/flutter_gemma/releases/download/native-v0.16.0/litertlm-macos_arm64.tar.gz
            echo "c597554a7a5cdf099658227099a54ef4916c5802b9182757e656e1788f9426b6  /tmp/litertlm-macos_arm64.tar.gz" | shasum -a 256 -c -
            tar xzf /tmp/litertlm-macos_arm64.tar.gz -C "$GEMMA_CACHE"
          fi
          ls -la "$GEMMA_CACHE"

      - name: Install Flutter dependencies
        working-directory: flutter_app
        shell: bash
        run: flutter pub get

      - name: ${{ matrix.cmd }}
        working-directory: flutter_app
        shell: bash
        run: ${{ matrix.cmd }}

  # Files ONE deduped issue when the scheduled nightly run goes red: the
  # open `nightly-red` issue is searched first and only commented on, so a
  # persistent failure never spams duplicates. A GREEN scheduled run closes
  # the open issue (the nightly-red tracker is only as good as its sunset).
  auto-issue:
    name: File nightly-red issue
    needs: [full-quality, pty-integration, cli-visual, flutter-app-macos, build-release]
    if: always() && github.event_name == 'schedule' && !cancelled()
    runs-on: ubuntu-latest
    permissions:
      # issues: write — file/comment/close the deduped nightly-red issue.
      # actions: read — the filing leg lists this run's jobs via `gh api
      # repos/.../actions/runs/$RUN_ID/jobs`; a job-level permissions block
      # drops every unlisted scope to none, so without this the call 403s
      # ("Resource not accessible by integration") and no issue is filed.
      issues: write
      actions: read
    steps:
      - name: Close the nightly-red issue on a green run
        if: success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo="${GITHUB_REPOSITORY}"
          existing=$(gh issue list --state open --label nightly-red \
            --json number --jq '.[0].number' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$repo" \
              --body "Green again: ${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID} — closing."
            gh issue close "$existing" --repo "$repo"
          fi

      - name: Create or update the nightly-red issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          date=$(date -u +%F)
          title="Nightly full-matrix red: ${date}"
          repo="${GITHUB_REPOSITORY}"
          gh label create nightly-red --force \
            --description "Nightly full-quality run is failing" \
            --color B60205 --repo "$repo"
          # Failing job names of this run, plus the run URL.
          failing=$(gh api \
            "repos/$repo/actions/runs/$GITHUB_RUN_ID/jobs?per_page=100" \
            --jq '[.jobs[] | select(.conclusion == "failure") | .name] | join(", ")')
          [ -z "$failing" ] && failing="(unknown)"
          body=$(printf 'Nightly full-matrix run is red.\n\nFailing jobs: %s\nRun: %s\n' \
            "$failing" "${GITHUB_SERVER_URL}/${repo}/actions/runs/${GITHUB_RUN_ID}")
          # Dedup: comment on the existing open nightly-red issue instead of
          # opening a duplicate. --repo everywhere: this job has no checkout,
          # bare `gh` invokes git for repo detection and dies with
          # "not a git repository" (the 2026-09-18 filing-leg failure).
          existing=$(gh issue list --state open --label nightly-red \
            --json number --jq '.[0].number' --repo "$repo")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body" --repo "$repo"
          else
            gh issue create --title "$title" --label nightly-red --body "$body" --assignee ai-teammate --repo "$repo"
          fi
