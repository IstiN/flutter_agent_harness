# Merge Trigger — PORTABLE TEMPLATE (machine-kit).
#
# Placeholder tokens (rendered by machine-kit/setup.sh):
#   CI   — the workflow whose green run arms the trigger
#                              (e.g. "Quality" in dmtools-dart, "CI" elsewhere)
#   epam/dmtools-dart — GitHub repo whose latest release ships the
#                              dmtools CLI install.sh (default: epam/dmtools-dart)
#
# When CI passes on any branch, run the dmtools-agents sm_merge JSRunner job —
# it applies JQL rules to find tickets labeled `pr_approved` and launches
# their merge configs (agents/retry_merge.json → js/retryMergePR.js). This is
# the auto-merge half of the dark-factory merge loop
# (auto-update-prs.yml is the actualization half).
#
# FUSED OFF via the MERGE_TRIGGER_ENABLED repo variable
# (Settings → Secrets and variables → Actions → Variables): the job skips
# itself until the variable is `true`. Fuse ON is safe only when
# branch protection is active AND required checks are green on main.
#
# Required repo config:
#   secrets: JIRA_EMAIL/JIRA_API_TOKEN/JIRA_BASE_PATH (Jira polling),
#            SOURCE_GITHUB_TOKEN (scm.js PR operations)
#   vars:    MERGE_TRIGGER_ENABLED
#   submodule: agents/ (IstiN/dmtools-agents, pinned)

name: Merge Trigger

run-name: 'Merge Trigger : CI passed → retry pr_approved merges'

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pull-requests: read
  actions: read

jobs:
  merge-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same-repo guard: PRs from forks must not trigger merges.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    concurrency:
      group: merge-trigger-${{ github.event.workflow_run.head_branch }}-${{ github.event.workflow_run.head_sha }}
      cancel-in-progress: false
    steps:
      - name: Gate on MERGE_TRIGGER_ENABLED
        id: gate
        env:
          ENABLED: ${{ vars.MERGE_TRIGGER_ENABLED }}
        run: |
          if [ "$ENABLED" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::merge-trigger scaffold is wired but disabled — set the MERGE_TRIGGER_ENABLED repo variable to true (after branch protection + required checks are in place)."
          fi

      - name: Checkout repository
        if: steps.gate.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          submodules: true # agents/ (sm_merge.json + JS actions)

      - name: Install DMTools CLI from latest release
        if: steps.gate.outputs.enabled == 'true'
        run: |
          curl -fsSL \
            "https://github.com/epam/dmtools-dart/releases/latest/download/install.sh" \
            | sh
          echo "$HOME/.dmtools/bin" >> "$GITHUB_PATH"

      - name: Configure Git Author
        if: steps.gate.outputs.enabled == 'true'
        run: |
          git config --global user.name "dm.ai"
          git config --global user.email "dm.ai@epam.com"

      - name: Run Merge Trigger
        if: steps.gate.outputs.enabled == 'true'
        env:
          CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
          # Tracker + SCM secrets (same names as the reference repo)
          JIRA_EMAIL: ${{ vars.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          JIRA_BASE_PATH: ${{ vars.JIRA_BASE_PATH }}
          SOURCE_GITHUB_TOKEN: ${{ secrets.SOURCE_GITHUB_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          DMTOOLS_INTEGRATIONS: jira,github,file
        run: |
          dmtools run agents/sm_merge.json --ciRunUrl "${CI_RUN_URL}"
