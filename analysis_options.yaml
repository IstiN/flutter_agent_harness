include: package:lints/recommended.yaml

analyzer:
  exclude:
    - build/**
    - .dart_tool/**
    - example/build/**
    - vendor/**
    # Self-hosted CI runner checkout (untracked junk on dev machines) —
    # its copies of lib/ duplicate types and break analyze.
    - actions-runner/**
    # DAP hub client's own suite, vendored VERBATIM from the upstream
    # package (checksum-pinned against its MANIFEST.txt) — lint drift there
    # belongs upstream, not here.
    - test/hub/**
    - example/**/vendor/**
    # Standalone video-production workspace (own pubspec/analysis_options) —
    # not part of the harness packages, gated by its own toolchain.
    - yoclip/**
    # Reusable Flutter package with its own analysis_options.
    - packages/**
    # Standalone Flutter app (own pubspec/analysis_options) — gated by
    # `flutter analyze` in its own toolchain, not the harness dart gate.
    - flutter_app/**
