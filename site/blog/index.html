<meta property="og:title" content=">_Fa blog — building an agent harness in public">
<meta property="og:description" content="Build notes, tokenomics and honest fuckups from the cross-platform AI agent harness in Dart.">
<meta property="og:url" content="https://fa1.dev/blog/">

<body>
<div class="bg" aria-hidden="true"></div>

<header class="nav">
  <div class="nav-inner">
    <a class="brand" href="../">
      <span class="brand-mark" aria-hidden="true">&gt;_</span>
      <span class="brand-name">Fa</span>
      <span class="brand-sub">fa1.dev</span>
    </a>
    <nav class="nav-links" aria-label="Sections">
      <a href="../#demo">Demo</a>
      <a href="../#install">Install</a>
      <a href="../#features">Features</a>

      <a href="https://pub.dev/packages/flutter_agent_harness" rel="noopener">pub.dev</a>
    </nav>
  </div>
</header>

<main class="blog-wrap">
  <h1 class="blog-title"><span class="prompt">&gt;_</span>Fa blog</h1>
  <p class="blog-sub">Build notes, tokenomics and honest fuckups from the harness that builds itself.</p>
  <div id="posts">Loading…</div>
</main>

<script>
fetch('posts.json')
  .then(r => r.json())
  .then(posts => {
    const root = document.getElementById('posts');
    if (!posts.length) { root.textContent = 'No posts yet.'; return; }
    root.innerHTML = '';
    for (const p of posts) {
      const a = document.createElement('a');
      a.className = 'post-card';
      a.href = 'post.html?p=' + encodeURIComponent(p.slug);
      a.innerHTML =
        (p.cover ? '<img src="posts/' + p.cover + '" alt="" loading="lazy">' : '') +
        '<h2></h2>' +
        '<div class="meta">' + esc(p.date) + (p.author ? ' · ' + esc(p.author) : '') + '</div>' +
        '<p></p>';
      a.querySelector('h2').textContent = p.title;
      a.querySelector('p').textContent = p.description;
      root.appendChild(a);
    }
  })
  .catch(() => { document.getElementById('posts').textContent = 'Failed to load posts.'; });

function esc(s) {
  return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
</script>
</body>
</html>
