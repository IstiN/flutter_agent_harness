<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter authorization</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070a10;
      color: #e8ecf2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      line-height: 1.5;
      color: #9aa3b2;
    }
    .error { color: #f87171; }
    .success { color: #4ade80; }
    a {
      color: #60a5fa;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Authorizing…</h1>
    <p id="message">Return to the Fa app to finish connecting.</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description') || error;
      const scheme = 'fah';

      const title = document.getElementById('title');
      const message = document.getElementById('message');

      if (code) {
        const nativeParams = new URLSearchParams({ code: code });
        if (state) nativeParams.set('state', state);
        const nativeUrl = scheme + '://oauth/openrouter?' + nativeParams.toString();

        // Redirect back to the native Fa app. Give Safari a moment to process
        // the URL scheme before showing the fallback link.
        try {
          window.location.replace(nativeUrl);
        } catch (e) {
          // Ignore; the fallback link below handles unsupported schemes.
        }
        setTimeout(function () {
          title.textContent = 'Authorized';
          title.className = 'success';
          message.innerHTML = 'If the Fa app did not open automatically, '
            + '<a href="' + encodeURI(nativeUrl) + '">tap here</a>.';
        }, 500);
      } else {
        title.textContent = 'Authorization failed';
        title.className = 'error';
        message.textContent = errorDescription
          ? 'Error: ' + errorDescription + '. Please close this tab and try again in the app.'
          : 'No authorization code was received. Please close this tab and try again in the app.';
      }
    })();
  </script>
</body>
</html>
