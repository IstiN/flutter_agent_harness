<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenRouter authorization</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070a10;
      color: #e8ecf2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      max-width: 420px;
      padding: 2rem;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 0.75rem;
    }
    p {
      margin: 0;
      line-height: 1.5;
      color: #9aa3b2;
    }
    .error { color: #f87171; }
    .success { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Authorizing…</h1>
    <p id="message">You can close this tab once the app updates.</p>
  </div>
  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const code = params.get('code');
      const state = params.get('state');
      const error = params.get('error');
      const errorDescription = params.get('error_description') || error;
      const nativeScheme = params.get('scheme');

      // Native iOS/macOS flow: the app cannot receive the code directly from
      // the browser, so redirect to its registered custom URL scheme. This must
      // happen before the web postMessage flow because the page unloads.
      if (nativeScheme && code) {
        const nativeParams = new URLSearchParams({ code: code });
        if (state) nativeParams.set('state', state);
        const nativeUrl = nativeScheme + '://oauth/openrouter?' + nativeParams.toString();
        try {
          window.location.replace(nativeUrl);
          // If the redirect did not unload the page (e.g. unknown scheme),
          // fall through and show a helpful message.
        } catch (e) {
          // Ignore and show the manual fallback below.
        }
      }

      const payload = {
        type: 'openrouter_oauth_code',
        code: code,
        error: error,
        ts: Date.now(),
      };

      // Notify the Fa web app that opened this window. A wildcard target is
      // required because the opener may be served from localhost during local
      // web development or from fa1.dev in production; the payload contains no
      // secrets (only the short-lived authorization code).
      let delivered = false;
      if (window.opener) {
        try {
          window.opener.postMessage(payload, '*');
          delivered = true;
        } catch (e) {
          // Cross-origin or closed opener; fall through to broadcast/fallback.
        }
      }

      // Safari's ITP may strip window.opener after the cross-origin OpenRouter
      // redirect, so also broadcast on a named channel. The Fa app listens on
      // the same channel as a fallback.
      try {
        const channel = new BroadcastChannel('openrouter_oauth');
        channel.postMessage(payload);
        channel.close();
        delivered = true;
      } catch (e) {
        // BroadcastChannel not supported (older browsers); delivery depends on
        // window.opener above.
      }

      // Last-resort fallback for older Safari / partitioned storage: write the
      // code to localStorage so the opener can pick it up by polling. Guard
      // the write so a stale code does not overwrite a newer one.
      try {
        const existing = window.localStorage.getItem('openrouter_oauth_code');
        const existingTs = existing ? (JSON.parse(existing).ts || 0) : 0;
        if (payload.ts >= existingTs) {
          window.localStorage.setItem('openrouter_oauth_code', JSON.stringify(payload));
        }
        delivered = true;
      } catch (e) {
        // Storage may be unavailable in private mode.
      }

      // Close the popup/tab once the code has been handed off. This works for
      // windows opened by script; give older WebKit a moment before attempting
      // to close, and also try to close the named popup from inside.
      function closePopup() {
        try { window.close(); } catch (e) { /* ignore */ }
        try {
          const named = window.open('', 'openrouter_oauth');
          if (named) named.close();
        } catch (e) { /* ignore */ }
      }
      if (delivered && code) {
        closePopup();
        setTimeout(closePopup, 150);
        setTimeout(closePopup, 500);
      }

      const title = document.getElementById('title');
      const message = document.getElementById('message');
      if (code) {
        title.textContent = 'Authorized';
        title.className = 'success';
        if (nativeScheme) {
          message.textContent = 'Return to the Fa app to finish connecting.';
        } else if (delivered) {
          message.textContent = 'You can close this tab and return to Fa.';
        } else {
          message.innerHTML = 'The app could not be notified automatically. '
            + 'Copy the code below, close this tab, and paste it into the Fa app:'
            + '<br><br><code style="user-select:all;word-break:break-all;background:#111827;padding:0.5rem 0.75rem;border-radius:0.375rem;color:#e8ecf2;">'
            + escapeHtml(code) + '</code>';
        }
      } else {
        title.textContent = 'Authorization failed';
        title.className = 'error';
        message.textContent = errorDescription
          ? 'Error: ' + errorDescription + '. Please close this tab and try again in the app.'
          : 'No authorization code was received. Please close this tab and try again in the app.';
      }

      function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
      }
    })();
  </script>
</body>
</html>
