<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fa — sign-in</title>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070a10;
      color: #e8ecf2;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card { max-width: 420px; padding: 2rem; }
    h1 { font-size: 1.5rem; font-weight: 600; margin: 0 0 0.75rem; }
    p { margin: 0; line-height: 1.5; color: #9aa3b2; }
    .error { color: #f87171; }
    .success { color: #4ade80; }
  </style>
</head>
<body>
  <div class="card">
    <h1 id="title">Finishing sign-in&hellip;</h1>
    <p id="message">You can close this window once the app updates.</p>
  </div>
  <script>
    // OAuth proxy callback receiver. The Fa web app opens the provider
    // sign-in in a popup and polls this window's location for
    // ?code=…&state=… (same-origin read); this page only needs to exist
    // at /oauth/callback and reflect the outcome for the human inside
    // the popup — the app closes it as soon as it observes the code.
    (function () {
      var params = new URLSearchParams(window.location.search);
      var title = document.getElementById('title');
      var message = document.getElementById('message');
      if (params.get('error')) {
        title.textContent = 'Sign-in failed';
        title.className = 'error';
        message.textContent = params.get('error_description') || params.get('error');
        message.className = 'error';
        return;
      }
      if (params.get('code')) {
        title.textContent = 'Sign-in complete';
        title.className = 'success';
        message.textContent = 'The app has your authorization. You can close this window.';
        return;
      }
      title.textContent = 'Missing authorization code';
      title.className = 'error';
      message.textContent = 'This page expects a ?code= or ?error= parameter. Close the window and try signing in again.';
      message.className = 'error';
    })();
  </script>
</body>
</html>
