<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Fa — Flutter Agent Harness: a coding agent with a real sandbox shell, running entirely in your browser.">
  <!-- Cache-bust the demo app on every deploy; GitHub Pages caches aggressively. -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Fa">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="alternate icon" type="image/png" href="favicon.png"/>

  <title>Fa</title>
  <link rel="manifest" href="manifest.json">
</head>
<body>
  <!-- Branded loading splash: renders before any JS loads, fades out when the
       Flutter engine renders its first frame (`flutter-first-frame` event). -->
  <style>
    body { background: #070a10; }
    #fah-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px;
      background:
        radial-gradient(720px 480px at 12% -6%, rgba(129, 140, 248, 0.16), transparent 70%),
        radial-gradient(820px 560px at 95% 30%, rgba(94, 234, 212, 0.10), transparent 70%),
        #070a10;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      transition: opacity 0.3s ease;
    }
    #fah-splash.fah-done { opacity: 0; pointer-events: none; }
    #fah-splash .fah-name { color: #e8eef7; font-size: 15px; font-weight: 600; letter-spacing: 0.04em; }
    #fah-splash .fah-bar {
      width: 168px; height: 3px; border-radius: 2px;
      background: rgba(148, 163, 184, 0.14); overflow: hidden;
    }
    #fah-splash .fah-bar::after {
      content: ""; display: block; width: 40%; height: 100%; border-radius: 2px;
      background: linear-gradient(90deg, #818cf8, #5eead4);
      animation: fah-shimmer 1.2s ease-in-out infinite;
    }
    @keyframes fah-shimmer {
      0% { transform: translateX(-110%); }
      100% { transform: translateX(430%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #fah-splash { transition: none; }
      #fah-splash .fah-bar::after { animation: none; width: 100%; }
    }
  </style>
  <div id="fah-splash" role="status" aria-label="Loading flutter_agent_harness">
    <!-- Canonical B3-square-accent vectors; keep in sync with icon/icon.svg. -->
    <svg width="72" height="72" viewBox="0 0 68 68" aria-hidden="true">
      <rect x="4" y="4" width="60" height="60" rx="18" fill="#1C1C1E" stroke="#3F8FF7" stroke-width="2"/>
      <path d="M15 28 L22 34 L15 40" fill="none" stroke="#3F8FF7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 42 V26 H38.5" fill="none" stroke="#F5F5F7" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M27 33.5 H35.5" fill="none" stroke="#F5F5F7" stroke-width="2.8" stroke-linecap="round"/>
      <circle cx="43" cy="36" r="5" fill="none" stroke="#F5F5F7" stroke-width="2.6"/>
      <path d="M48 31 V42" fill="none" stroke="#F5F5F7" stroke-width="2.6" stroke-linecap="round"/>
      <circle cx="48" cy="22" r="3.2" fill="#818CF8"/>
    </svg>
    <div class="fah-name">Fa</div>
    <div class="fah-bar"></div>
  </div>
  <script src="inline_script_1.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Stream helper for the on-device WebLLM provider (plain script so the
       Dart side can call it even while the module below is still loading). -->
  <script src="webllm_helpers.js"></script>
  <!-- Helpers for the on-device transformers.js provider (plain script, same
       reasoning as webllm_helpers.js). -->
  <script src="transformers_js_helpers.js"></script>
  <!-- WebLLM (@mlc-ai/web-llm, pinned): runs small LLMs on-device via WebGPU.
       Loaded as an ES module from jsdelivr and exposed as window.webllm for
       the Dart side (lib/webllm/). Version matches the interop bindings.
       Used chat-only: tool calling is the Dart-side prompt-tools wrapper's
       job, not the engine's native function-calling mode. -->
  <script type="module" src="inline_script_4.js"></script>
  <!-- Transformers.js (@huggingface/transformers, pinned): runs Gemma 4 ONNX
       on-device via ONNX Runtime Web + WebGPU — the web on-device path
       (lib/transformers_js/). v3.x has no Gemma 4 support, so this pins
       4.2.0 (the version family the webml-community/Gemma-4-WebGPU space
       runs). Loaded as an ES module
       from jsdelivr and exposed as window.transformersjs for the Dart side;
       onnxruntime-web's WASM/WebGPU assets load from jsdelivr automatically.
       Weights download from huggingface.co into CacheStorage on first use. -->
  <script type="module" src="inline_script_5.js"></script>
  <script src="fs_store.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
