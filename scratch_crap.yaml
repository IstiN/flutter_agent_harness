# Scratch config for the CRAP reproduction (rework gh-1433): same census
# as crap4dart.yaml but coverage is NOT required — CRAP is computed at 0%
# coverage, which makes CC directly visible in the score column. Used only
# to compare the _onMessageUpdate CC before/after the split; the CI gate
# (crap4dart.yaml + merged shard lcov) stays authoritative.
sources: [lib, bin]

exclude:
  - '**.g.dart'
  - '**.freezed.dart'
  - '**.mocks.dart'
  - 'build/**'
  - 'vendor/**'

crap:
  enabled: true
  threshold: 12.0

coverage:
  lcov_path: coverage/lcov.info
  required: false
  run_tests: false

gates:
  broken_goldens:
    enabled: false
  loc:
    enabled: false
  duplication:
    enabled: false
