# Android cross builds link through the NDK r28 LLVM toolchain wrapper for
# minSdk 21 (mirrors android/build.gradle's minSdkVersion). The 16 KB
# max-page-size flag makes every LOAD segment 0x4000-aligned so Play's
# 16 KB page-size gate passes (gh-746).
#
# The absolute paths below match the GitHub ubuntu-latest image
# (ANDROID_HOME=/usr/local/lib/android/sdk). On other hosts set the
# CARGO_TARGET_<TRIPLE>_LINKER / CC_<triple> / AR_<triple> environment
# variables — they take precedence over this file — or adjust the paths.

[target.aarch64-linux-android]
linker = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.armv7-linux-androideabi]
linker = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

[target.x86_64-linux-android]
linker = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
rustflags = ["-C", "link-arg=-Wl,-z,max-page-size=16384"]

# cc-rs needs explicit CC/CXX/AR for the cross targets (it otherwise probes a
# bare `<target>-clang` that does not exist in the NDK).
[env]
CC_aarch64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
CXX_aarch64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang++"
CC_armv7_linux_androideabi = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang"
CXX_armv7_linux_androideabi = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi21-clang++"
CC_x86_64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang"
CXX_x86_64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android21-clang++"
AR_aarch64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
AR_armv7_linux_androideabi = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
AR_x86_64_linux_android = "/usr/local/lib/android/sdk/ndk/28.2.13676358/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
