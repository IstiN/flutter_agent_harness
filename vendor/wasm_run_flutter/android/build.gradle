// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.example.wasm_run_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        // NOTE: when this plugin is built by a Flutter app (the normal path
        // here), the AGP version is governed by the app's
        // android/settings.gradle.kts pluginManagement (currently 9.0.1); this
        // classpath only matters for standalone builds. Keep it in sync with
        // the app so no legacy AGP that cannot run on Gradle 9.1.0 ships here.
        classpath 'com.android.tools.build:gradle:9.0.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 9 requires an explicit namespace (the manifest package attribute
    // is gone); the id matches the upstream package (issue #289).
    namespace 'com.example.wasm_run_flutter'

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app. AGP 9 + current androidx require
    // compileSdk >= 34 (issue #289: first real Android build on this tree).
    compileSdkVersion 36

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // NDK r28+ requires minSdk >= 21 (CXX1110); 21 also matches the app's
        // flutter_launcher_icons min_sdk_android (issue #289). The committed
        // src/main/jniLibs binaries are built against the API 21 sysroot.
        minSdkVersion 21
    }
}

// The Android .so binaries under src/main/jniLibs/ are COMMITTED, not built
// here — they are cross-compiled from the vendored Rust source in
// ../wasm_run/native with NDK r28 and -Wl,-z,max-page-size=16384 so every
// LOAD segment is 16 KB-aligned (gh-746: Play rejects 4 KB-aligned native
// libraries; the old CMakeLists "fix" passed the flag to a configure script
// that downloaded prebuilt upstream binaries and compiled nothing — the
// flag never reached a linker). To rebuild after changing the Rust source:
//
//   cd vendor/wasm_run/native
//   rustup target add aarch64-linux-android armv7-linux-androideabi \
//       x86_64-linux-android
//   cargo build --release --target aarch64-linux-android
//   cargo build --release --target armv7-linux-androideabi
//   cargo build --release --target x86_64-linux-android
//   cp target/<triple>/release/libwasm_run_dart.so \
//       ../wasm_run_flutter/android/src/main/jniLibs/<abi>/
//
// (The NDK toolchain paths and the 16 KB linker flag live in
// vendor/wasm_run/native/.cargo/config.toml.)
//
// x86 (i686) is intentionally not shipped: Flutter no longer targets it, so
// no variant of this app packages an x86 APK.
