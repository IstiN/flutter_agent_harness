// The Android Gradle Plugin builds the native code with the Android NDK.

group 'com.example.wasm_run_flutter'
version '1.0'

buildscript {
    repositories {
        google()
        mavenCentral()
    }

    dependencies {
        // The Android Gradle Plugin knows how to build native code with the NDK.
        // NOTE: when this plugin is built by a Flutter app (the normal path
        // here), the AGP version is governed by the app's
        // android/settings.gradle.kts pluginManagement (currently 9.0.1); this
        // classpath only matters for standalone builds. Keep it in sync with
        // the app so no legacy AGP that cannot run on Gradle 9.1.0 ships here.
        classpath 'com.android.tools.build:gradle:9.0.1'
    }
}

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

apply plugin: 'com.android.library'

android {
    // AGP 9 requires an explicit namespace (the manifest package attribute
    // is gone); the id matches the upstream package (issue #289).
    namespace 'com.example.wasm_run_flutter'

    // Bumping the plugin compileSdkVersion requires all clients of this plugin
    // to bump the version in their app. AGP 9 + current androidx require
    // compileSdk >= 34 (issue #289: first real Android build on this tree).
    compileSdkVersion 36

    // Match the host app's flutter.ndkVersion so a single NDK is used
    // (the vendored default 21.4.7075529 predates darwin-arm64).
    ndkVersion "28.2.13676358"

    // Invoke the shared CMake build with the Android Gradle Plugin.
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"

            // The default CMake version for the Android Gradle Plugin is 3.10.2.
            // https://developer.android.com/studio/projects/install-ndk#vanilla_cmake
            //
            // The Flutter tooling requires that developers have CMake 3.10 or later
            // installed. You should not increase this version, as doing so will cause
            // the plugin to fail to compile for some customers of the plugin.
            // version "3.10.2"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    defaultConfig {
        // NDK r28+ requires minSdk >= 21 (CXX1110); 21 also matches the app's
    // flutter_launcher_icons min_sdk_android (issue #289).
    minSdkVersion 21
    }
}
