<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>fa audio fixture</title>
</head>
<body>
  <!-- The AC8 self-serve scenario: a tab that plays audio, so
       chrome.tabs.query({audible: true}) finds it. Autoplay still needs
       the --autoplay-policy=no-user-gesture-required launch flag; the
       script retry carries pages where the attribute alone races. -->
  <audio id="beep" src="beep.wav" autoplay loop></audio>
  <span id="audio-page">yes</span>
  <script>
    (() => {
      'use strict';
      const beep = document.getElementById('beep');
      beep.volume = 1;
      const retry = () => beep.play().catch((e) => {
        window.__playError = String(e);
      });
      retry();
      // Media can be paused by focus/audio-focus churn; keep it playing
      // for the duration of the spec (loop + re-play on pause).
      beep.addEventListener('pause', retry);
      document.addEventListener('visibilitychange', retry);
    })();
  </script>
</body>
</html>
