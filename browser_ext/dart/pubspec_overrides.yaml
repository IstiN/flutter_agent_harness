# The root package pins the patched vendored dart_tui fork
# (keyboard-protocol fixes, LineEditor) via its own pubspec_overrides.yaml;
# path overrides do not travel through the fah path dep, so this package
# needs the same pin or fa_tui.dart fails to load against hosted dart_tui.
dependency_overrides:
  dart_tui:
    path: ../../vendor/dart_tui
